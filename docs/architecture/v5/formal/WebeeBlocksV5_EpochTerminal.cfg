  ProposalActor <- EpochTerminalProposalActor
  ProposalKind <- EpochTerminalProposalKind
  ProposalHead <- EpochTerminalProposalHead
  ProposalFinding <- EpochTerminalProposalFinding
  ProposalEpoch <- EpochTerminalProposalEpoch

  RejectionProposal <- EpochTerminalRejectionProposal
