SPECIFICATION SafetySpec

CONSTANTS
  Epochs <- CheckpointEpochs
  Heads <- CheckpointHeadsUniverse
  PRs <- CheckpointPRs
  Proposals <- CheckpointProposals
  Rejections <- CheckpointRejections
  Findings <- CheckpointFindings

  Owner <- MCOwner
  ExternalActor <- MCExternalActor

  ProposalActor <- CheckpointProposalActor
  ProposalKind <- CheckpointProposalKind
  ProposalHead <- CheckpointProposalHead
  ProposalFinding <- CheckpointProposalFinding
  ProposalEpoch <- CheckpointProposalEpoch

  RejectionProposal <- CheckpointRejectionProposal
  RejectionEpoch <- CheckpointRejectionEpoch
  RejectionHead <- CheckpointRejectionHead
  RejectionPR <- CheckpointRejectionPR
  RejectionFindings <- CheckpointRejectionFindings

  Applies <- CheckpointApplies
  LegacyFindings <- CheckpointLegacyFindings
  LegacyRejectedHeads <- CheckpointLegacyRejectedHeads
  CheckpointHeads <- CheckpointRequiredHeads
  InitialPRs <- CheckpointInitialPRs
  InitialPRHead <- CheckpointInitialPRHead
  InitialEpoch <- CheckpointInitialEpoch
  FaultInjection <- CheckpointFaultInjection

INVARIANTS
  TypeOK
  Inv_NoGuardGap
  Inv_LinearizedWasPrepared
  Inv_CommittedWasLinearized
  Inv_NoPositiveAfterTerminalFailure
  Inv_MergeNeverUsesTerminalHead
  Inv_MergeHasNoUnresolvedDurableFinding
  Inv_MergeRequiresCheckpoint
  Inv_MergeHasNoCorruptedProjection
  Inv_MergeRequiresObservableManifest
  Inv_V4RemovalRequiresImportedAuthority
  Inv_V5RemovalRequiresV4Fallback
  Inv_V4ProjectionPreservesTerminalHeads
  Inv_NoPendingAfterV5Removal
  Inv_EpochChangeDoesNotEraseFindings

CHECK_DEADLOCK FALSE
