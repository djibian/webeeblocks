SPECIFICATION SafetySpec

CONSTANTS
  Epochs <- OrderingEpochs
  Heads <- OrderingHeads
  PRs <- OrderingPRs
  Proposals <- OrderingProposals
  Rejections <- OrderingRejections
  Findings <- OrderingFindings

  Owner <- MCOwner
  ExternalActor <- MCExternalActor

  ProposalActor <- OrderingProposalActor
  ProposalKind <- OrderingProposalKind
  ProposalHead <- OrderingProposalHead
  ProposalFinding <- OrderingProposalFinding
  ProposalEpoch <- OrderingProposalEpoch

  RejectionProposal <- OrderingRejectionProposal
  RejectionEpoch <- OrderingRejectionEpoch
  RejectionHead <- OrderingRejectionHead
  RejectionPR <- OrderingRejectionPR
  RejectionFindings <- OrderingRejectionFindings

  Applies <- OrderingApplies
  LegacyFindings <- OrderingLegacyFindings
  LegacyRejectedHeads <- OrderingLegacyRejectedHeads
  CheckpointHeads <- OrderingCheckpointHeads
  InitialPRs <- OrderingInitialPRs
  InitialPRHead <- OrderingInitialPRHead
  InitialEpoch <- OrderingInitialEpoch
  FaultInjection <- OrderingFaultInjection

INVARIANTS
  TypeOK
  Inv_NoGuardGap
  Inv_LinearizedWasPrepared
  Inv_CommittedWasLinearized
  Inv_PoisonLinearizedWasPrepared
  Inv_PoisonCommittedWasLinearized
  Inv_NoPositiveAfterTerminalFailure
  Inv_MergeNeverUsesTerminalHead
  Inv_MergeHasNoUnresolvedDurableFinding
  Inv_MergeRequiresCheckpoint
  Inv_V4ProjectedCheckpointBlocksMerge
  Inv_MergeHasNoCorruptedProjection
  Inv_MergeRequiresObservableManifest
  Inv_V4RemovalRequiresImportedAuthority
  Inv_V5RemovalRequiresV4Fallback
  Inv_V4ProjectionPreservesTerminalHeads
  Inv_NoPendingAfterV5Removal
  Inv_EpochChangeDoesNotEraseFindings
  Inv_OperationalEpochsAreCurrentlyHealthy
  Inv_PendingRejectionBlocksPositiveEligibility
  Inv_ObservedTrustedNegativeBlocksPositiveEligibility
  Inv_UnreconciledDuplicateBlocksPositiveEligibility
  Inv_LateRefutationBlocksV5Merge
  Inv_V4ProjectedTrunkBlockBlocksMerge
  Inv_NoTwoMergedPRsShareExactHead
  Inv_ActiveEpochNeverRetired

CHECK_DEADLOCK FALSE
