SPECIFICATION SafetySpec

CONSTANTS
  Epochs <- CoreEpochs
  Heads <- CoreHeads
  PRs <- CorePRs
  Proposals <- CoreProposals
  Rejections <- CoreRejections
  Findings <- CoreFindings

  Owner <- MCOwner
  ExternalActor <- MCExternalActor

  ProposalActor <- CoreProposalActor
  ProposalKind <- CoreProposalKind
  ProposalHead <- CoreProposalHead
  ProposalFinding <- CoreProposalFinding
  ProposalEpoch <- CoreProposalEpoch

  RejectionProposal <- CoreRejectionProposal
  RejectionEpoch <- CoreRejectionEpoch
  RejectionHead <- CoreRejectionHead
  RejectionPR <- CoreRejectionPR
  RejectionFindings <- CoreRejectionFindings

  Applies <- CoreApplies
  LegacyFindings <- CoreLegacyFindings
  LegacyRejectedHeads <- CoreLegacyRejectedHeads
  CheckpointHeads <- CoreCheckpointHeads
  InitialPRs <- CoreInitialPRs
  InitialPRHead <- CoreInitialPRHead
  InitialEpoch <- CoreInitialEpoch
