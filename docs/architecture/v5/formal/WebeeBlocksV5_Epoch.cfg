SPECIFICATION SafetySpec

CONSTANTS
  Epochs <- EpochEpochs
  Heads <- EpochHeads
  PRs <- EpochPRs
  Proposals <- EpochProposals
  Rejections <- EpochRejections
  Findings <- EpochFindings

  Owner <- MCOwner
  ExternalActor <- MCExternalActor

  ProposalActor <- EpochProposalActor
  ProposalKind <- EpochProposalKind
  ProposalHead <- EpochProposalHead
  ProposalFinding <- EpochProposalFinding
  ProposalEpoch <- EpochProposalEpoch

  RejectionProposal <- EpochRejectionProposal
  RejectionEpoch <- EpochRejectionEpoch
  RejectionHead <- EpochRejectionHead
  RejectionPR <- EpochRejectionPR
  RejectionFindings <- EpochRejectionFindings

  Applies <- EpochApplies
  LegacyFindings <- EpochLegacyFindings
  LegacyRejectedHeads <- EpochLegacyRejectedHeads
  CheckpointHeads <- EpochCheckpointHeads
  InitialPRs <- EpochInitialPRs
  InitialPRHead <- EpochInitialPRHead
  InitialEpoch <- EpochInitialEpoch
  FaultInjection <- EpochFaultInjection

INVARIANTS
  TypeOK
  Inv_NoGuardGap
  Inv_LinearizedWasPrepared
  Inv_CommittedWasLinearized
  Inv_NoPositiveAfterTerminalFailure
  Inv_MergeNeverUsesTerminalHead
  Inv_MergeHasNoUnresolvedDurableFinding
  Inv_MergeRequiresCheckpoint
  Inv_V4ProjectedCheckpointBlocksMerge
  Inv_MergeHasNoCorruptedProjection
  Inv_MergeRequiresObservableManifest
  Inv_V4RemovalRequiresImportedAuthority
  Inv_V5RemovalRequiresV4Fallback
  Inv_V4ProjectionPreservesTerminalHeads
  Inv_NoPendingAfterV5Removal
  Inv_EpochChangeDoesNotEraseFindings

CHECK_DEADLOCK FALSE
