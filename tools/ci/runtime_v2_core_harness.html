<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Runtime v2 reactive semantics</title>
<script src="../../plugins/robot_windows/blockly_v2/vendor/blockly_compressed.js"></script>
<script src="../../plugins/robot_windows/blockly_v2/vendor/blocks_compressed.js"></script>
<script src="../../plugins/robot_windows/blockly_v2/vendor/msg/fr.js"></script>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js"></script>
<script src="../../plugins/robot_windows/blockly/webeeblocks/activity_profiles.js"></script>
<script src="../../plugins/robot_windows/blockly/webeeblocks/activities.js"></script>
<script src="../../plugins/robot_windows/blockly/webeeblocks/semantic_ast.js"></script>
<script src="../../plugins/robot_windows/blockly/webeeblocks/interpreter.js"></script>
<script src="../../plugins/robot_windows/blockly/webeeblocks/activity_contract.js"></script>
</head>
<body>
<xml id="toolbox" style="display:none">
  <category name="Vol">
    <block type="webeeblocks_v2_takeoff"></block>
    <block type="webeeblocks_v2_move"></block>
    <block type="webeeblocks_v2_light"></block>
    <block type="webeeblocks_v2_land"></block>
  </category>
  <category name="Capteurs"><block type="webeeblocks_v2_range"></block></category>
  <category name="Contrôle">
    <block type="controls_if"></block>
    <block type="controls_repeat_ext"></block>
    <block type="logic_compare"></block>
    <block type="math_number"></block>
  </category>
</xml>
<div id="blocklyDiv" style="height:320px;width:100%"></div>
<pre id="result">RUNNING</pre>
<xml id="reactiveProgram" style="display:none">
  <block type="webeeblocks_v2_takeoff">
    <field name="HEIGHT">0.5</field>
    <next><block type="controls_repeat_ext">
      <value name="TIMES"><block type="math_number"><field name="NUM">3</field></block></value>
      <statement name="DO"><block type="controls_if">
        <mutation else="1"></mutation>
        <value name="IF0"><block type="logic_compare">
          <field name="OP">LT</field>
          <value name="A"><block type="webeeblocks_v2_range"><field name="DIRECTION">front</field></block></value>
          <value name="B"><block type="math_number"><field name="NUM">0.5</field></block></value>
        </block></value>
        <statement name="DO0"><block type="webeeblocks_v2_move"><field name="DIRECTION">left</field><field name="DISTANCE">0.3</field></block></statement>
        <statement name="ELSE"><block type="webeeblocks_v2_move"><field name="DIRECTION">forward</field><field name="DISTANCE">0.3</field></block></statement>
      </block></statement>
      <next><block type="webeeblocks_v2_land"></block></next>
    </block></next>
  </block>
</xml>
<script>
(async function() {
  var result = document.getElementById('result');
  function fail(message) {
    result.textContent = 'FAIL: ' + message;
    result.setAttribute('data-status', 'FAIL');
    throw new Error(message);
  }
  function assert(condition, message) { if (!condition) fail(message); }
  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function expectReject(promise, pattern, label) {
    return promise.then(function() { fail(label + ' did not reject'); }, function(error) {
      assert(pattern.test(String(error)), label + ' rejected for wrong reason: ' + String(error));
    });
  }

  try {
    assert(Blockly.VERSION === '13.2.1', 'expected product Blockly 13.2.1, got ' + Blockly.VERSION);
    var profile = WebeeBlocksActivityProfiles.resolveById(
      WebeeBlocksActivities.DOCUMENT,
      'reactive-obstacle-v2',
      WebeeBlocksActivities.BLOCK_CATALOG
    );
    assert(profile.toolbox.every(function(type) { return typeof type === 'string'; }), 'resolved toolbox entries must remain block type strings');

    var workspace = Blockly.inject('blocklyDiv', {toolbox: document.getElementById('toolbox'), sounds:false});
    Blockly.Xml.domToWorkspace(document.getElementById('reactiveProgram'), workspace);

    var expected = {version:1, semantics:'webeeblocks-ast-v1', program:[
      {kind:'takeoff', height_m:0.5},
      {kind:'repeat', count:3, body:[
        {kind:'if', condition:{kind:'compare', op:'LT', left:{kind:'range', direction:'front', unit:'m'}, right:{kind:'number', value:0.5}}, then:[{kind:'move', direction:'left', distance_m:0.3}], else:[{kind:'move', direction:'forward', distance_m:0.3}]}
      ]},
      {kind:'land'}
    ]};
    assert(JSON.stringify(WebeeBlocksSemanticAst.compileWorkspace(workspace)) === JSON.stringify(expected), 'product AST differs');

    var samples = [0.4, 0.8, 0.3];
    var trace = [];
    var rangeReadCount = 0;
    var capabilities = {actions:['takeoff','move','vertical','turn','wait','set_speed','set_light','land'], rangeDirections:['front'], moveDirections:['forward','left'], verticalDirections:['up','down']};
    function backendFor(caps) {
      return {
        capabilities: caps,
        takeoff: async function(height) { trace.push(['takeoff', height]); },
        land: async function() { trace.push(['land']); },
        move: async function(direction, distance) { trace.push(['move', direction, distance]); },
        vertical: async function(direction, distance) { trace.push(['vertical', direction, distance]); },
        turn: async function(angle) { trace.push(['turn', angle]); },
        wait: async function(seconds) { trace.push(['wait', seconds]); },
        setSpeed: async function(speed) { trace.push(['set_speed', speed]); },
        setLight: async function(color) { trace.push(['set_light', color]); },
        readRange: async function(direction) {
          rangeReadCount += 1;
          var value = samples.shift();
          trace.push(['range', direction, value]);
          return value;
        }
      };
    }

    var onAstCount = 0;
    await WebeeBlocksActivityContract.execute(profile, workspace, WebeeBlocksSemanticAst, WebeeBlocksInterpreter, backendFor(capabilities), {
      maxSteps: 200,
      onAst: function(ast) {
        assert(trace.length === 0, 'onAst ran after backend action');
        assert(JSON.stringify(ast) === JSON.stringify(expected), 'onAst received wrong AST');
        onAstCount++;
      }
    });
    assert(onAstCount === 1, 'onAst must run exactly once');
    var expectedTrace = [['takeoff',0.5],['range','front',0.4],['move','left',0.3],['range','front',0.8],['move','forward',0.3],['range','front',0.3],['move','left',0.3],['land']];
    assert(JSON.stringify(trace) === JSON.stringify(expectedTrace), 'reactive trace differs: ' + JSON.stringify(trace));
    assert(rangeReadCount === 3, 'range(front) must be re-read once per repeat iteration');
    assert(samples.length === 0, 'scripted range samples were not all consumed');

    var lightWorkspace = new Blockly.Workspace();
    var lightTakeoff = lightWorkspace.newBlock('webeeblocks_v2_takeoff');
    var lightBlue = lightWorkspace.newBlock('webeeblocks_v2_light');
    var lightOff = lightWorkspace.newBlock('webeeblocks_v2_light');
    var lightLand = lightWorkspace.newBlock('webeeblocks_v2_land');
    lightTakeoff.setFieldValue('0.5', 'HEIGHT');
    lightBlue.setFieldValue('blue', 'COLOR');
    lightOff.setFieldValue('off', 'COLOR');
    lightTakeoff.nextConnection.connect(lightBlue.previousConnection);
    lightBlue.nextConnection.connect(lightOff.previousConnection);
    lightOff.nextConnection.connect(lightLand.previousConnection);
    var expectedLight = {version:1, semantics:'webeeblocks-ast-v1', program:[
      {kind:'takeoff', height_m:0.5},
      {kind:'set_light', color:'blue'},
      {kind:'set_light', color:'off'},
      {kind:'land'}
    ]};
    assert(JSON.stringify(WebeeBlocksSemanticAst.compileWorkspace(lightWorkspace)) === JSON.stringify(expectedLight), 'light AST differs');
    trace = [];
    await WebeeBlocksActivityContract.execute(profile, lightWorkspace, WebeeBlocksSemanticAst, WebeeBlocksInterpreter, backendFor(capabilities), {maxSteps: 20});
    assert(JSON.stringify(trace) === JSON.stringify([['takeoff',0.5],['set_light','blue'],['set_light','off'],['land']]), 'light interpreter trace differs: ' + JSON.stringify(trace));

    var missingLightAction = clone(capabilities);
    missingLightAction.actions = capabilities.actions.filter(function(kind) { return kind !== 'set_light'; });
    trace = [];
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, lightWorkspace, WebeeBlocksSemanticAst, WebeeBlocksInterpreter, backendFor(missingLightAction)),
      /backend action capability unavailable: set_light/,
      'missing light backend capability'
    );
    assert(trace.length === 0, 'missing light capability executed backend action');

    var invalidLightCompiler = {
      compileWorkspace: function() {
        return {version:1, semantics:'webeeblocks-ast-v1', program:[
          {kind:'takeoff', height_m:0.5}, {kind:'set_light', color:'infrared'}, {kind:'land'}
        ]};
      }
    };
    trace = [];
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, lightWorkspace, invalidLightCompiler, WebeeBlocksInterpreter, backendFor(capabilities)),
      /unsupported light color infrared/,
      'invalid light color'
    );
    assert(trace.length === 0, 'invalid light color executed backend action');
    lightWorkspace.dispose();

    // Standard Blockly block deliberately outside the resolved Runtime v2 toolbox.
    var forbiddenWorkspace = new Blockly.Workspace();
    forbiddenWorkspace.newBlock('logic_negate');
    trace = [];
    var compilerCalled = false;
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, forbiddenWorkspace, {compileWorkspace:function(){compilerCalled=true;return expected;}}, WebeeBlocksInterpreter, backendFor(capabilities)),
      /block forbidden by profile: logic_negate/,
      'known block outside profile'
    );
    assert(!compilerCalled, 'forbidden workspace reached compiler');
    assert(trace.length === 0, 'forbidden workspace executed backend action');
    forbiddenWorkspace.dispose();

    // Direction requested by the AST but removed from the activity profile.
    var deniedDirection = clone(profile);
    deniedDirection.runtime.rangeDirections = [];
    trace = [];
    samples = [0.4,0.8,0.3];
    rangeReadCount = 0;
    await expectReject(
      WebeeBlocksActivityContract.execute(deniedDirection, workspace, WebeeBlocksSemanticAst, WebeeBlocksInterpreter, backendFor(capabilities)),
      /range capability unavailable in profile: front/,
      'profile range direction'
    );
    assert(trace.length === 0, 'profile direction rejection executed backend action');
    assert(rangeReadCount === 0, 'profile direction rejection read a sensor');

    // Profile permits the mission, but the selected backend does not provide its sensor capability.
    var missingBackendRange = {actions:capabilities.actions, rangeDirections:[], moveDirections:capabilities.moveDirections, verticalDirections:capabilities.verticalDirections};
    trace = [];
    samples = [0.4,0.8,0.3];
    rangeReadCount = 0;
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, workspace, WebeeBlocksSemanticAst, WebeeBlocksInterpreter, backendFor(missingBackendRange)),
      /backend range capability unavailable: front/,
      'backend range capability'
    );
    assert(trace.length === 0, 'backend capability rejection executed action');
    assert(rangeReadCount === 0, 'backend capability rejection read a sensor');

    // Unsupported AST kind must be rejected by the activity contract before the interpreter/backend.
    var unsupportedCompiler = {
      compileWorkspace: function() {
        return {version:1, semantics:'webeeblocks-ast-v1', program:[
          {kind:'takeoff', height_m:0.5}, {kind:'teleport'}, {kind:'land'}
        ]};
      }
    };
    trace = [];
    rangeReadCount = 0;
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, workspace, unsupportedCompiler, WebeeBlocksInterpreter, backendFor(capabilities)),
      /AST statement forbidden by profile: teleport/,
      'unsupported AST statement'
    );
    assert(trace.length === 0, 'unsupported AST rejection executed backend action');
    assert(rangeReadCount === 0, 'unsupported AST rejection read a sensor');

    // Repeat count bypassing Blockly UI constraints must be rejected before any action.
    var repeatOutOfBoundsCompiler = {
      compileWorkspace: function(ws) {
        var ast = clone(WebeeBlocksSemanticAst.compileWorkspace(ws));
        ast.program[1].count = 21;
        return ast;
      }
    };
    trace = [];
    rangeReadCount = 0;
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, workspace, repeatOutOfBoundsCompiler, WebeeBlocksInterpreter, backendFor(capabilities)),
      /repeat.count outside profile bounds: 21/,
      'repeat bound bypass'
    );
    assert(trace.length === 0, 'repeat bound rejection executed backend action');
    assert(rangeReadCount === 0, 'repeat bound rejection read a sensor');

    // Simulate an AST that bypasses the FieldNumber UI bound; preflight must still stop it.
    var outOfBoundsCompiler = {
      compileWorkspace: function(ws) {
        var ast = clone(WebeeBlocksSemanticAst.compileWorkspace(ws));
        ast.program[1].body[0].then[0].distance_m = 2.1;
        return ast;
      }
    };
    trace = [];
    samples = [0.4,0.8,0.3];
    rangeReadCount = 0;
    await expectReject(
      WebeeBlocksActivityContract.execute(profile, workspace, outOfBoundsCompiler, WebeeBlocksInterpreter, backendFor(capabilities)),
      /move.distance_m outside profile bounds: 2.1/,
      'AST bound bypass'
    );
    assert(trace.length === 0, 'AST bound rejection executed backend action');
    assert(rangeReadCount === 0, 'AST bound rejection read a sensor');

    var xml = Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
    var roundTrip = new Blockly.Workspace();
    Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(xml), roundTrip);
    assert(JSON.stringify(WebeeBlocksSemanticAst.compileWorkspace(roundTrip)) === JSON.stringify(expected), 'XML round-trip changed AST');
    roundTrip.dispose();

    result.textContent = 'PASS Runtime v2 modern Blockly reactive semantics -> AST -> fail-closed preflight -> shared interpreter';
    result.setAttribute('data-status', 'PASS');
  } catch (error) {
    if (result.getAttribute('data-status') !== 'FAIL') fail(error.message || String(error));
  }
})();
</script>
</body>
</html>
