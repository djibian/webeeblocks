<script>(async function(){var result=document.getElementById('result');function fail(m){result.textContent='FAIL: '+m;result.setAttribute('data-status','FAIL');throw new Error(m);}function assert(c,m){if(!c)fail(m);}try{var profile=WebeeBlocksActivityProfiles.resolveById(WebeeBlocksActivities.DOCUMENT,'reactive-obstacle-v2',WebeeBlocksActivities.BLOCK_CATALOG);assert(profile.toolbox.every(function(type){return typeof type==='string';}),'resolved toolbox entries must remain block type strings');var workspace=Blockly.inject('blocklyDiv',{toolbox:document.getElementById('toolbox')});Blockly.Xml.domToWorkspace(document.getElementById('reactiveProgram'),workspace);var ast=WebeeBlocksSemanticAst.compileWorkspace(workspace);var expected={version:1,semantics:'webeeblocks-ast-v1',program:[{kind:'takeoff',height_m:0.5},{kind:'repeat',count:3,body:[{kind:'if',condition:{kind:'compare',op:'LT',left:{kind:'range',direction:'front',unit:'m'},right:{kind:'number',value:0.5}},then:[{kind:'move',direction:'left',distance_m:0.3}],else:[{kind:'move',direction:'forward',distance_m:0.3}]}]},{kind:'land'}]};assert(JSON.stringify(ast)===JSON.stringify(expected),'product AST differs');var samples=[0.4,0.8,0.3],trace=[];var capabilities={actions:['takeoff','move','vertical','turn','wait','set_speed','land'],rangeDirections:['front'],moveDirections:['forward','left'],verticalDirections:['up','down']};var backend={capabilities:capabilities,takeoff:async function(h){trace.push(['takeoff',h]);},land:async function(){trace.push(['land']);},move:async function(d,x){trace.push(['move',d,x]);},vertical:async function(d,x){trace.push(['vertical',d,x]);},turn:async function(a){trace.push(['turn',a]);},wait:async function(s){trace.push(['wait',s]);},setSpeed:async function(s){trace.push(['set_speed',s]);},readRange:async function(d){var v=samples.shift();trace.push(['range',d,v]);return v;}};await WebeeBlocksActivityContract.execute(profile,workspace,WebeeBlocksSemanticAst,WebeeBlocksInterpreter,backend,{maxSteps:200});var expectedTrace=[['takeoff',0.5],['range','front',0.4],['move','left',0.3],['range','front',0.8],['move','forward',0.3],['range','front',0.3],['move','left',0.3],['land']];assert(JSON.stringify(trace)===JSON.stringify(expectedTrace),'reactive trace differs: '+JSON.stringify(trace));var denied=WebeeBlocksActivityProfiles.resolveById(WebeeBlocksActivities.DOCUMENT,'reactive-obstacle-v2',WebeeBlocksActivities.BLOCK_CATALOG);denied.runtime.rangeDirections=[];var actions=0;function countingBackend(caps){return{capabilities:caps,takeoff:async function(){actions++;},land:async function(){actions++;},move:async function(){actions++;},vertical:async function(){actions++;},turn:async function(){actions++;},wait:async function(){actions++;},setSpeed:async function(){actions++;},readRange:async function(){actions++;return 0.4;}};}var rejected=false;try{await WebeeBlocksActivityContract.execute(denied,workspace,WebeeBlocksSemanticAst,WebeeBlocksInterpreter,countingBackend(capabilities));}catch(e){rejected=/range capability unavailable in profile/.test(String(e));}assert(rejected,'missing range capability was not rejected');assert(actions===0,'profile preflight executed backend action');var narrowCaps={actions:['takeoff','move','land'],rangeDirections:['front'],moveDirections:['forward'],verticalDirections:[]};rejected=false;try{await WebeeBlocksActivityContract.execute(profile,workspace,WebeeBlocksSemanticAst,WebeeBlocksInterpreter,countingBackend(narrowCaps));}catch(e){rejected=/backend move direction unavailable: left/.test(String(e));}assert(rejected,'missing backend move direction was not rejected');assert(actions===0,'backend directional preflight executed action');var xml=Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace)),rt=new Blockly.Workspace();Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(xml),rt);assert(JSON.stringify(WebeeBlocksSemanticAst.compileWorkspace(rt))===JSON.stringify(expected),'XML round-trip changed AST');rt.dispose();result.textContent='PASS Runtime v2 resolved profile -> real Blockly -> AST -> preflight -> interpreter';result.setAttribute('data-status','PASS');}catch(e){if(result.getAttribute('data-status')!=='FAIL')fail(e.message||String(e));}})();</script></body></html>
