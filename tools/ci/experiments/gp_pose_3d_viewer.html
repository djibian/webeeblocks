<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Grand Prix — vue 3D passive</title>
<style>
html,body{margin:0;height:100%;background:#081422;color:#e8f1fc;font:14px system-ui}
header{padding:9px 17px;background:#162b43;display:flex;gap:22px;align-items:center}
header strong{font-size:18px}small{color:#a7bbd0}
#view{width:100%;height:calc(100vh - 57px);display:block}
#status{margin-left:auto}
</style>
</head>
<body>
<header><strong>Grand Prix — vue 3D passive</strong>
<small>Présentation uniquement · aucune commande Webots</small>
<span id="status">Initialisation…</span></header>
<canvas id="view"></canvas>
<script>
'use strict';
const canvas=document.getElementById('view');
const status=document.getElementById('status');
const gl=canvas.getContext('webgl',{antialias:true,depth:true,preserveDrawingBuffer:true});
if(!gl){status.textContent='WebGL indisponible';throw Error('WebGL unavailable');}
const vert='attribute vec3 p;attribute vec3 c;varying vec3 color;uniform vec3 eye,right,up,forward;uniform float aspect;void main(){vec3 v=p-eye;float z=dot(v,forward);float f=1.68;float a=(30.0+0.1)/(30.0-0.1);float b=-2.0*30.0*0.1/(30.0-0.1);gl_Position=vec4(dot(v,right)*f/aspect,dot(v,up)*f,a*z+b,z);color=c;}';
const frag='precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.0);}';
function shader(kind,source){
  const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const loc={p:gl.getAttribLocation(prog,'p'),c:gl.getAttribLocation(prog,'c'),
 eye:gl.getUniformLocation(prog,'eye'),right:gl.getUniformLocation(prog,'right'),
 up:gl.getUniformLocation(prog,'up'),forward:gl.getUniformLocation(prog,'forward'),
 aspect:gl.getUniformLocation(prog,'aspect')};
function norm(a){const n=Math.hypot(...a);return a.map(x=>x/n);}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
const eye=[6,-5,6],target=[2.5,1.2,.3],forward=norm(target.map((x,i)=>x-eye[i]));
const right=norm(cross(forward,[0,0,1])),up=cross(right,forward);
gl.uniform3fv(loc.eye,eye);gl.uniform3fv(loc.right,right);
gl.uniform3fv(loc.up,up);gl.uniform3fv(loc.forward,forward);
const faces=[[0,1,2,0,2,3],[4,6,5,4,7,6],[0,4,5,0,5,1],
 [3,2,6,3,6,7],[0,3,7,0,7,4],[1,5,6,1,6,2]];
function cube(buffer,pos,size,col,orientation){
 const x=size[0]/2,y=size[1]/2,z=size[2]/2;
 const vertices=[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],
                 [-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]];
 const shades=[.66,.95,.78,.86,.71,.80];
 for(let face=0;face<6;face++)for(let id of faces[face]){
  const v=vertices[id];
  const w=orientation?[
   orientation[0]*v[0]+orientation[1]*v[1]+orientation[2]*v[2],
   orientation[3]*v[0]+orientation[4]*v[1]+orientation[5]*v[2],
   orientation[6]*v[0]+orientation[7]*v[1]+orientation[8]*v[2]]:v;
  buffer.push(pos[0]+w[0],pos[1]+w[1],pos[2]+w[2],
    ...col.map(value=>value*shades[face]));
 }
}
function upload(data){
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
 return {buffer:buffer,count:data.length/6};
}
function draw(mesh){
 if(!mesh)return;
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.buffer);
 gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,24,0);
 gl.vertexAttribPointer(loc.c,3,gl.FLOAT,false,24,12);
 gl.enableVertexAttribArray(loc.p);gl.enableVertexAttribArray(loc.c);
 gl.drawArrays(gl.TRIANGLES,0,mesh.count);
}
let scenery=null,drone=null,pose=null,lastIncarnation=null;
let sequence=0,received=0,dropped=0,errors=0,frames=0,started=performance.now(),lastDraw=0;
let polling=false; // Never accumulate HTTP requests when the visual consumer is slow.
const metrics=window.viewerMetrics={webgl:true,frames:0,fps:0,received:0,
 dropped:0,errors:0,incarnations:0,resolution:null,staticBoxes:0};
fetch('/scene').then(r=>r.json()).then(scene=>{
 const a=[];
 cube(a,[2.5,1.25,-.011],[7.2,4.7,.02],[.11,.18,.26]);
 for(const box of scene.boxes)cube(a,box.position,box.size,box.color);
 scenery=upload(a);metrics.staticBoxes=scene.boxes.length;
 metrics.worldSha256=scene.world_sha256;
}).catch(()=>{errors++;});
async function poll(){
 if(polling)return;
 polling=true;
 try{
  const res=await fetch('/pose',{cache:'no-store'});
  if(!res.ok)throw Error('pose HTTP error');
  const next=await res.json();
  // On producer restart the new presentation incarnation may start at seq=1.
  const changed=!!next&&lastIncarnation!==null&&next.incarnation!==lastIncarnation;
  if(next&&(changed||next.sequence>sequence)){
   if(changed){
    pose=null;metrics.incarnations++;
    if(drone)gl.deleteBuffer(drone.buffer);drone=null;
   }
   lastIncarnation=next.incarnation;
   dropped+=changed?0:Math.max(0,next.sequence-sequence-1);
   sequence=next.sequence;received++;
   pose=next.valid?next:null;
   if(drone)gl.deleteBuffer(drone.buffer);drone=null;
   if(pose){
    const a=[],p=pose.position,orientation=pose.orientation;
    cube(a,p,[.11,.11,.028],[.19,.82,.97],orientation);
    for(const x of [-.095,.095])for(const y of [-.095,.095])
     cube(a,[p[0]+x,p[1]+y,p[2]],[.065,.065,.009],[.94,.79,.22]);
    drone=upload(a);
   }
  }
 }catch(_){errors++;}finally{polling=false;}
 metrics.received=received;metrics.errors=errors;metrics.dropped=dropped;
 metrics.poseSeq=sequence;metrics.poseTimeMs=pose?pose.time_ms:null;
 metrics.poseValid=!!pose;metrics.incarnation=lastIncarnation;
}
setInterval(poll,33);
function frame(now){
 requestAnimationFrame(frame);
 if(now-lastDraw<1000/30)return;
 lastDraw=now;
 const w=Math.max(1,Math.round(canvas.clientWidth*devicePixelRatio));
 const h=Math.max(1,Math.round(canvas.clientHeight*devicePixelRatio));
 if(canvas.width!==w||canvas.height!==h){
  canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);
 }
 gl.uniform1f(loc.aspect,w/h);gl.enable(gl.DEPTH_TEST);
 gl.clearColor(.035,.085,.14,1);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 draw(scenery);draw(drone);
 frames++;metrics.frames=frames;metrics.fps=frames*1000/Math.max(1,now-started);
 metrics.resolution=[w,h];
 // rAF draw submissions are NOT proof of frames physically presented.
 status.textContent=metrics.fps.toFixed(1)+' dessins/s estimés · t='+
  (pose?pose.time_ms:'—')+' ms · seq='+sequence+' · poses ignorées='+dropped;
}
requestAnimationFrame(frame);
</script>
</body></html>
