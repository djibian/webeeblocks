# Derived for the offline WebeeBlocks qualification shell from the R2025a
# Crazyflie.proto at Webots commit c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b.
# Device names, propeller thrust/torque constants, bounding object and physics are
# preserved. External CAD/texture-only visuals are replaced with local primitives
# so the qualification artifact has no dependency on a system Webots project tree.

PROTO QualificationCrazyflieR2025a [
  field SFVec3f    translation     0 0 0.015
  field SFRotation rotation        0 0 1 0
  field SFString   name            "Crazyflie"
  field SFString   controller      "crazyflie"
  field MFString   controllerArgs  []
  field SFString   window          "<generic>"
  field SFString   customData      ""
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
  field MFNode     extensionSlot   []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller IS controller
    controllerArgs IS controllerArgs
    window IS window
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    name IS name
    model "Bitcraze's Crazyflie — WebeeBlocks qualification shell"
    children [
      Pose {
        translation 0 0 -0.015
        children [
          Group {
            children IS extensionSlot
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.12 0.12 0.12
              roughness 0.7
              metalness 0
            }
            geometry Box {
              size 0.055 0.055 0.012
            }
          }
        ]
      }
      Pose {
        translation 0 0 0.01
        children [
          DistanceSensor {
            rotation 0 0 1 -1.57
            name "range_right"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            rotation 0 0 1 3.14
            name "range_back"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            rotation 0 0 1 1.57
            name "range_left"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            name "range_front"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
        ]
      }
      Camera {
        translation 0.03 0 0.01
        fieldOfView 0.87
        width 324
        height 324
      }
      GPS {
      }
      Gyro {
      }
      InertialUnit {
        name "inertial_unit"
      }
      DEF M1 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.031 -0.031 0.008
        thrustConstants -4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m1_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.031 -0.031 0.008
          children [
            DEF FASTHELIX Shape {
              appearance PBRAppearance {
                baseColor 0.1 0.1 0.1
                metalness 0
              }
              geometry Cylinder {
                height 0.001
                radius 0.025
              }
            }
          ]
        }
        slowHelix Solid {
          translation 0.031 -0.031 0.008
          children [
            DEF PROP_SHAPE Shape {
              appearance DEF PLASTIC PBRAppearance {
                baseColor 0 0 0
                metalness 0.3
              }
              geometry Box {
                size 0.05 0.006 0.001
              }
            }
          ]
        }
      }
      DEF M2 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.031 -0.031 0.008
        thrustConstants 4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m2_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.031 -0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix Solid {
          translation -0.031 -0.031 0.008
          children [
            USE PROP_SHAPE
          ]
        }
      }
      DEF M3 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.031 0.031 0.008
        thrustConstants -4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m3_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.031 0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix Solid {
          translation -0.031 0.031 0.008
          children [
            USE PROP_SHAPE
          ]
        }
      }
      DEF M4 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.031 0.031 0.008
        thrustConstants 4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m4_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.031 0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix Solid {
          translation 0.031 0.031 0.007
          children [
            USE PROP_SHAPE
          ]
        }
      }
    ]
    boundingObject Cylinder {
      height 0.03
      radius 0.05
