# Temporary non-decision A5 Draft witness. Does NOT provide CI Gate or pupil PASS.
# Genuine R2025a sensor readings and native attempt identity failures; no pupil flight.
name: Activity 5 Draft sensors and native attempt counterexamples

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-progression-a5-draft.yml'
      - 'tools/ci/test_workflow_contract.py'
      - 'tools/ci/test_progression_reactive_L_*.py'
      - 'tools/ci/run_classroom_reactive_L_sensor*.py'
      - 'tools/ci/run_classroom_reactive_L_v2_evaluator_attestation.py'
      - 'tools/ci/run_classroom_reactive_L_v2_geometry_mutant.py'
      - 'tools/ci/run_classroom_reactive_L_v2_foreign_scene.py'
      - 'controllers/progression_reactive_L_v2/**'
      - 'controllers/progression_reactive_L_attempt_probe/**'
      - 'controllers/crazyflie_classroom_v2/classroom_scene.cpp'
      - 'plugins/robot_windows/blockly/webeeblocks/wwi_backend.js'
      - 'plugins/robot_windows/blockly/webeeblocks/activity_profiles.js'
      - 'plugins/robot_windows/reactive_l_v2_scene_ack_probe/**'
      - 'plugins/robot_windows/reactive_l_v2_pupil_probe/**'
      - 'tools/ci/*reactive_L_v2*'
      - 'tools/ci/run_classroom_reactive_L_v2_attempts.py'
      - 'controllers/progression_reactive_L_sensor_probe*/**'
      - 'worlds/scenes/reactive-L-*.wbo'

permissions:
  contents: read

jobs:
  a5-native-draft-only:
    name: A5 R2025a sensor/attempt falsification (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse altered A5 source worlds and witness roles
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tools.ci.test_progression_reactive_L_scene \
            tools.ci.test_progression_reactive_L_sensor \
            tools.ci.test_progression_reactive_L_v2_scene \
            tools.ci.test_progression_reactive_L_sensor_v2 \
            tools.ci.test_progression_reactive_L_v2_oracle \
            tools.ci.test_progression_reactive_L_v2_native \
            tools.ci.test_progression_reactive_L_v2_evaluator_attestation \
            tools.ci.test_progression_reactive_L_v2_geometry_mutant \
            tools.ci.test_progression_reactive_L_v2_attempts \
            tools.ci.test_progression_reactive_L_v2_school_selector
          python3 -m unittest -v \
            tools.ci.test_workflow_contract.WorkflowTests.test_activity5_draft_witness_is_non_decision
      - name: Recheck native school selector and staged nonce-bound JS before Webots
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_runtime_v2_classroom_selector
          node tools/ci/test_progression_reactive_L_v2_selection.js
          node --check plugins/robot_windows/reactive_l_v2_scene_ack_probe/reactive_l_v2_scene_ack_probe.js
      - name: Verify hidden A5 profile and byte-identical real Blockly .wbb
        run: |
          set -euo pipefail
          npm ci --prefix plugins/robot_windows/blockly_v2 --ignore-scripts --no-audit --no-fund
          node tools/ci/test_progression_sequence_contract.js
          node tools/ci/test_progression_reactive_L_v2_project.js
          WEBEEBLOCKS_A5_WBB_OUTPUT=ci-artifacts/progression-reactive-L-v2-pupil/generic-witness.wbb node tools/ci/test_progression_reactive_L_v2_generic_program.js
      - name: Compile original R2025a Crazyflie sensor probe
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_sensor_probe \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_sensor_probe'
      - name: Measure V1 two-ray discrimination in original native scenes
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_sensor.py'
      - name: Compile original R2025a Crazyflie V2 staged sensor probe
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_sensor_probe_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_sensor_probe_v2'
      - name: Compile read-only A5 V2 native Webots behavioral evaluator
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_v2'
      - name: Observe genuine three-step V2 ray divergence on A B C
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_sensor_v2.py'
      - name: Attest independent A5 V2 evaluator in three genuine R2025a worlds
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_v2_evaluator_attestation.py'
      - name: Refuse an actually rotated physical wall before A5 READY
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_v2_geometry_mutant.py'
      - name: Refuse official A4/A5 mixed physical worlds before native A5 READY (six cases)
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_v2_foreign_scene.py'
      - name: Compile isolated A5 R2025a attempt-identity protocol driver
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_attempt_probe \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_attempt_probe'
      - name: Build isolated school-only native C++ runtime with A5 staging
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_classroom_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s crazyflie_classroom_v2'
      - name: Observe real A5 premature-complete and new-attempt failures
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_v2_attempts.py'
      - name: Exercise real A5 A/B/C school SCENE import and legacy restoration
        timeout-minutes: 9
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -e WEBEEBLOCKS_CI_ARTIFACT_DIR=/workspace/ci-artifacts/progression-reactive-L-v2-school-selector \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc 'set -e
              python3 /workspace/tools/test_prepare_webots_apt.py
              python3 /workspace/tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics /workspace/ci-artifacts/progression-reactive-L-v2-school-selector
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 /workspace/tools/ci/run_classroom_reactive_L_v2_scene_ack.py'
      - name: Preserve independent negative native data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-draft-real-two-ray-counterexample
          path: |
            ci-artifacts/progression-reactive-L-sensor/
            ci-artifacts/progression-reactive-L-sensor-v2/
            ci-artifacts/progression-reactive-L-v2-evaluator/
            ci-artifacts/progression-reactive-L-v2-mutant/
            ci-artifacts/progression-reactive-L-v2-foreign-a4/
            ci-artifacts/progression-reactive-L-v2-attempt/
            ci-artifacts/progression-reactive-L-v2-school-selector/
            ci-artifacts/progression-reactive-L-v2-pupil/
          if-no-files-found: warn

  # Separate non-decision native positive experiment. Does not replace
  # generic A5 negative witnesses or the repository's true CI Gate.
  a5-pupil-flight-draft:
    name: A5 same Blockly WBB R2025a pupil A B C (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate the exact common test-only Blockly project and validate A5 flight source
        run: |
          set -euo pipefail
          # Browser assets must be materialized in the mounted workspace;
          # npm ci alone installs node_modules but not vendor/Blockly JS.
          ./tools/prepare_runtime_v2.sh
          test -s plugins/robot_windows/blockly_v2/vendor/blockly_compressed.js
          test -s plugins/robot_windows/blockly_v2/vendor/blocks_compressed.js
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          WEBEEBLOCKS_A5_WBB_OUTPUT=ci-artifacts/progression-reactive-L-v2-pupil/generic-witness.wbb node tools/ci/test_progression_reactive_L_v2_generic_program.js
          python3 -m unittest -v tools.ci.test_progression_reactive_L_v2_pupil_flight
          node --check plugins/robot_windows/reactive_l_v2_pupil_probe/reactive_l_v2_pupil_probe.js
      - name: Build native A5 C evaluator and separate school flight controller
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_v2'
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_classroom_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s crazyflie_classroom_v2'
      - name: Try actual native A5 pupil Blockly A flight on unchanged WBB
        timeout-minutes: 8
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -e WEBEEBLOCKS_CI_ARTIFACT_DIR=/workspace/ci-artifacts/progression-reactive-L-v2-pupil/A \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc 'set -e
              python3 /workspace/tools/test_prepare_webots_apt.py
              python3 /workspace/tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics /workspace/ci-artifacts/progression-reactive-L-v2-pupil/A
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              # Try all three worlds with one fixture written once on the host.
              # Preserve all failures rather than short-circuiting B or C.
              failed=0
              for variant in A B C; do
                python3 /workspace/tools/ci/run_classroom_reactive_L_v2_pupil_flight.py --variant "$variant" || failed=1
              done
              exit "$failed"'
      - name: Demand identical WBB SHA and native C success in all A B C
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path('ci-artifacts/progression-reactive-L-v2-pupil')
          original=(root/'generic-witness.wbb').read_bytes()
          sha=hashlib.sha256(original).hexdigest()
          for variant in 'ABC':
              summary=json.loads((root/variant/'summary.json').read_text(encoding='utf-8'))
              assert summary.get('pass') is True, f'{variant}: native mission did not pass'
              assert summary.get('native_achieved')==1, f'{variant}: native C not achieved'
              assert summary.get('fixture_sha256')==sha, f'{variant}: fixture altered'
              assert summary.get('wbb_event',{}).get('sha256')==sha, f'{variant}: reopened WBB altered'
              assert summary.get('completion',{}).get('wbb_sha256')==sha, f'{variant}: completed WBB altered'
              if variant=='A':
                  assert summary.get('native_replay_achieved')==1, 'RESET replay not achieved in native C'
                  assert summary.get('reset_event',{}).get('same_fixture') is True, 'RESET altered pupil project'
                  assert summary.get('reset_event',{}).get('sha256')==sha, 'RESET original WBB changed'
                  assert summary.get('replay_event',{}).get('sha256')==sha, 'RESET replay WBB changed'
                  assert summary.get('replay_event',{}).get('status')=='achieved', 'RESET stale outcome'
                  print('A5_NATIVE_RESET_REPLAY_PASS variant=A same_wbb=true native_attempt=2')
          print('A5_NATIVE_SAME_WBB_ABC_PASS sha256='+sha+' variants=A,B,C')
          PY
      - name: Preserve A5 positive/negative pupil experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-draft-student-wbb-native-flight-pilot
          path: ci-artifacts/progression-reactive-L-v2-pupil/
          if-no-files-found: warn
