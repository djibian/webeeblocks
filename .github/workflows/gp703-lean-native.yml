# Disposable experiment only. Never add this workflow to the product PRs.
name: GP pupil 216-block native/Blockly falsification
on:
  push:
    branches:
      - experiment/gp703-lean-native-20261026
permissions:
  contents: read
jobs:
  blockly:
    name: Actual Blockly and AST 216
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert base and no shared runtime changes
        shell: bash
        run: |
          set -euo pipefail
          base=995b4b47f2b3e525e263450c11737f5d78dc85dd
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base" HEAD > changed.txt
          if grep -Ev '^(experiments/grand-prix-pupil-algorithm/(build.js|verify.js|Grand-Prix-sans-murs-algorithme-candidat.wbb|LEAN_EXPERIMENT.md)|\.github/workflows/gp703-lean-native.yml)$' changed.txt; then exit 1; fi
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 204144767b36c047a38606ec9f89fa03695d3bef
          test "$(git rev-parse "$base":experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 02c0cdef8fc7189aa171b584a8160b52e392ba1c
          sha256sum experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb
      - name: Prepare pinned real Blockly 13.2.1
        run: npm ci --prefix plugins/robot_windows/blockly_v2
      - name: Check generated WBB, Blockly, preflight, AST, source map, interpreter and Save/Open
        run: |
          node experiments/grand-prix-pupil-algorithm/verify.js --structural-only
          node experiments/grand-prix-pupil-algorithm/verify.js
  native:
    name: R2025a witness 216 seed ${{ matrix.seed }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [0, 3, 4, 15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attest immutability, WBB and independent world
        shell: bash
        run: |
          set -euo pipefail
          base=995b4b47f2b3e525e263450c11737f5d78dc85dd
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 204144767b36c047a38606ec9f89fa03695d3bef
          git diff --name-only "$base" HEAD > changed.txt
          if grep -Ev '^(experiments/grand-prix-pupil-algorithm/(build.js|verify.js|Grand-Prix-sans-murs-algorithme-candidat.wbb|LEAN_EXPERIMENT.md)|\.github/workflows/gp703-lean-native.yml)$' changed.txt; then exit 1; fi
          sha256sum experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb
      - name: Run true Webots R2025a unchanged witness, no RESET bypass
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/gp703-lean-native
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite witness --seed "${{ matrix.seed }}" --side 2.0 2>&1 | tee "ci-artifacts/gp703-lean-native/witness-${{ matrix.seed }}.log"
      - name: Archive native observations even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp703-lean-r2025a-s${{ matrix.seed }}
          path: |
            ci-artifacts/gp703-lean-native/
            ci-artifacts/grand-prix-u/
          if-no-files-found: warn
