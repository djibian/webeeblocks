# Real Chromium, source WBB unchanged; evidence only, not CI Gate.
name: GP222 integrated-main browser pupil debugging
on:
  push:
    branches: [experiment/gp222-main17671-student-debug-20261026]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact candidate WBB unaffected by classroom test
        shell: bash
        run: |
          set -euo pipefail
          base=5db5128896bfcb1986b1ca830adae79418ae929f
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 835dbfce603ebb509058d305802a309c84eabc75
          actual="$(git diff --name-only "$base" HEAD)"
          expected="$(printf '.github/workflows/gp222-main17671-student-debug.yml\nexperiments/grand-prix-pupil-algorithm/CONSTRUCTION_ET_DEBUG_COLLEGE.md\nexperiments/grand-prix-pupil-algorithm/probe_browser_ui.mjs')"
          test "$actual" = "$expected"
      - name: Prepare installed Blockly and Chromium
        run: |
          bash tools/prepare_runtime_v2.sh
          node -p "require('./plugins/robot_windows/blockly_v2/node_modules/blockly/package.json').version"
          npm install --prefix .ci-gp-ui --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          command -v google-chrome || command -v chromium
      - name: Measure real pupil browser editor, edit threshold, Save/Open, debugger
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/gp222-main17671-editor
          WEBEEBLOCKS_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/.ci-gp-ui/node_modules/playwright/index.mjs" \
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" \
          WEBEEBLOCKS_UI_OUTPUT="$GITHUB_WORKSPACE/ci-artifacts/gp222-main17671-editor" \
          node experiments/grand-prix-pupil-algorithm/probe_browser_ui.mjs 2>&1 | tee ci-artifacts/gp222-main17671-editor/ui.log
      - name: Preserve screenshot and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp222-main17671-real-chromium-evidence
          path: ci-artifacts/gp222-main17671-editor/
          if-no-files-found: warn
