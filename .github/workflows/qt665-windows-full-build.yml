# NON-GATE genuine Windows source build from exact R2025a, no oracle relaxation.
name: Qt665 Windows ABI-pinned link proof (NON-GATE)
on:
  push:
    branches: [evidence/665-windows-qt-abi-link-20261026]
permissions:
  contents: read
jobs:
  build-actual-windows-webots:
    runs-on: windows-2022
    timeout-minutes: 48
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          path: .ci-webots-qt665-src
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Webots R2025a composed lifetime repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tree='.ci-webots-qt665-src'
          New-Item -ItemType Directory -Force ci-artifacts/qt665-windows-source | Out-Null
          $upstream=(git -C $tree rev-parse HEAD).Trim()
          if ($upstream -ne 'c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b') {
            throw "Wrong upstream SHA: $upstream"
          }
          git -C $tree apply "$env:GITHUB_WORKSPACE/experiments/webots-qt-665/webots-r2025a-guarded-progress-retirement.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Composed patch phase 1 rejected' }
          python experiments/webots-qt-665/repair_parent_shutdown.py --webots-tree $tree
          if ($LASTEXITCODE -ne 0) { throw 'Composed patch phase 2 rejected' }
          git -C $tree diff --binary | Out-File -Encoding utf8 ci-artifacts/qt665-windows-source/composed-windows.patch
          printf 'upstream=%s\npr_source=%s\n' $upstream $env:GITHUB_SHA | Set-Content ci-artifacts/qt665-windows-source/source.txt
      - name: Install native Windows MSYS2 Qt development prerequisites from pinned Webots recipe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd .ci-webots-qt665-src
          export WEBOTS_HOME="$PWD"
          export PATH="$PWD/msys64/mingw64/bin:$PWD/bin/node:/mingw64/bin:/usr/bin:$PATH"
          ./scripts/install/msys64_installer.sh --all
          pacman -Q > ../ci-artifacts/qt665-windows-source/msys2-package-versions.txt
          sha256sum /mingw64/bin/Qt6Core.dll /mingw64/bin/Qt6Widgets.dll > ../ci-artifacts/qt665-windows-source/toolchain-qt.sha256
          # Pinned upstream qt_windows_installer.sh deliberately stages
          # each module in include/qt/QtCore/QtCore/*, not the Linux SDK path.
          # A previous preflight falsely required include/qt/QtCore/QObject.
          test -f include/qt/QtCore/QtCore/QObject
          test -f include/qt/QtWidgets/QtWidgets/QProgressDialog
          test -f /mingw64/include/qt6/QtCore/QObject
          test -f /mingw64/include/qt6/QtWidgets/QProgressDialog
          echo QT665_WINDOWS_NATIVE_QT_SDK=PASS
      - name: Build repaired Windows Webots with explicit experimental Qt linker priority
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd .ci-webots-qt665-src
          export WEBOTS_HOME="$PWD"
          export PATH="$PWD/msys64/mingw64/bin:$PWD/bin/node:/mingw64/bin:/usr/bin:$PATH"
          set -o pipefail
          # ABI discriminator: R2025a searches its staged Windows Qt import libraries
          # *before* the SDK import libraries. That may bind old symbols absent
          # from the newly installed Qt6 DLLs. Change only the isolated checkout.
          python3 - <<'PY'
          from pathlib import Path
          source=Path("src/webots/Makefile")
          text=source.read_text()
          old="-L$(TARGET_PATH) -L/mingw64/bin -L/mingw64/lib -lQt6Core"
          new="-L/mingw64/lib -L$(TARGET_PATH) -L/mingw64/bin -lQt6Core"
          if text.count(old)!=1 or text.count(new)!=0:
              raise SystemExit("QT665_WINDOWS_LINK_ORDER_PRECONDITION=FAIL")
          source.write_text(text.replace(old,new))
          print("QT665_WINDOWS_LINK_ORDER=SDK_IMPORT_LIBRARIES_FIRST")
          PY
          git diff -- src/webots/Makefile > ../ci-artifacts/qt665-windows-source/qt-link-order.diff
          test -s ../ci-artifacts/qt665-windows-source/qt-link-order.diff
          { for d in msys64/mingw64/bin /mingw64/lib; do
              if test -d "$d"; then
                find "$d" -maxdepth 1 -type f -iname '*Qt6Gui*'
                find "$d" -maxdepth 1 -type f -iname '*Qt6Widgets*'
              else
                echo "QT665_WINDOWS_LIBRARY_DIR_ABSENT $d" >&2
              fi
            done; } > ../ci-artifacts/qt665-windows-source/qt-library-search-candidates.txt
          test -s ../ci-artifacts/qt665-windows-source/qt-library-search-candidates.txt
                    make webots_target -j4 2>&1 | tee ../ci-artifacts/qt665-windows-source/build.log
          # Capture the true native PE BEFORE any later qualifier may fail.
          # Do not require a redundant DLL copy inside the Webots checkout:
          # upstream MSYS2 links against the installed /mingw64/bin Qt SDK.
          pe="$WEBOTS_HOME/msys64/mingw64/bin/webots-bin.exe"
          test -s "$pe"
          echo "$pe" > ../ci-artifacts/qt665-windows-source/pe-paths.txt
          sha256sum "$pe" > ../ci-artifacts/qt665-windows-source/pe.sha256
          file "$pe" > ../ci-artifacts/qt665-windows-source/pe-type.txt
          objdump -p "$pe" > ../ci-artifacts/qt665-windows-source/pe-imports.txt
          cp "$pe" ../ci-artifacts/qt665-windows-source/webots-bin.exe
          echo QT665_WINDOWS_REAL_PE_LINK=PASS
          for module in Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll; do
            test -s "/mingw64/bin/$module"
            cp "/mingw64/bin/$module" "../ci-artifacts/qt665-windows-source/$module"
          done
          sha256sum /mingw64/bin/Qt6Widgets.dll /mingw64/bin/Qt6Core.dll > ../ci-artifacts/qt665-windows-source/native-qt.sha256
          echo QT665_WINDOWS_QT_DLL_EVIDENCE=PASS
          grep -qi 'DLL Name: Qt6Widgets.dll' ../ci-artifacts/qt665-windows-source/pe-imports.txt
          grep -qi 'DLL Name: Qt6Core.dll' ../ci-artifacts/qt665-windows-source/pe-imports.txt
          echo QT665_WINDOWS_REAL_PE_IMPORTS=PASS
          # Verifies the *actual* linked PE's Qt import names against the
          # SDK DLL export tables, not just matching file versions or ABI guess.
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          python - <<'PY'
          import json
          from pathlib import Path
          import pefile
          pe=pefile.PE("../ci-artifacts/qt665-windows-source/webots-bin.exe",fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          report={}
          for entry in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              name=entry.dll.decode("ascii","replace")
              if not (name.startswith("Qt6") and name.endswith(".dll")):
                  continue
              lib=Path("/mingw64/bin")/name
              if not lib.is_file():
                  raise SystemExit("SDK DLL unavailable: "+name)
              obj=pefile.PE(str(lib),fast_load=True)
              obj.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXPORT"]])
              exports=getattr(obj,"DIRECTORY_ENTRY_EXPORT",None)
              symbols=[] if exports is None else exports.symbols
              names={s.name for s in symbols if s.name is not None}
              ordinals={s.ordinal for s in symbols}
              missing=[{"name":s.name.decode("ascii","replace") if s.name else None,"ordinal":s.ordinal}
                  for s in entry.imports if (s.name not in names if s.name is not None else s.ordinal not in ordinals)]
              report[name]={"imports":len(entry.imports),"missing":missing}
              print(f"QT665_WINDOWS_LINKED_SDK_EXPORTS {name} imports={len(entry.imports)} missing={len(missing)}")
              obj.close()
          Path("../ci-artifacts/qt665-windows-source/linked-sdk-qt-symbols.json").write_text(json.dumps(report,indent=2)+"\\n")
          if any(x["missing"] for x in report.values()):
              raise SystemExit("QT665_WINDOWS_LINKED_SDK_EXPORTS=FAIL")
          print("QT665_WINDOWS_LINKED_SDK_EXPORTS=PASS_NOT_NATIVE_RUNTIME")
          PY
          # The Webots R2025a official distribution's own DLLs must be
          # inventoried separately; this SDK 6.12 build is not a drop-in PE
          # for its possibly different Qt ABI and must not be published.
          echo QT665_WINDOWS_SDK_PE_BUILD=PASS_NOT_DISTRIBUTION
      - name: Preserve bounded Windows native build evidence, never invent an exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt665-windows-real-build-${{ github.sha }}
          path: ci-artifacts/qt665-windows-source/
          if-no-files-found: error
          retention-days: 14
