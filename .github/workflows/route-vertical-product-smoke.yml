name: Route vertical product smoke (Draft only)
on:
  pull_request:
    branches: [fix/951-grand-prix-linux-pedagogical-guards]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/grand_prix/route_vertical_product.py'
      - 'tools/grand_prix/prepare_u_runtime.py'
      - 'tools/ci/test_grand_prix_route_vertical_product.py'
      - '.github/workflows/route-vertical-product-smoke.yml'

permissions:
  contents: read

jobs:
  product-native-build:
    name: Native build smoke (not a V5 Gate)
    if: ${{ github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Compose and test source-locked route-only C
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_grand_prix_route_vertical_product
      - name: Build with the existing pinned Webots R2025a image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/route-vertical-product
          bash tools/prepare_runtime_v2.sh
          assets="$GITHUB_WORKSPACE/.ci-grand-prix-u-webots"
          if [ ! -d "$assets/.git" ]; then
            git clone --depth=1 --filter=blob:none --sparse --branch R2025a \
              https://github.com/cyberbotics/webots.git "$assets"
            git -C "$assets" sparse-checkout set \
              projects/robots/bitcraze/crazyflie \
              projects/objects/backgrounds projects/objects/floors \
              projects/appearances projects/default
          fi
          test "$(git -C "$assets" rev-parse HEAD)" = "c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b"
          IMAGE='ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca'
          docker pull "$IMAGE"
          gitbin="$(command -v git)"
          docker run --rm --init --entrypoint /bin/bash \
            -e WEBOTS_HOME=/usr/local/webots \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$assets/projects:/usr/local/webots/projects:ro" \
            -v "$gitbin:/usr/local/bin/git:ro" \
            -w /workspace "$IMAGE" -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              python3 -m unittest -v tools.ci.test_grand_prix_route_vertical_product
              python3 tools/grand_prix/prepare_route_runtime.py
              make -C controllers/grand_prix_route_flight clean
              python3 tools/grand_prix/prepare_route_runtime.py
              make -C controllers/grand_prix_route_flight release
              sha256sum controllers/grand_prix_route_flight/grand_prix_route_flight
              sha256sum controllers/grand_prix_route_flight/build/runtime_u.c
            ' 2>&1 | tee ci-artifacts/route-vertical-product/build.log
      - name: Save build provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-vertical-product-native-${{ github.event.pull_request.head.sha }}
          path: ci-artifacts/route-vertical-product/
          if-no-files-found: warn
