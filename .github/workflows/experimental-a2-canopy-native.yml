# Temporary, branch-scoped diagnostic witness for PR #996 Draft.
# NOT a required CI Gate, review, owner decision, or pupil acceptance.
name: Experimental Activity 2 canopy native R2025a
on:
  push:
    branches:
      - feat/pedagogy-a2-visible-start-canopy-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-a2-canopy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canopy-native:
    name: Draft-only real Webots R2025a canopy falsification
    if: github.ref == 'refs/heads/feat/pedagogy-a2-visible-start-canopy-20261114'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact experimental branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/feat/pedagogy-a2-visible-start-canopy-20261114
          test -f worlds/scenes/altitude-v1.wbo
          test -f tools/ci/run_classroom_altitude_canopy.py
      - name: Reject malformed canopy witness before Webots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci/prepare_classroom_altitude_canopy.py tools/ci/run_classroom_altitude_canopy.py
          node --check plugins/robot_windows/altitude_canopy_probe/altitude_canopy_probe.js
          python3 -m unittest tools.ci.test_progression_altitude_scene tools.ci.test_progression_altitude_native tools.ci.test_classroom_altitude_smoke_world tools.ci.test_runtime_v2_classroom_selector
      - name: Prepare the same Blockly runtime assets as canonical CI
        run: bash ./tools/prepare_runtime_v2.sh
      - name: Falsify both native canopy trajectories in actual R2025a
        env:
          WEBEEBLOCKS_CI_NEUTRAL_START: '1'
          WEBEEBLOCKS_CI_TARGET_SHA: ${{ github.sha }}
        run: python3 tools/ci/run_progression_sequence_mission.py
      - name: Preserve evidence, including native failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-a2-canopy-${{ github.sha }}
          path: ci-artifacts/progression-neutral-start/
          if-no-files-found: warn
