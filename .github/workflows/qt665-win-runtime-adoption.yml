# NON-GATE genuine Windows patched simulator / mapped Qt causal identity.
# A disposable CI runner is modified; this is NOT a classroom release.
name: Qt665 Windows packaged Runtime startup (NON-GATE)
on:
  push:
    branches: [evidence/665-windows-product-startup-20261027]
permissions:
  contents: read
  actions: read
jobs:
  verify-real-windows-webots:
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-binutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 40415782024
          name: qt665-windows-real-build-cee93a46b5c019c78d901a969ffe8122ea2a1fe2
          github-token: ${{ github.token }}
          path: qt665-patched-pe
      - name: Attest matching MSYS2 Qt ABI and supplied PE
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/qt665-windows-running
          test -s qt665-patched-pe/webots-bin.exe
          test -s qt665-patched-pe/Qt6Core.dll
          test -s qt665-patched-pe/Qt6Widgets.dll
          test -s qt665-patched-pe/pe.sha256
          test -s qt665-patched-pe/msys2-package-versions.txt
          for mod in mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative mingw-w64-x86_64-qt6-websockets; do
            compiled="$(grep "^$mod " qt665-patched-pe/msys2-package-versions.txt)"
            installed="$(pacman -Q "$mod")"
            test "$compiled" = "$installed" || { echo "QT665_WINDOWS_SDK_ABI_MISMATCH $compiled != $installed" >&2; exit 1; }
          done
          for mod in Qt6Core.dll Qt6Widgets.dll; do
            source_sha="$(sha256sum "qt665-patched-pe/$mod" | cut -d' ' -f1)"
            installed_sha="$(sha256sum "/mingw64/bin/$mod" | cut -d' ' -f1)"
            test "$source_sha" = "$installed_sha" || {
              echo "QT665_WINDOWS_SDK_DLL_SHA_MISMATCH $mod" >&2
              exit 1
            }
          done
          source_sha="$(awk 'NR==1{print $1}' qt665-patched-pe/pe.sha256)"
          echo "$source_sha  qt665-patched-pe/webots-bin.exe" | sha256sum -c -
          test -s /mingw64/share/qt6/plugins/platforms/qwindows.dll
          pacman -Q > ci-artifacts/qt665-windows-running/msys2-package-versions.txt
          sha256sum /mingw64/bin/Qt6*.dll > ci-artifacts/qt665-windows-running/msys2-qt-sha256.txt
          echo "QT665_MINGW_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          echo "QT665_QT_PLUGINS=$(cygpath -w /mingw64/share/qt6/plugins)" >> "$GITHUB_ENV"
          echo QT665_WINDOWS_PINNED_SDK_ABI=PASS
      - name: Install official Webots R2025a into disposable Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'webots-R2025a_setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe' -OutFile $installer
          $hash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9e326a54c104fc5fc88121e26014a409d1e35f0bbf30e23f3a712e7f842b08e7') {
            throw "Official Windows installer digest mismatch: $hash"
          }
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Windows installer exited $($p.ExitCode)" }
          $installedWebotsRoot=Join-Path $env:ProgramFiles 'Webots'
          $bin=Join-Path $installedWebotsRoot 'msys64\mingw64\bin'
          foreach ($name in @('webots-bin.exe','Qt6Core.dll','Qt6Widgets.dll','Qt6Gui.dll','webots.exe')) {
            $path=Join-Path $bin $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {throw "Missing installed Webots runtime file $name"}
            $original=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name $original" | Add-Content ci-artifacts/qt665-windows-running/original-runtime-sha256.txt
          }
          "QT665_WEBOTS_HOME=$installedWebotsRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "QT665_WEBOTS_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'QT665_WINDOWS_OFFICIAL_INSTALL_BASE=PASS'
      - name: Contrast patched PE Qt symbols against original authentic R2025a and SDK Qt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          @'
          from pathlib import Path
          import json
          import os
          import pefile
          
          original = Path(os.environ["QT665_WEBOTS_BIN"])
          sdk = Path(os.environ["QT665_MINGW_BIN"])
          patched = Path(os.environ["GITHUB_WORKSPACE"]) / "qt665-patched-pe/webots-bin.exe"
          out = Path(os.environ["GITHUB_WORKSPACE"]) / "ci-artifacts/qt665-windows-running/qt-import-export-contrast.json"
          exe = pefile.PE(str(patched), fast_load=True)
          exe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          target = {}
          for group in getattr(exe, "DIRECTORY_ENTRY_IMPORT", []):
              name = group.dll.decode("ascii", "replace")
              if name.lower() in ("qt6core.dll", "qt6gui.dll", "qt6widgets.dll"):
                  target[name] = {i.name for i in group.imports if i.name is not None}
          report = {}
          for name, needed in target.items():
              report[name] = {"symbols_imported": len(needed)}
              for label, root in (("original_official_r2025a", original), ("msys2_qt6_sdk", sdk)):
                  file = root / name
                  pe = pefile.PE(str(file), fast_load=True)
                  pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXPORT"]])
                  table = getattr(pe, "DIRECTORY_ENTRY_EXPORT", None)
                  exports = set() if table is None else {sym.name for sym in table.symbols if sym.name is not None}
                  absent = sorted(sym.decode("ascii", "replace") for sym in needed if sym not in exports)
                  report[name][label] = {"missing_count": len(absent), "sample": absent[:14]}
                  print("QT665_WINDOWS_QT_EXPORT_CONTRAST %s %s missing=%d imported=%d" % (name, label, len(absent), len(needed)))
          out.write_text(json.dumps({"claim": "static-patched-PE-vs-authentic-R2025a-and-MSYS2-symbol-differential-only", "result": report}, indent=2, sort_keys=True)+"\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Qt export contrast failed; no compatibility claim' }
      - name: Overlay consistent Qt SDK runtime and actual patched Webots PE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=$env:QT665_WEBOTS_BIN
          $artifact=Join-Path $env:GITHUB_WORKSPACE 'qt665-patched-pe'
          Copy-Item -LiteralPath (Join-Path $artifact 'webots-bin.exe') -Destination (Join-Path $bin 'webots-bin.exe') -Force
          $modules=Get-ChildItem -LiteralPath $env:QT665_MINGW_BIN -Filter 'Qt6*.dll' -File
          if ($modules.Count -lt 10) { throw 'Full Qt6 runtime closure missing' }
          foreach ($dll in $modules) {Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $bin $dll.Name) -Force}
          $destPlugins=Join-Path $env:QT665_WEBOTS_HOME 'msys64\mingw64\share\qt6\plugins'
          if (Test-Path -LiteralPath $destPlugins) { Remove-Item -LiteralPath $destPlugins -Recurse -Force }
          New-Item -ItemType Directory -Force (Split-Path $destPlugins -Parent) | Out-Null
          Copy-Item -LiteralPath $env:QT665_QT_PLUGINS -Destination $destPlugins -Recurse -Force
          foreach ($name in @('webots-bin.exe','Qt6Core.dll','Qt6Widgets.dll')) {
            $source=Join-Path $artifact $name
            $candidate=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            $installed=(Get-FileHash -LiteralPath (Join-Path $bin $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($candidate -ne $installed) {throw "Installed patched Webots/Qt mismatch: $name"}
            "$name $installed" | Add-Content ci-artifacts/qt665-windows-running/adopted-runtime-sha256.txt
          }
          Get-ChildItem -LiteralPath $bin -Filter 'Qt6*.dll' -File |
            ForEach-Object {"$($_.Name) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"} |
            Set-Content ci-artifacts/qt665-windows-running/all-installed-qt-sha256.txt
          # Diagnosed direct imports missing from the authentic R2025a install
          # in run 40410796421; copy only these real compiler-runtime DSOs,
          # with their independently observed source SHA256, and fail closed.
          $compilerRuntime=@{
            'libgcc_s_seh-1.dll'='d7e343dd266747177c3699bc3201ea36eceef158e98530e089263bc55bb2a6d7'
            'libstdc++-6.dll'='494bd9045948198ef4d3bc838c7362d4cfd49c890b439c096b1817aa7c7fa6ff'
            'libwinpthread-1.dll'='72bf8802de3a99d28f0bc2db9a11f281a9f9f3fa83dab2bc67e69fac3bd3d9c0'
          }
          foreach ($entry in $compilerRuntime.GetEnumerator()) {
            $source=Join-Path $env:QT665_MINGW_BIN $entry.Key
            $sourceHash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceHash -ne $entry.Value) { throw "Qt665 GCC runtime SHA mismatch: $($entry.Key)" }
            $destination=Join-Path $bin $entry.Key
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              Copy-Item -LiteralPath $source -Destination $destination
            }
            $destHash=(Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($destHash -ne $entry.Value) {throw "Incompatible compiler dependency: $($entry.Key)"}
            "$($entry.Key) $destHash" | Add-Content ci-artifacts/qt665-windows-running/gcc-runtime-closure-sha256.txt
          }
          Write-Host 'QT665_WINDOWS_GCC_RUNTIME_CLOSURE=PASS'
          # Diagnose and resolve the FULL real PE import graph. Qt6.12
          # imports ICU 78 and others not shipped by official R2025a (Qt6.5).
          # Add only transitively imported DLLs found in the same MSYS2
          # toolchain, never claim an unqualified/deleted/missing import.
          $objdump=Join-Path $env:QT665_MINGW_BIN 'objdump.exe'
          if (-not (Test-Path -LiteralPath $objdump -PathType Leaf)) { throw 'Pinned MSYS2 objdump absent' }
          $pending=[System.Collections.Generic.Queue[string]]::new()
          $pending.Enqueue((Join-Path $bin 'webots-bin.exe'))
          $visited=[System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $needed=@()
          $unresolved=@()
          while ($pending.Count -gt 0) {
            $subject=$pending.Dequeue()
            if (-not $visited.Add($subject)) { continue }
            if ($visited.Count -gt 190) { throw 'Unbounded Qt665 Windows import closure' }
            $dump=(& $objdump -p $subject 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Invalid imported PE module: $subject" }
            $imports=@([regex]::Matches($dump, '(?im)^\s*DLL Name:\s*([^\s]+)') |
              ForEach-Object {$_.Groups[1].Value} | Sort-Object -Unique)
            foreach ($dep in $imports) {
              # Windows API-set dependencies are exported by the loader,
              # not separate on-disk files.
              if ($dep -match '^(api-ms-win-|ext-ms-win-)') { continue }
              $local=Join-Path $bin $dep
              $sdk=Join-Path $env:QT665_MINGW_BIN $dep
              $system=Join-Path (Join-Path $env:SystemRoot 'System32') $dep
              $isSystem=Test-Path -LiteralPath $system -PathType Leaf
              if (-not (Test-Path -LiteralPath $local -PathType Leaf)) {
                if (Test-Path -LiteralPath $sdk -PathType Leaf) {
                  Copy-Item -LiteralPath $sdk -Destination $local
                  $sourceHash=(Get-FileHash -LiteralPath $sdk -Algorithm SHA256).Hash.ToLowerInvariant()
                  $localHash=(Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($sourceHash -ne $localHash) { throw "Imported module copy mismatch: $dep" }
                  $needed+=@{name=$dep;reason='transitive-import-missing-from-original';sha256=$localHash;referer=[IO.Path]::GetFileName($subject)}
                } elseif (-not $isSystem) {
                  $unresolved+=@{name=$dep;referer=[IO.Path]::GetFileName($subject)}
                  continue
                }
              }
              if (Test-Path -LiteralPath $local -PathType Leaf) { $pending.Enqueue($local) }
            }
          }
          @{source_commit='cee93a46b5c019c78d901a969ffe8122ea2a1fe2';visited=$visited.Count;added=$needed;unresolved=$unresolved} |
            ConvertTo-Json -Depth 9 | Set-Content ci-artifacts/qt665-windows-running/recursive-pe-closure.json
          if ($unresolved.Count) {throw ('Unresolved transitive PE imports: '+($unresolved | ConvertTo-Json -Compress))}
          Write-Host "QT665_WINDOWS_TRANSITIVE_IMPORT_CLOSURE=PASS inspected=$($visited.Count) copied=$($needed.Count)"
          # Causal counterprobe for run 40420506026. The original R2025a
          # OpenAL DLL imports two removed TLS symbols from GCC16's libstdc++.
          # Replace this *single* ABI-incompatible native component on an
          # ephemeral Windows runner with the coherent MSYS2 OpenAL package.
          # Record original and replacement SHA; no classroom distribution.
          $openalName='libopenal-1.dll'
          $openalOriginal=Join-Path $bin $openalName
          $openalSdk=Join-Path $env:QT665_MINGW_BIN $openalName
          if (-not (Test-Path -LiteralPath $openalOriginal -PathType Leaf)) {throw 'Original OpenAL missing; no causal substitution possible'}
          if (-not (Test-Path -LiteralPath $openalSdk -PathType Leaf)) {throw 'Pinned toolchain OpenAL absent; abort counterprobe'}
          $originalHash=(Get-FileHash -LiteralPath $openalOriginal -Algorithm SHA256).Hash.ToLowerInvariant()
          $sdkHash=(Get-FileHash -LiteralPath $openalSdk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sdkHash -eq $originalHash) {throw 'OpenAL test has no discriminating binary difference'}
          Copy-Item -LiteralPath $openalSdk -Destination $openalOriginal -Force
          $observedHash=(Get-FileHash -LiteralPath $openalOriginal -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $sdkHash) {throw 'OpenAL copy SHA mismatch'}
          "original=$originalHash sdk=$sdkHash installed=$observedHash" | Set-Content ci-artifacts/qt665-windows-running/openal-abi-contrast.txt
          Write-Host 'QT665_WINDOWS_MATCHED_OPENAL_GCC_ABI_OVERLAY=PASS_DISPOSABLE_ONLY'
          Write-Host 'QT665_WINDOWS_DISPOSABLE_PATCHED_INSTALL=PASS'
      - name: Require genuine patched Windows Webots CLI and live mapped Qt Core/Widgets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=$env:QT665_WEBOTS_BIN
          $exe=Join-Path $bin 'webots-bin.exe'
          $env:WEBOTS_HOME=$env:QT665_WEBOTS_HOME
          $env:PATH="$bin;$($env:PATH)"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH=Join-Path $env:QT665_WEBOTS_HOME 'msys64\mingw64\share\qt6\plugins\platforms'
          # The Windows product invokes webots.exe, not webots-bin.exe
          # directly for --version. Record BOTH CLI paths and their exit codes.
          # A silent direct GUI executable is not evidence of a broken binary.
          $sources=Join-Path $env:GITHUB_WORKSPACE 'qt665-patched-pe/pe-imports.txt'
          $direct=@(Select-String -LiteralPath $sources -Pattern 'DLL Name:\s*(\S+)' -AllMatches |
            ForEach-Object {$_.Matches} | ForEach-Object {$_.Groups[1].Value} | Sort-Object -Unique)
          $missing=@()
          foreach ($name in $direct) {
            $local=Join-Path $bin $name
            $sdk=Join-Path $env:QT665_MINGW_BIN $name
            $system=Join-Path $env:SystemRoot ('System32\\'+$name)
            if (-not (Test-Path -LiteralPath $local) -and -not (Test-Path -LiteralPath $system)) {
              $missing+=@{name=$name;in_sdk=Test-Path -LiteralPath $sdk}
            }
          }
          $missing | ConvertTo-Json -Depth 5 | Set-Content ci-artifacts/qt665-windows-running/missing-direct-imports.json
          foreach ($name in @('libstdc++-6.dll','libgcc_s_seh-1.dll','libwinpthread-1.dll')) {
            $local=Join-Path $bin $name
            $sdk=Join-Path $env:QT665_MINGW_BIN $name
            $left=if(Test-Path $local){(Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()}else{'MISSING'}
            $right=if(Test-Path $sdk){(Get-FileHash $sdk -Algorithm SHA256).Hash.ToLowerInvariant()}else{'MISSING'}
            "$name installed=$left sdk=$right" | Add-Content ci-artifacts/qt665-windows-running/native-runtime-comparison.txt
          }
          if ($missing.Count) { throw ('Unresolved direct PE imports: '+($missing|ConvertTo-Json -Compress)) }
          $output=(& $exe --version 2>&1 | Out-String)
          $directExit=$LASTEXITCODE
          $output | Set-Content ci-artifacts/qt665-windows-running/version-direct-pe.txt
          Write-Host "QT665_WINDOWS_DIRECT_GUI_VERSION_EXIT=$directExit"
          $launcher=Join-Path $bin 'webots.exe'
          $wrapperOutput=(& $launcher --version 2>&1 | Out-String)
          $wrapperExit=$LASTEXITCODE
          $wrapperOutput | Set-Content ci-artifacts/qt665-windows-running/version-launcher.txt
          Write-Host "QT665_WINDOWS_LAUNCHER_VERSION_EXIT=$wrapperExit version=$wrapperOutput"
          if ($wrapperExit -ne 0 -or $wrapperOutput -notmatch 'R2025a') {
            throw 'The actual Windows Webots launcher is not qualified'
          }
          Write-Host 'QT665_WINDOWS_PATCHED_LAUNCHER_CLI=PASS'
          $world=Join-Path $env:RUNNER_TEMP 'qt665-windows-minimal.wbt'
          @'
          #VRML_SIM R2025a utf8
          WorldInfo {
            basicTimeStep 32
          }
          Viewpoint {
            position 0 0 2
          }
          '@ | Set-Content -LiteralPath $world -Encoding utf8
          $proc=$null
          try {
            $proc=Start-Process -FilePath $exe -WorkingDirectory $env:QT665_WEBOTS_HOME -ArgumentList @('--stdout','--stderr','--batch','--mode=fast',$world) -RedirectStandardOutput 'ci-artifacts/qt665-windows-running/webots-stdout.log' -RedirectStandardError 'ci-artifacts/qt665-windows-running/webots-stderr.log' -PassThru
            $deadline=[DateTime]::UtcNow.AddSeconds(35)
            $proved=$false
            do {
              Start-Sleep -Milliseconds 400
              $proc.Refresh()
              if ($proc.HasExited) {break}
              try {
                $mods=@(Get-Process -Id $proc.Id -ErrorAction Stop | Select-Object -ExpandProperty Modules)
                $live=@($mods | Where-Object {$_.ModuleName -in @('Qt6Core.dll','Qt6Widgets.dll')})
                if ($live.Count -eq 2) {
                  foreach ($dll in $live) {
                    $expected=Join-Path $bin $dll.ModuleName
                    if ($dll.FileName -ne $expected) { throw "Unexpected mapped Qt DLL path $($dll.FileName)" }
                    $installed=(Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash.ToLowerInvariant()
                    $actual=(Get-FileHash -LiteralPath $dll.FileName -Algorithm SHA256).Hash.ToLowerInvariant()
                    if ($installed -ne $actual) {throw "Wrong Qt DLL bytes $($dll.ModuleName)"}
                    "$($dll.ModuleName) $actual $($dll.FileName)" | Add-Content ci-artifacts/qt665-windows-running/live-qt-modules.txt
                  }
                  $livePE=(Get-FileHash -LiteralPath $proc.Path -Algorithm SHA256).Hash.ToLowerInvariant()
                  $expectedPE=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($livePE -ne $expectedPE) {throw 'Running Webots PE is not patched candidate'}
                  $proved=$true
                  break
                }
              } catch [System.ComponentModel.Win32Exception] {
                # A transient module-snapshot read is not a PASS; keep sampling.
              }
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $proved) {throw "Native patched Windows Qt process identity UNPROVEN; exited=$($proc.HasExited)"}
            Write-Host 'QT665_WINDOWS_LIVE_WEBOTS_QT_IDENTITY=PASS'
          } finally {
            if ($proc) {
              $proc.Refresh()
              if (-not $proc.HasExited) {Stop-Process -Id $proc.Id -Force}
            }
          }
      - name: Crosscheck flagged static PE symbols using Windows GetProcAddress on actual installed DLLs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          @'
          import ctypes
          import json
          import os
          from pathlib import Path
          import pefile
          
          bin = Path(os.environ["QT665_WEBOTS_BIN"])
          plugins = Path(os.environ["QT665_WEBOTS_HOME"]) / "msys64/mingw64/share/qt6/plugins/platforms/qwindows.dll"
          roots = [bin / "webots-bin.exe", plugins]
          kernel = ctypes.WinDLL("kernel32",use_last_error=True)
          gpa=kernel.GetProcAddress
          gpa.argtypes=[ctypes.c_void_p,ctypes.c_char_p]
          gpa.restype=ctypes.c_void_p
          reports=[]
          errors=[]
          for importer in roots:
              pe=pefile.PE(str(importer),fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
              for descriptor in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
                  name=descriptor.dll.decode("ascii","replace")
                  if name.lower() not in ("qt6core.dll","qt6gui.dll","qt6widgets.dll"):
                      continue
                  target=bin/name
                  try:
                      lib=ctypes.WinDLL(str(target),use_last_error=True)
                  except OSError as exc:
                      errors.append({"importer":importer.name,"dependency":name,"load_error":str(exc)})
                      continue
                  missing=[]
                  name_count=0
                  ordinal_count=0
                  for symbol in descriptor.imports:
                      if symbol.name is None:
                          ordinal_count+=1
                          continue
                      name_count+=1
                      if not gpa(lib._handle,symbol.name):
                          missing.append(symbol.name.decode("ascii","replace"))
                  reports.append({"importer":importer.name,"dependency":name,
                                  "names":name_count,"ordinals_unchecked":ordinal_count,
                                  "native_getprocaddress_absent":missing})
                  print(f"QT665_NATIVE_GETPROCADDRESS {importer.name}->{name} names={name_count} missing={len(missing)} ordinals_unchecked={ordinal_count}")
                  for name in missing[:8]:
                      print("QT665_NATIVE_MISSING_EXPORT " + importer.name + " " + name)
              pe.close()
          path=Path("ci-artifacts/qt665-windows-running/native-getprocaddress.json")
          path.write_text(json.dumps({"claim":"native-Windows-GetProcAddress-on-identified-Qt-DLLs-not-Webots-process","reports":reports,"load_errors":errors},indent=2)+"\n")
          if errors:
              print("QT665_NATIVE_DLL_LOAD=FAIL",len(errors))
              raise SystemExit(91)
          if not reports or any(r["ordinals_unchecked"] for r in reports):
              print("QT665_NATIVE_NAME_SCAN=UNPROVEN")
              raise SystemExit(92)
          if any(r["native_getprocaddress_absent"] for r in reports):
              print("QT665_NATIVE_GETPROCADDRESS=FAIL")
              raise SystemExit(93)
          print("QT665_NATIVE_GETPROCADDRESS=PASS_DIRECT_NAMES_ONLY")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native GetProcAddress fails, archive disagreement; not a Windows runtime PASS' }
      - name: Investigate full non-system DLL import graph using real Windows loader GetProcAddress
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          @'
          import collections
          import ctypes
          import json
          import os
          from pathlib import Path
          import pefile
          
          runtime=Path(os.environ["QT665_WEBOTS_BIN"])
          plugins=Path(os.environ["QT665_WEBOTS_HOME"])/"msys64/mingw64/share/qt6/plugins/platforms/qwindows.dll"
          system=Path(os.environ["SystemRoot"])/"System32"
          queue=collections.deque([runtime/"webots-bin.exe",runtime/"webots.exe",plugins])
          seen=set()
          missing=[]
          errors=[]
          modules=[]
          system_names=set()
          kernel=ctypes.WinDLL("kernel32",use_last_error=True)
          gpa=kernel.GetProcAddress
          gpa.argtypes=[ctypes.c_void_p,ctypes.c_char_p]
          gpa.restype=ctypes.c_void_p
          module_path=kernel.GetModuleFileNameW
          module_path.argtypes=[ctypes.c_void_p,ctypes.c_wchar_p,ctypes.c_uint32]
          module_path.restype=ctypes.c_uint32
          total_names=0
          while queue:
              src=queue.popleft()
              key=str(src.resolve()).casefold()
              if key in seen:
                  continue
              seen.add(key)
              if len(seen)>190:
                  errors.append({"error":"unbounded-closure","count":len(seen)})
                  break
              if not src.is_file():
                  errors.append({"error":"module-absent","module":str(src)})
                  continue
              pe=pefile.PE(str(src),fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
              descriptors=list(getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]))
              modules.append({"module":str(src),"imports":len(descriptors)})
              for descriptor in descriptors:
                  name=descriptor.dll.decode("ascii","replace")
                  if name.lower().startswith(("api-ms-win-","ext-ms-win-")):
                      system_names.add(name)
                      continue
                  local=runtime/name
                  if not local.is_file():
                      if (system/name).is_file():
                          system_names.add(name)
                          continue
                      errors.append({"importer":src.name,"dependency":name,"error":"not-in-runtime-or-system"})
                      continue
                  queue.append(local)
                  try:
                      loaded=ctypes.WinDLL(str(local),use_last_error=True)
                  except OSError as exc:
                      errors.append({"importer":src.name,"dependency":name,"error":"native-LoadLibrary","detail":str(exc)})
                      continue
                  buf=ctypes.create_unicode_buffer(32768)
                  n=module_path(loaded._handle,buf,len(buf))
                  actual=Path(buf.value) if n else None
                  if not n or actual.resolve().as_posix().casefold()!=local.resolve().as_posix().casefold():
                      errors.append({"importer":src.name,"dependency":name,"error":"loaded-wrong-dll-path","actual":str(actual),"expected":str(local)})
                      continue
                  for symbol in descriptor.imports:
                      if symbol.name is None:
                          errors.append({"importer":src.name,"dependency":name,"error":"ordinal-not-tested","ordinal":symbol.ordinal})
                          continue
                      total_names+=1
                      if not gpa(loaded._handle,symbol.name):
                          missing.append({"importer":src.name,"dependency":name,"symbol":symbol.name.decode("ascii","replace")})
              pe.close()
          result={"claim":"native-Windows-GetProcAddress-over-recursive-non-system-PE-import-graph",
                  "imported_names_checked":total_names,"modules":modules,
                  "system_dependencies_excluded":sorted(system_names),
                  "missing_named_exports":missing,"errors":errors}
          path=Path("ci-artifacts/qt665-windows-running/native-transitive-getprocaddress.json")
          path.write_text(json.dumps(result,indent=2)+"\n")
          print(f"QT665_NATIVE_RECURSIVE_IMPORTS modules={len(modules)} names={total_names} missing={len(missing)} errors={len(errors)} system_excluded={len(system_names)}")
          for item in (missing+errors)[:60]:
              print("QT665_NATIVE_RECURSIVE_FINDING "+json.dumps(item,sort_keys=True))
          if missing or errors:
              print("QT665_NATIVE_RECURSIVE_CLOSURE=FAIL")
              raise SystemExit(93)
          print("QT665_NATIVE_RECURSIVE_CLOSURE=PASS_NON_SYSTEM_DIRECT_IMPORT_NAMES")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native full Windows dependency closure falsified, see archived causal names' }
      - name: Validate native Windows symbol oracle, reject former static false refusals
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $evidence='ci-artifacts/qt665-windows-running/native-transitive-getprocaddress.json'
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) {throw 'Native DLL evidence missing'}
          $data=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ($data.claim -ne 'native-Windows-GetProcAddress-over-recursive-non-system-PE-import-graph') {throw 'Unknown native verifier'}
          if (@($data.modules).Count -lt 40 -or [int]$data.imported_names_checked -lt 12000) {
            throw 'Native recursive import graph was not fully exercised'
          }
          if (@($data.errors).Count -or @($data.missing_named_exports).Count) {throw 'Real native closure is not clean'}
          foreach ($moduleName in @('webots-bin.exe','webots.exe','qwindows.dll','libopenal-1.dll')) {
            if (-not @($data.modules | Where-Object { [IO.Path]::GetFileName($_.module) -eq $moduleName }).Count) {
              throw "Native import graph is missing $moduleName"
            }
          }
          if (-not (Test-Path 'ci-artifacts/qt665-windows-running/live-qt-modules.txt' -PathType Leaf)) {
            throw 'Real Webots PE / mapped Qt identity proof missing'
          }
          Write-Host 'QT665_WINDOWS_NATIVE_CLOSURE_VALIDATOR=PASS_REAL_WIN32_NOT_STATIC_PEFILE'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install process observation dependency in probe host only
        shell: pwsh
        run: python -m pip install --disable-pip-version-check psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          run-id: 40386450869
          name: WebeeBlocks-Windows-R2025a
          github-token: ${{ github.token }}
          path: qt665-classroom-archive
      - name: Exercise genuine packaged Runtime on patched Windows installation without SDK PATH
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'Qt665 classroom consumer with spaces'
          Expand-Archive -LiteralPath 'qt665-classroom-archive/WebeeBlocks-Windows-R2025a.zip' -DestinationPath $package
          python experiments/webots-qt-665/probe_windows_packaged_runtime.py `
            --home $env:QT665_WEBOTS_HOME --package $package `
            --pe-artifact qt665-patched-pe --sdk $env:QT665_MINGW_BIN `
            --output ci-artifacts/qt665-windows-running/packaged-startup
          if ($LASTEXITCODE -ne 0) {throw 'Real packaged Runtime startup or native identities refuted'}
      - name: Preserve windows native proof, even if incompatibility is observed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt665-windows-real-consumer-${{ github.sha }}
          path: ci-artifacts/qt665-windows-running/
          if-no-files-found: warn
