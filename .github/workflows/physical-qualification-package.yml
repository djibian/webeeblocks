name: CI Physical qualification package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/physical-qualification-package.yml'
      - 'tools/physical/**'
      - 'tools/ci/test_physical_qualification_package.py'
      - 'tools/prepare_runtime_v2.sh'
      - 'plugins/robot_windows/blockly_v2/**'
      - 'plugins/robot_windows/blockly/webeeblocks/**'
      - 'plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js'
      - 'worlds/crazyflie_runtime_v2.wbt'
      - 'controllers/crazyflie_runtime_v2/**'
      - 'controllers/crazyflie_square/pid_controller.c'
      - 'controllers/crazyflie_square/pid_controller.h'
  workflow_dispatch:

concurrency:
  group: physical-qualification-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Restore exact qualification Python runtime
        id: qualification-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/qualification-package-runtime
          key: qualification-package-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Checkout pinned cflib for Draft or maintenance cache priming
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-lib-python
          ref: 45fdb784c9d13074c42835f3b5ac1d12133bf873
          path: .qualification-package-cflib
          fetch-depth: 1
          persist-credentials: false

      - name: Prime exact qualification Python runtime for Draft or maintenance
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          support=.ci-support/qualification-package-runtime
          source="$support/cflib-source"
          wheelhouse="$support/wheels"
          rm -rf "$support"
          mkdir -p "$source" "$wheelhouse"

          test "$(git -C .qualification-package-cflib rev-parse HEAD)" = "45fdb784c9d13074c42835f3b5ac1d12133bf873"
          test "$(git -C .qualification-package-cflib rev-parse 'HEAD^{tree}')" = "a78cf78d2b4aba51a0fa2b03de0260664b523401"
          test "$(git -C .qualification-package-cflib rev-parse 'HEAD:cflib')" = "750e850390753de14019f0e1f55d4fbc44317699"
          cp -a .qualification-package-cflib/. "$source/"

          expected="$RUNNER_TEMP/qualification-package-wheel-sha256.txt"
          : > "$expected"
          while IFS='|' read -r spec filename digest; do
            case "$spec" in ''|'#'*) continue ;; esac
            python3 -m pip download --disable-pip-version-check \
              --no-deps --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --implementation cp --python-version 310 --abi cp310 \
              --dest "$wheelhouse" "$spec"
            test -f "$wheelhouse/$filename"
            printf '%s  %s\n' "$digest" "$wheelhouse/$filename" >> "$expected"
          done < tools/physical/qualification_runtime_lock.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          sha256sum -c "$expected"
          python3 tools/physical/verify_qualification_runtime.py "$source" "$wheelhouse"

      - name: Save exact qualification Python runtime for Draft or maintenance
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-support/qualification-package-runtime
          key: qualification-package-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Restore exact prepared Runtime v2 package inputs
        id: qualification-input-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            plugins/robot_windows/blockly_v2/webots
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}

      - uses: actions/setup-node@v4
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-input-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Prime prepared Runtime v2 package inputs for Draft or maintenance
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-input-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          docker pull cyberbotics/webots:R2025a-ubuntu22.04
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make'
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2

      - name: Save prepared Runtime v2 package inputs for Draft or maintenance
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            plugins/robot_windows/blockly_v2/webots
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}

      - name: Fail closed unless both exact caches are available
        shell: bash
        run: |
          set -euo pipefail
          test -d .ci-support/qualification-package-runtime/cflib-source/.git
          test "$(find .ci-support/qualification-package-runtime/wheels -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2

      - name: Verify exact qualification runtime before packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/physical/verify_qualification_runtime.py \
            .ci-support/qualification-package-runtime/cflib-source \
            .ci-support/qualification-package-runtime/wheels

      - name: Build and verify exact offline physical qualification artifact
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 tools/physical/package_physical_qualification.py \
            --source-sha "$target" \
            --cflib-root .ci-support/qualification-package-runtime/cflib-source \
            --wheelhouse .ci-support/qualification-package-runtime/wheels \
            --output-root ci-artifacts/physical-qualification
          bundle=ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification
          python3 tools/physical/verify_physical_qualification_package.py "$bundle"
          python3 tools/ci/test_physical_qualification_package.py "$bundle"

      - name: Upload exact offline physical qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-Physical-Qualification
          path: ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification/
          include-hidden-files: true
          if-no-files-found: error
