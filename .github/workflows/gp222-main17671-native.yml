# Isolated evidence on new main; not a substitute for canonical V5 CI Gate.
name: GP pupil 222 on integrated wall-free main R2025a
on:
  push:
    branches: [experiment/gp222-main17671-native-20261026]
permissions:
  contents: read
jobs:
  blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact main ancestry and unchanged safety contract
        shell: bash
        run: |
          set -euo pipefail
          base=17671d18723c858ea873311a545d8c65b97b877e
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 835dbfce603ebb509058d305802a309c84eabc75
          git diff --name-only "$base" HEAD > changed.txt
          if grep -Ev '^(experiments/grand-prix-pupil-algorithm/(Grand-Prix-sans-murs-algorithme-candidat.wbb|build.js|verify.js|verify_modular_stages.js|verify_sensor_ambiguity.js|MAIN17671_EXPERIMENT.md)|tools/grand_prix/pupil_workspace_u.js|\.github/workflows/gp222-main17671-native.yml)$' changed.txt; then
            echo 'Unexpected changes beyond pupil experiment' >&2; exit 1
          fi
          git diff --exit-code "$base" HEAD -- AGENTS.md docs/PRODUCT_VISION.md docs/ROADMAP.md tools/grand_prix/layout_u.py tools/grand_prix/oracle_u.py tools/ci/run_grand_prix_u_prototype.py tools/grand_prix/prepare_u_runtime.py
          sha256sum experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb
      - name: Real ambiguity and exact modular transformations
        run: |
          node experiments/grand-prix-pupil-algorithm/verify_modular_stages.js
          node experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js
      - name: Real Blockly 13.2.1 AST preflight interpreter and project reopen
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node experiments/grand-prix-pupil-algorithm/verify.js
          node tools/grand_prix/pupil_workspace_u.js
  native:
    needs: blockly
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind the exact student WBB to production Blockly AST
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node tools/grand_prix/pupil_workspace_u.js
      - name: R2025a full original 7 positives, 8 negatives, RESET and deadline LAND
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite all --seed 4 --side 2.0 2>&1 | tee gp222-main17671-native.log
      - name: Archive complete native evidence regardless of conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp222-main17671-r2025a-original-native
          path: |
            gp222-main17671-native.log
            ci-artifacts/grand-prix-u/
          if-no-files-found: warn
