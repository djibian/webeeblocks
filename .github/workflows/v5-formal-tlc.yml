name: V5 Formal TLC

on:
  pull_request:
    paths:
      - "docs/architecture/v5/formal/**"
      - ".github/workflows/v5-formal-tlc.yml"

concurrency:
  group: v5-formal-tlc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    name: V5 Formal TLC / ${{ matrix.config }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - WebeeBlocksV5_Ordering.cfg
          - WebeeBlocksV5_Epoch.cfg
          - WebeeBlocksV5_Duplicate.cfg
          - WebeeBlocksV5_Checkpoint.cfg
          - WebeeBlocksV5_Migration.cfg

    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify tested SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "Formal candidate: $(git rev-parse HEAD)"

      - name: Run pinned formal model check
        shell: bash
        run: bash docs/architecture/v5/formal/run_tlc.sh "${{ matrix.config }}"
