name: V5 Formal TLC

on:
  pull_request:
    paths:
      - "docs/architecture/v5/formal/**"
      - ".github/workflows/v5-formal-tlc.yml"

concurrency:
  group: v5-formal-tlc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    name: V5 Formal TLC
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify tested SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "Formal candidate: $(git rev-parse HEAD)"

      - name: Fetch pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/tools
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output .build/tools/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .build/tools/tla2tools.jar" \
            | sha256sum --check -

      - name: Parse formal modules
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tla2sany.SANY \
            WebeeBlocksV5.tla \
            WebeeBlocksV5_MC.tla

      - name: Model-check authority ordering
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tlc2.TLC \
            -workers 1 \
            -config WebeeBlocksV5_Ordering.cfg \
            WebeeBlocksV5_MC.tla

      - name: Model-check governance epochs
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tlc2.TLC \
            -workers 1 \
            -config WebeeBlocksV5_Epoch.cfg \
            WebeeBlocksV5_MC.tla

      - name: Model-check duplicate Gate recovery
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tlc2.TLC \
            -workers 1 \
            -config WebeeBlocksV5_Duplicate.cfg \
            WebeeBlocksV5_MC.tla

      - name: Model-check human checkpoint authority
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tlc2.TLC \
            -workers 1 \
            -config WebeeBlocksV5_Checkpoint.cfg \
            WebeeBlocksV5_MC.tla

      - name: Model-check V4/V5 migration
        working-directory: docs/architecture/v5/formal
        shell: bash
        run: |
          set -euo pipefail
          java -cp ../../../../.build/tools/tla2tools.jar tlc2.TLC \
            -workers 1 \
            -config WebeeBlocksV5_Migration.cfg \
            WebeeBlocksV5_MC.tla
