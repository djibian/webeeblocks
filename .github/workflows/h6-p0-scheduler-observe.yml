name: H6 P0 scheduler - observation only (not an integration gate)
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/h6_p0_scheduler/**'
      - '.github/workflows/h6-p0-scheduler-observe.yml'
permissions:
  contents: read
jobs:
  pinned-webots-observation:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
      PR760_FIXTURE: 2fa4984242230659d6d4f688480fc6f09e65fc84
      QT_QPA_PLATFORM: xcb
      WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Qualify oracle against negative mutants before native build
        run: |
          set -euo pipefail
          mkdir -p evidence/h6-p0/logs
          git rev-parse HEAD > evidence/h6-p0/experiment-head.txt
          python3 -m py_compile experiments/h6_p0_scheduler/*.py
          python3 experiments/h6_p0_scheduler/qualify_observation.py --selftest | tee evidence/h6-p0/oracle-selftest.txt
      - name: Fetch immutable fixture and pinned Webots, apply observation only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixtures/g_window/worlds             fixtures/g_window/plugins/physics/h6_g_window             fixtures/g_window/controllers/h6_g_window
          git fetch --no-tags --depth=1 origin "$PR760_FIXTURE" > evidence/h6-p0/logs/fixture-fetch.log 2>&1
          for p in plugins/physics/h6_g_window/h6_g_window.c                    plugins/physics/h6_g_window/Makefile                    controllers/h6_g_window/h6_g_window.py                    worlds/h6_g_window.wbt; do
            git show "$PR760_FIXTURE:experiments/h6/g_window/$p" > "fixtures/g_window/$p"
          done
          python3 experiments/h6_p0_scheduler/prepare_fixture.py fixtures/g_window             > evidence/h6-p0/logs/fixture-prepare.log 2>&1
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots             > evidence/h6-p0/logs/clone.log 2>&1
          git -C native-webots checkout --detach "$PIN"             > evidence/h6-p0/logs/checkout.log 2>&1
          git -C native-webots submodule update --init --recursive --jobs 4             > evidence/h6-p0/logs/submodules.log 2>&1
          test "$(git -C native-webots rev-parse HEAD)" = "$PIN"
          test -z "$(git -C native-webots status --porcelain)"
          python3 experiments/h6_p0_scheduler/patch_observe.py native-webots             > evidence/h6-p0/logs/patch.log 2>&1
          git -C native-webots diff --check
          git -C native-webots diff --binary HEAD > evidence/h6-p0/observation-only.patch
          sha256sum evidence/h6-p0/observation-only.patch             > evidence/h6-p0/observation-only.patch.sha256
          find fixtures/g_window -type f -print0 | sort -z | xargs -0 sha256sum             > evidence/h6-p0/fixture-sha256.txt
      - name: Build real pinned Webots with trace-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update > evidence/h6-p0/logs/apt-update.log 2>&1
          sudo apt-get install -y xvfb xauth python3 python-is-python3             > evidence/h6-p0/logs/apt-core.log 2>&1
          (cd native-webots && sudo bash scripts/install/linux_compilation_dependencies.sh)             > evidence/h6-p0/logs/apt-build.log 2>&1 || {
              tail -n 120 evidence/h6-p0/logs/apt-build.log; exit 1;
            }
          (cd native-webots && make -j2)             > evidence/h6-p0/logs/webots-build.log 2>&1 || {
              tail -n 120 evidence/h6-p0/logs/webots-build.log; exit 1;
            }
          export WEBOTS_HOME="$PWD/native-webots"
          make -C fixtures/g_window/plugins/physics/h6_g_window             > evidence/h6-p0/logs/plugin-build.log 2>&1 || {
              tail -n 100 evidence/h6-p0/logs/plugin-build.log; exit 1;
            }
          sha256sum native-webots/bin/webots-bin native-webots/lib/webots/libode.so             fixtures/g_window/plugins/physics/h6_g_window/libh6_g_window.so             > evidence/h6-p0/binary-sha256.txt
      - name: Observe one and two ACTUAL pthread workers with callback and group-owned P0 baseline
        shell: bash
        run: |
          set -euo pipefail
          export WEBOTS_HOME="$PWD/native-webots"
          for n in 1 2; do
            mkdir -p "evidence/h6-p0/workers$n"
            dir="$PWD/evidence/h6-p0/workers$n"
            set +e
            H6_P0_FORCE_ONE_WORKER=1             H6_G_WINDOW_PATH=global H6_G_WINDOW_R=0             H6_G_WINDOW_NATIVE_LOG="$dir/plugin.log"               timeout -k 5s 95s xvfb-run -a -s '-screen 0 1280x800x24'                 "$WEBOTS_HOME/webots" --batch --mode=fast --no-rendering --stdout --stderr                 "$PWD/fixtures/g_window/worlds/h6_p0_workers$n.wbt"                 > "$dir/webots.log" 2>&1
            code=$?
            set -e
            echo "$code" > "$dir/exit.txt"
            if [ "$code" -ne 0 ]; then
              echo "H6_P0_UNPROVEN worker case $n exited $code"
              tail -n 70 "$dir/webots.log"
              exit 80
            fi
            python3 experiments/h6_p0_scheduler/qualify_observation.py "$dir/webots.log" "$n"               | tee "$dir/qualification.txt"
          done
      - name: Keep complete traces, source diff and SHA-256 even on RED
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/h6-p0/logs
          git rev-parse HEAD > evidence/h6-p0/observed-head.txt
          if [ -d native-webots/.git ]; then
            git -C native-webots rev-parse HEAD > evidence/h6-p0/observed-pin.txt
          fi
          find evidence/h6-p0 -type f ! -name SHA256SUMS.txt -print0 | sort -z             | xargs -0 -r sha256sum > evidence/h6-p0/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-p0-scheduler-observation
          path: evidence/h6-p0
          retention-days: 90
          if-no-files-found: error
