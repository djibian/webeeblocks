name: Grand Prix A1–A7 native R2025a
run-name: Native R2025a validation A1–A5 and A7

on:
  pull_request:
    branches: [main]
    types: [synchronize]


permissions:
  contents: read

jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - activity: '1'
            target_sha: 31b8b003c57a91e1947b12611b43c5a42c0d52d6
          - activity: '2'
            target_sha: 9ce9d57857a74ae575ce0863c35f9e18f7390fc6
          - activity: '3'
            target_sha: 324fa2b6034f55bf0af3aa6adac26beed565aa99
          - activity: '4'
            target_sha: 8611472531d18fc595f5a87dc98f49cc7211d65f
          - activity: '5'
            target_sha: e6acb9c644e9285751b1793098a1c383009a54d0
          - activity: '7'
            target_sha: 4991ff22bffebbd451a07d4c4e88612a6c2b8db8
    name: Native R2025a A${{ matrix.activity }}
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      ACTIVITY: ${{ matrix.activity }}
      TARGET_SHA: ${{ matrix.target_sha }}
      PROTO_SHA: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
      WEBOTS_OFFICIAL_IMAGE: cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099
      WEBOTS_M2_IMAGE: ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca
    steps:
      - name: Require a complete SHA and known activity
        shell: bash
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTIVITY" =~ ^[1-7]$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_sha }}
          path: candidate
          persist-credentials: false
      - name: Bind the two checkouts to the Actions run
        shell: bash
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p provenance
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "workflow_sha=$GITHUB_WORKFLOW_SHA" \
            "target_sha=$TARGET_SHA" "activity=$ACTIVITY" "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" "webots_source=$PROTO_SHA" > provenance/run.txt
      - name: Checkout pinned Cyberbotics assets
        uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: ${{ env.PROTO_SHA }}
          path: webots-assets
          sparse-checkout: |
            /projects/robots/bitcraze/crazyflie/protos/
            /projects/default/protos/textures/fast_helix.png
            /projects/appearances/protos/textures/parquetry/chequered_parquetry_*.jpg
            /projects/objects/backgrounds/protos/TexturedBackground.proto
            /projects/objects/backgrounds/protos/TexturedBackgroundLight.proto
            /projects/objects/floors/protos/Floor.proto
            /projects/appearances/protos/Parquetry.proto
            /projects/default/worlds/textures/cubic/mountains_*.jpg
            /projects/default/worlds/textures/cubic/mountains_*.hdr
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the candidate's native campaign
        timeout-minutes: 85
        shell: bash
        working-directory: candidate
        run: |
          set -o pipefail
          bash ../harness/tools/ci/run_grand_prix_native_campaign.sh 2>&1 | tee ../provenance/campaign.log
      - name: Archive raw native traces, worlds and run identity
        if: ${{ always() && hashFiles('provenance/run.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-r2025a-a${{ matrix.activity }}-${{ matrix.target_sha }}-attempt-${{ github.run_attempt }}
          path: |
            provenance/
            candidate/ci-artifacts/grand-prix-u-geometry/
            candidate/ci-artifacts/grand-prix-v2-h-native/
          if-no-files-found: error
          retention-days: 30
