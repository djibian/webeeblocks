name: Qualification support maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualification-support-maintenance.yml'
      - 'tools/ci/test_qualification_support_maintenance.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate maintenance contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate main-scoped qualification support maintenance
        run: python3 tools/ci/test_qualification_support_maintenance.py

  prime:
    name: Prime exact qualification support on main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Restore exact physical qualification runtime support
        id: qualification-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Checkout pinned cflib for qualification runtime maintenance
        if: steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-lib-python
          ref: 45fdb784c9d13074c42835f3b5ac1d12133bf873
          path: .qualification-cflib-source
          fetch-depth: 1
          persist-credentials: false

      - name: Prime exact physical qualification runtime support
        if: steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          support=.ci-support/qualification-runtime
          wheelhouse="$support/wheels"
          source="$support/cflib-source"
          rm -rf "$support"
          mkdir -p "$wheelhouse" "$source"

          test "$(git -C .qualification-cflib-source rev-parse HEAD)" = "45fdb784c9d13074c42835f3b5ac1d12133bf873"
          test "$(git -C .qualification-cflib-source rev-parse 'HEAD^{tree}')" = "a78cf78d2b4aba51a0fa2b03de0260664b523401"
          test "$(git -C .qualification-cflib-source rev-parse 'HEAD:cflib')" = "750e850390753de14019f0e1f55d4fbc44317699"
          cp -a .qualification-cflib-source/. "$source/"

          expected="$RUNNER_TEMP/qualification-runtime-wheel-sha256.txt"
          : > "$expected"
          while IFS='|' read -r spec filename digest; do
            case "$spec" in ''|'#'*) continue ;; esac
            python3 -m pip download --disable-pip-version-check \
              --no-deps --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --implementation cp --python-version 310 --abi cp310 \
              --dest "$wheelhouse" "$spec"
            test -f "$wheelhouse/$filename"
            printf '%s  %s\n' "$digest" "$wheelhouse/$filename" >> "$expected"
          done < tools/physical/qualification_runtime_lock.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          sha256sum -c "$expected"

      - name: Verify exact physical qualification runtime support
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_physical_qualification_runtime_lock.py
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          python3 tools/physical/verify_qualification_runtime.py "$source" "$wheelhouse"

      - name: Save exact physical qualification runtime support
        if: steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Restore exact prepared qualification package inputs
        id: qualification-package-input-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - uses: actions/setup-node@v4
        if: steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Prime exact prepared qualification package inputs
        if: steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          WEBOTS_IMAGE='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          docker pull "$WEBOTS_IMAGE"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            "$WEBOTS_IMAGE" \
            bash -lc 'make clean && make'
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Prime exact cached Webots image support
        if: steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WEBOTS_IMAGE='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          vendor=plugins/robot_windows/blockly_v2/vendor
          support_tar="$vendor/.qualification-webots-r2025a-image.tar"
          support_id="$vendor/.qualification-webots-r2025a-image.id"
          image_id="$(docker image inspect --format '{{.Id}}' "$WEBOTS_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          rm -f "$support_tar.tmp" "$support_id.tmp"
          docker save --output "$support_tar.tmp" "$WEBOTS_IMAGE"
          test -f "$support_tar.tmp"
          test "$(stat -c '%s' "$support_tar.tmp")" -ge 1048576
          printf '%s\n' "$image_id" > "$support_id.tmp"
          mv "$support_tar.tmp" "$support_tar"
          mv "$support_id.tmp" "$support_id"
          test "$(cat "$support_id")" = "$image_id"

      - name: Require complete prepared qualification cache before save
        if: steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s plugins/robot_windows/blockly_v2/vendor/.qualification-webots-r2025a-image.tar
          test -s plugins/robot_windows/blockly_v2/vendor/.qualification-webots-r2025a-image.id
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2

      - name: Save exact prepared qualification package inputs
        if: steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - name: Verify exact prepared qualification package inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.qualification-package-input-cache.outputs.cache-hit }}" = "true" ]; then
            test -s plugins/robot_windows/blockly_v2/vendor/.qualification-webots-r2025a-image.tar
            test -s plugins/robot_windows/blockly_v2/vendor/.qualification-webots-r2025a-image.id
          fi
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Build and verify exact offline physical qualification artifact
        shell: bash
        run: |
          set -euo pipefail
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          python3 tools/physical/package_physical_qualification.py \
            --source-sha "$(git rev-parse HEAD)" \
            --cflib-root "$source" \
            --wheelhouse "$wheelhouse" \
            --output-root ci-artifacts/physical-qualification
          bundle=ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification
          python3 tools/physical/verify_physical_qualification_package.py "$bundle"
          python3 tools/ci/test_physical_qualification_package.py "$bundle"
