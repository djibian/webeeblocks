name: Grand Prix four pupil procedures experimental R2025a
on:
  push:
    branches: [experiment/gp234-readable-side-main17671-20261026]
permissions:
  contents: read
jobs:
  blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: No world, oracle or CI change
        shell: bash
        run: |
          set -euo pipefail
          base=1bc106f99d58ca12d2a05239dbdaaddda9dd396b
          test "$(git rev-parse HEAD^)" = "$base"
          git diff --exit-code "$base" HEAD -- AGENTS.md docs/PRODUCT_VISION.md docs/ROADMAP.md tools/grand_prix/layout_u.py tools/grand_prix/oracle_u.py tools/ci/run_grand_prix_u_prototype.py
      - name: Real pupil Blockly, regression and adversarial sensors
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node experiments/grand-prix-pupil-algorithm/verify_modular_stages.js
          node experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js
          node experiments/grand-prix-pupil-algorithm/verify_repeated_echo.js
          node experiments/grand-prix-pupil-algorithm/verify.js
          node tools/grand_prix/pupil_workspace_u.js
  native:
    needs: blockly
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare exact pupil AST
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node tools/grand_prix/pupil_workspace_u.js
      - name: Original native 16 R2025a cases RESET and LAND exact 210s
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite all --seed 4 --side 2.0 2>&1 | tee gp234-native.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp234-classroom-native
          path: |
            gp234-native.log
            ci-artifacts/grand-prix-u/
          if-no-files-found: warn
