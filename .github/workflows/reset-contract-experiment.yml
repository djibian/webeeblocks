name: Bounded RESET contract experiment
on:
  push:
    branches: [experiment/reset637-contract-20261021]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          path: engine
          sparse-checkout: projects/robots/bitcraze/crazyflie/protos
          persist-credentials: false
      - name: Pull exact R2025a
        run: docker pull cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099
      - name: Three unstarted cases only; no replacement of A-idle
        run: python3 experiments/runtime-reset-contract/acquire.py --remaining
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-contract-${{ github.sha }}
          path: ci-artifacts/reset-contract-remaining
          if-no-files-found: error
