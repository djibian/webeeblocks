# Experimental 232 pupil guard, real integrated main R2025a, not CI Gate.
name: GP232 guarded staged pupil integrated main native
on:
  push:
    branches: [experiment/gp232-safe-stages-main17671-20261026]
permissions:
  contents: read
jobs:
  blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin provenance, no oracle or main-world mutation
        shell: bash
        run: |
          set -euo pipefail
          base=5db5128896bfcb1986b1ca830adae79418ae929f
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- AGENTS.md docs/PRODUCT_VISION.md docs/ROADMAP.md tools/grand_prix/layout_u.py tools/grand_prix/oracle_u.py tools/ci/run_grand_prix_u_prototype.py controllers/grand_prix_u_flight
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/GP232_reference_main17671.wbb)" = 02c0cdef8fc7189aa171b584a8160b52e392ba1c
          sha256sum experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb
      - name: Structural regression, sensor ambiguity, adversarial repeated echo
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node experiments/grand-prix-pupil-algorithm/verify_modular_stages.js
          node experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js
          node experiments/grand-prix-pupil-algorithm/verify_repeated_echo.js
      - name: Genuine Blockly AST, preflight and Save/Open with source map
        run: |
          node experiments/grand-prix-pupil-algorithm/verify.js
          node tools/grand_prix/pupil_workspace_u.js
  native:
    needs: blockly
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact real pupil WBB compiler and profile
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node tools/grand_prix/pupil_workspace_u.js
      - name: Original native R2025a 16-case campaign including RESET and 210s
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite all --seed 4 --side 2.0 2>&1 | tee gp232-guarded-main17671-native.log
      - name: Archive full native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp232-guarded-main17671-r2025a-full
          path: |
            gp232-guarded-main17671-native.log
            ci-artifacts/grand-prix-u/
          if-no-files-found: warn
