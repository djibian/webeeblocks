          assert abs(float(pairs['g2_time']) - 21.315) <= 0.10
          assert float(pairs['endpoint_error_xy']) <= 0.02
          assert float(pairs['yaw_error_deg']) <= 2.0
          assert abs(float(pairs['total_s']) - 26.144) <= 0.15
          print('PASS: Blockly Submit -> one WWI mission -> validation -> shared STOP executor -> L course; persistent runtime rearmed afterwards.')
