  crazyflie-square:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build measured square controller
        shell: bash
        run: |
          mkdir -p ci-artifacts/crazyflie-repeatability
          rm -f ci-artifacts/crazyflie-square-result.txt
          rm -f ci-artifacts/crazyflie-repeatability/*
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_square \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-square-build.log

      - name: Fly ten identical measured 1 m squares
        shell: bash
        run: |
          set -euo pipefail
          for run in $(seq 1 10); do
            printf -v run_id '%02d' "$run"
            LOG="ci-artifacts/crazyflie-repeatability/run-${run_id}.log"
            EXIT_FILE="ci-artifacts/crazyflie-repeatability/run-${run_id}-exit-code.txt"
            RESULT_COPY="ci-artifacts/crazyflie-repeatability/run-${run_id}-result.txt"
            RESULT_FILE="ci-artifacts/crazyflie-square-result.txt"

            # Fail closed against stale output: every Webots process must create
            # its own fresh persisted result.
            rm -f "$RESULT_FILE"

            set +e
            docker run --rm \
              -e LIBGL_ALWAYS_SOFTWARE=true \
              -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'timeout -k 5s 90s xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/crazyflie_square.wbt' \
              2>&1 | tee "$LOG"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "$EXIT_FILE"

            if [ "$code" -ne 0 ]; then
              echo "::error::Crazyflie repeatability run $run exited with code $code"
              exit "$code"
            fi
            if grep -Fq 'WEBEEBLOCKS_CF_SQUARE_FAILED' "$LOG"; then
              grep -F 'WEBEEBLOCKS_CF_SQUARE_FAILED' "$LOG"
              exit 1
            fi
            if grep -Fq 'ERROR:' "$LOG"; then
              grep -F 'ERROR:' "$LOG"
              exit 1
            fi
            if [ ! -s "$RESULT_FILE" ]; then
              echo "::error::Crazyflie repeatability run $run produced no fresh result file"
              exit 1
            fi

            RESULT=$(tail -1 "$RESULT_FILE")
            echo "run=$run $RESULT"
            echo "$RESULT" | grep -Fq 'WEBEEBLOCKS_CF_SQUARE_RESULT status=success'
            echo "$RESULT" | grep -Fq 'legs=4'
            cp "$RESULT_FILE" "$RESULT_COPY"
          done

      - name: Summarize repeatability distribution
        shell: bash
        run: |
          python3 tools/ci/summarize_crazyflie_repeatability.py \
            ci-artifacts/crazyflie-repeatability/run-??-result.txt \
            --json ci-artifacts/crazyflie-repeatability-summary.json \
            --text ci-artifacts/crazyflie-repeatability-summary.txt

      - name: Upload Crazyflie square diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-square-r2025a
          path: ci-artifacts/
          if-no-files-found: error
  stop-vs-chain:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build shared handoff controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-handoff
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_handoff_course \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-handoff/build.log

      - name: Run identical L course with STOP and CHAIN
        shell: bash
        run: |
          set -o pipefail
          for policy in STOP CHAIN; do
            rm -f "ci-artifacts/crazyflie-handoff-${policy}-result.txt"
            set +e
            docker run --rm \
              -e LIBGL_ALWAYS_SOFTWARE=true \
              -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
              -e WEBEEBLOCKS_HANDOFF_POLICY="${policy}" \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'timeout -k 5s 90s xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/crazyflie_handoff_course.wbt' \
              2>&1 | tee "ci-artifacts/crazyflie-handoff/${policy}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "ci-artifacts/crazyflie-handoff/${policy}-exit-code.txt"
            if [ "$code" -ne 0 ]; then
              echo "::error::${policy} Webots run exited with $code"
              exit 1
            fi
          done

      - name: Validate same mission and publish comparison
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def parse(policy):
              result = Path(f"ci-artifacts/crazyflie-handoff-{policy}-result.txt")
              log = Path(f"ci-artifacts/crazyflie-handoff/{policy}.log")
              assert result.is_file() and result.stat().st_size > 0
              line = result.read_text().strip()
              pairs = dict(re.findall(r'([A-Za-z0-9_]+)=([^\s]+)', line))
              assert pairs.get("status") == "success", line
              assert pairs.get("policy") == policy, line
              assert pairs.get("gates") == "2", line
              text = log.read_text()
              assert "ERROR:" not in text
              assert "WEBEEBLOCKS_CF_POSITION_FAILED" not in text
              g1 = float(pairs["g1_time"])
              g2 = float(pairs["g2_time"])
              total = float(pairs["total_s"])
              assert 0 < g1 < g2 < total
              assert abs(float(pairs["g1_lateral"])) <= 0.30
              assert abs(float(pairs["g2_lateral"])) <= 0.30
              assert abs(float(pairs["g1_altitude_error"])) <= 0.20
              assert abs(float(pairs["g2_altitude_error"])) <= 0.20
              assert float(pairs["corner_max_overshoot"]) < 0.50
              assert float(pairs["corner_max_l_deviation"]) < 0.50
              assert 45.0 < float(pairs["turn_handoff_yaw_travel_deg"]) < 135.0
              assert float(pairs["turn_max_yaw_overshoot_deg"]) < 45.0
              assert float(pairs["endpoint_error_xy"]) < 0.50
              assert float(pairs["yaw_error_deg"]) < 45.0
              return pairs

          stop = parse("STOP")
          chain = parse("CHAIN")

          keys = [
              "g1_lateral", "g1_altitude_error",
              "g2_lateral", "g2_altitude_error",
              "corner_handoff_error_xy", "corner_handoff_speed",
              "corner_max_overshoot", "corner_max_l_deviation",
              "turn_handoff_yaw_travel_deg", "turn_max_yaw_overshoot_deg",
              "endpoint_error_xy", "yaw_error_deg", "total_s",
          ]
          print("metric STOP CHAIN delta_CHAIN_minus_STOP")
          for key in keys:
              a = float(stop[key])
              b = float(chain[key])
              print(f"{key} {a:.6f} {b:.6f} {b-a:+.6f}")
          PY

      - name: Publish STOP-vs-CHAIN results
        if: always()
        shell: bash
        run: |
          {
            echo '## Crazyflie STOP vs CHAIN'
            echo '```text'
            for policy in STOP CHAIN; do
              if [ -f "ci-artifacts/crazyflie-handoff-${policy}-result.txt" ]; then
                cat "ci-artifacts/crazyflie-handoff-${policy}-result.txt"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-stop-vs-chain-r2025a
          path: |
            ci-artifacts/crazyflie-handoff/
            ci-artifacts/crazyflie-handoff-STOP-result.txt
            ci-artifacts/crazyflie-handoff-CHAIN-result.txt
          if-no-files-found: error
  strategy-timing:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate student-grid fixtures and harness
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/robot_windows/blockly/main.js
          python3 -m py_compile tools/ci/prepare_crazyflie_parametric_obstacle.py
          python3 -m py_compile tools/ci/runtime_wwi_event_server.py
          python3 - <<'PY'
          from pathlib import Path
          reference = Path('controllers/Blockly_Programs/CrazyflieL.xml').read_text()
          shortcut = Path('controllers/Blockly_Programs/CrazyflieShortcut85.xml').read_text()
          assert reference != shortcut
          assert '<field name="DISTANCE">1</field>' in shortcut
          assert '<field name="ANGLE">85</field>' in shortcut
          assert '0.91' not in shortcut and '84.857' not in shortcut and '1.004' not in shortcut
          print('PASS: both strategies are representable on the current student grid (0.1 m, 1 degree).')
          PY

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged runtime and collision observer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-strategy-timing
          for controller in crazyflie_l_course crazyflie_collision_observer; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-strategy-timing/build-${controller}.log"
          done
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-strategy-timing/controller-before.sha256

      - name: Run both Blockly strategies in fresh Webots processes
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_wwi_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_wwi_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              cp /workspace/plugins/robot_windows/blockly/blockly.html /tmp/blockly.original.html
              restore_html() { cp /tmp/blockly.original.html /workspace/plugins/robot_windows/blockly/blockly.html; }
              trap restore_html EXIT

              run_strategy() {
                label="$1"
                fixture="$2"
                out="/workspace/ci-artifacts/crazyflie-strategy-timing/${label}"
                mkdir -p "$out"
                restore_html
                python3 /workspace/tools/ci/prepare_crazyflie_parametric_obstacle.py "$fixture" --expect-done
                rm -f /workspace/ci-artifacts/crazyflie-l-course-result.txt
                rm -f /workspace/ci-artifacts/crazyflie-runtime-mission-result.txt
                rm -f /workspace/ci-artifacts/crazyflie-obstacle-contact.txt
                rm -f "$out/events.jsonl"

                python3 /workspace/tools/ci/runtime_wwi_event_server.py --output "$out/events.jsonl" &
                event_pid=$!
                xvfb-run -a webots --stdout --stderr --batch --mode=realtime \
                  /workspace/worlds/crazyflie_runtime_obstacle.wbt > "$out/webots.log" 2>&1 &
                webots_pid=$!
                complete=0
                for i in $(seq 1 1000); do
                  if grep -Fq "STATE_AFTER_RUNTIME_READY" "$out/events.jsonl" 2>/dev/null; then
                    complete=1
                    break
                  fi
                  if grep -Fq "\"event\":\"ERROR\"" "$out/events.jsonl" 2>/dev/null; then
                    cat "$out/events.jsonl"
                    kill "$webots_pid" "$event_pid" 2>/dev/null || true
                    exit 1
                  fi
                  if ! kill -0 "$webots_pid" 2>/dev/null; then
                    cat "$out/webots.log"
                    kill "$event_pid" 2>/dev/null || true
                    exit 1
                  fi
                  sleep 0.1
                done
                kill "$webots_pid" "$event_pid" 2>/dev/null || true
                wait "$webots_pid" 2>/dev/null || true
                wait "$event_pid" 2>/dev/null || true
                pkill -x chrome 2>/dev/null || true
                pkill -x google-chrome 2>/dev/null || true

                if [ "$complete" -ne 1 ]; then
                  echo "Strategy $label did not reach RUNTIME_READY"
                  cat "$out/events.jsonl" 2>/dev/null || true
                  cat "$out/webots.log"
                  exit 1
                fi
                grep -Fq "WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS" "$out/webots.log"
                ! grep -Fq "WEBEEBLOCKS_OBSTACLE_RESULT status=COLLISION" "$out/webots.log"
                if test -s /workspace/ci-artifacts/crazyflie-runtime-mission-result.txt; then
                  cp /workspace/ci-artifacts/crazyflie-runtime-mission-result.txt "$out/runtime-result.txt"
                fi
                if test -s /workspace/ci-artifacts/crazyflie-l-course-result.txt; then
                  cp /workspace/ci-artifacts/crazyflie-l-course-result.txt "$out/reference-l-result.txt"
                fi
                if test -s /workspace/ci-artifacts/crazyflie-obstacle-contact.txt; then
                  cp /workspace/ci-artifacts/crazyflie-obstacle-contact.txt "$out/obstacle-contact.txt"
                fi
              }

              run_strategy S0 controllers/Blockly_Programs/CrazyflieL.xml
              run_strategy S1 controllers/Blockly_Programs/CrazyflieShortcut85.xml
            '

      - name: Compare physical success and Webots times
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('ci-artifacts/crazyflie-strategy-timing')
          expected_blocks = {
              'S0': ['webeeblocks_forward:1', 'webeeblocks_turn:90', 'webeeblocks_forward:1'],
              'S1': ['webeeblocks_forward:1', 'webeeblocks_turn:85', 'webeeblocks_forward:1'],
          }
          elapsed = {}
          summary = {}
          for label in ('S0', 'S1'):
              out = root / label
              log = (out / 'webots.log').read_text()
              events = [json.loads(line) for line in (out / 'events.jsonl').read_text().splitlines() if line.strip()]
              assert not any(e['event'] == 'ERROR' for e in events), (label, events)
              blocks = [e['detail'] for e in events if e['event'] == 'BLOCKS'][-1]
              for token in expected_blocks[label]:
                  assert token in blocks, (label, token, blocks)
              assert any(e['event'] == 'STATE_AFTER_RUNTIME_READY' for e in events), (label, events)
              matches = re.findall(r'WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS elapsed=([0-9.]+)', log)
              assert matches, (label, log[-4000:])
              elapsed[label] = float(matches[-1])
              summary[label] = {'elapsed_s': elapsed[label], 'blocks': blocks}

          delta = elapsed['S0'] - elapsed['S1']
          assert delta > 0.0, f'grid-valid shortcut was not faster: S0={elapsed["S0"]:.3f}s S1={elapsed["S1"]:.3f}s'
          summary['comparison'] = {'S0_minus_S1_s': delta, 'faster': 'S1'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n')
          print(f'PASS: both Blockly strategies physically succeeded; S0={elapsed["S0"]:.3f}s, S1={elapsed["S1"]:.3f}s, gain={delta:.3f}s.')
          PY
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-strategy-timing/controller-after.sha256
          cmp ci-artifacts/crazyflie-strategy-timing/controller-before.sha256 \
              ci-artifacts/crazyflie-strategy-timing/controller-after.sha256

      - name: Upload strategy timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-strategy-timing-r2025a
          path: ci-artifacts/crazyflie-strategy-timing/
          if-no-files-found: error
