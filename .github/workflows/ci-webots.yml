name: CI Webots Suite

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact WebeeBlocks Git object to prove.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-surface-offset-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Checkout pinned Crazyflie firmware 2026.08
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-firmware
          ref: 54f31e243a0b28b67efef5ba20dbb6d9890a5478
          path: .ci-crazyflie-firmware
          submodules: recursive
          fetch-depth: 1

      - name: Validate exact source, apply S3 and build UKF-enabled cf2
        run: bash experiments/crazyflie-ukf-surface-range/run_s3_build_oracle.sh .ci-crazyflie-firmware

      - name: Record deterministic S3 evidence
        if: always()
        run: |
          mkdir -p ci-artifacts/s3-surface-offset
          git -C .ci-crazyflie-firmware rev-parse HEAD > ci-artifacts/s3-surface-offset/upstream-sha.txt
          git -C .ci-crazyflie-firmware diff -- src/modules/src/estimator/estimator_ukf.c > ci-artifacts/s3-surface-offset/estimator_ukf.patch || true
          if [ -f .ci-crazyflie-firmware/build/cf2.elf ]; then
            sha256sum .ci-crazyflie-firmware/build/cf2.elf > ci-artifacts/s3-surface-offset/cf2.elf.sha256
          fi
          if [ -f .ci-crazyflie-firmware/build/cf2.bin ]; then
            sha256sum .ci-crazyflie-firmware/build/cf2.bin > ci-artifacts/s3-surface-offset/cf2.bin.sha256
          fi

      - name: Upload S3 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-s3-surface-offset-2026-08
          path: ci-artifacts/s3-surface-offset/
          if-no-files-found: error

  crazyflie-ab-matrix:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build backend A and backend B controllers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-ab-matrix
          for controller in crazyflie_square crazyflie_square_position; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-ab-matrix/build-${controller}.log"
          done

      - name: Run five common deterministic scenarios for A and B
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/run_crazyflie_ab_matrix.py

      - name: Publish matrix summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-artifacts/crazyflie-ab-matrix/matrix.md ]; then
            cat ci-artifacts/crazyflie-ab-matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload A/B diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-ab-perturbation-r2025a
          path: ci-artifacts/crazyflie-ab-matrix/
          if-no-files-found: error
  crazyflie-b-edges:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build backend B controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-b-edge-matrix
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_square_position \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-b-edge-matrix/build.log

      - name: Run four backend B edge cases
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/run_crazyflie_b_edge_matrix.py

      - name: Publish edge characterization
        if: always()
        shell: bash
        run: |
          if [ -f ci-artifacts/crazyflie-b-edge-matrix/matrix.md ]; then
            cat ci-artifacts/crazyflie-b-edge-matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-b-edge-characterization-r2025a
          path: ci-artifacts/crazyflie-b-edge-matrix/
          if-no-files-found: error
  crazyflie-blockly-l:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Generate exact semantic mission from real Blockly 2020
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-blockly-l
          python3 tools/ci/run_crazyflie_blockly_l_mission.py \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/blockly-mission.log
          cat ci-artifacts/crazyflie-blockly-l/mission.json

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build existing shared STOP L-course executor with Blockly mission
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_l_course \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/build.log

      - name: Execute Blockly-derived L mission in Webots R2025a
        shell: bash
        run: |
          set -o pipefail
          rm -f ci-artifacts/crazyflie-l-course-result.txt
          set +e
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 90s xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/crazyflie_l_course.wbt' \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/webots.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-artifacts/crazyflie-blockly-l/exit-code.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::Blockly-derived L-course Webots run exited with $code"
            exit 1
          fi

      - name: Validate semantic equality and STOP reference behavior
        shell: bash
        run: |
          set -o pipefail
          RESULT=ci-artifacts/crazyflie-l-course-result.txt
          LOG=ci-artifacts/crazyflie-blockly-l/webots.log
          test -s "$RESULT"
          cat "$RESULT" | tee ci-artifacts/crazyflie-blockly-l/result.txt
          grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=success gates=2' "$RESULT"
          ! grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=failure' "$RESULT"
          ! grep -Fq 'ERROR:' "$LOG"
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path

          mission = json.loads(Path('ci-artifacts/crazyflie-blockly-l/mission.json').read_text())
          expected = [
              ('TAKEOFF', 1.0),
              ('FORWARD', 1.0),
              ('TURN', math.pi / 2.0),
              ('FORWARD', 1.0),
              ('LAND', 0.0),
          ]
          assert len(mission) == len(expected)
          for got, (kind, value) in zip(mission, expected):
              assert got['type'] == kind, (got, kind)
              assert math.isclose(float(got['value']), value, rel_tol=0.0, abs_tol=1e-12), (got, value)

          line = Path('ci-artifacts/crazyflie-l-course-result.txt').read_text().strip()
          pairs = dict(re.findall(r'([A-Za-z0-9_]+)=([^\s]+)', line))
          assert pairs.get('status') == 'success'
          assert pairs.get('gates') == '2'
          g1 = float(pairs['g1_time'])
          g2 = float(pairs['g2_time'])
          endpoint = float(pairs['endpoint_error_xy'])
          yaw = float(pairs['yaw_error_deg'])
          total = float(pairs['total_s'])
          # R2025a's 32 ms timestep makes a ±20 ms time oracle artificially tighter
          # than one simulation step. Geometry/order/STOP remain the strong oracle.
          assert abs(g1 - 12.287) <= 0.10, g1
          assert abs(g2 - 21.315) <= 0.10, g2
          assert endpoint <= 0.02, endpoint
          assert yaw <= 2.0, yaw
          assert abs(total - 26.144) <= 0.10, total
          print('PASS: real Blockly semantic L mission reached G1, G2 and landing through shared STOP executor.')
          PY

      - name: Publish Blockly L result
        if: always()
        shell: bash
        run: |
          echo '## Blockly → semantic mission → shared STOP executor' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-artifacts/crazyflie-blockly-l/mission.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ci-artifacts/crazyflie-blockly-l/mission.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ci-artifacts/crazyflie-l-course-result.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat ci-artifacts/crazyflie-l-course-result.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-blockly-l-r2025a
          path: |
            ci-artifacts/crazyflie-blockly-l/
            ci-artifacts/crazyflie-l-course-result.txt
          if-no-files-found: error
  timed-challenge-ux:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate challenge UX sources
        run: |
          node --check plugins/robot_windows/blockly/main.js
          python3 -m py_compile tools/ci/prepare_crazyflie_challenge_ux.py
          python3 -m py_compile tools/ci/runtime_wwi_event_server.py
          python3 -m py_compile tools/ci/instrument_runtime_done_ack.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          detour = Path('controllers/Blockly_Programs/CrazyflieDetourOffset.xml').read_text()
          reference = Path('controllers/Blockly_Programs/CrazyflieL.xml').read_text()
          assert detour != reference, 'detour fixture must differ from reference L'
          assert '<field name="DISTANCE">1.1</field>' in detour, 'detour must contain representable 1.1 m second leg'

          html = Path('plugins/robot_windows/blockly/blockly.html').read_text()
          assert 'Assemble les blocs nécessaires de la rubrique <em>Crazyflie</em>.' in html
          assert 'Assemble les 4 blocs' not in html

          world = Path('worlds/crazyflie_runtime_obstacle.wbt').read_text()
          controller = Path('controllers/crazyflie_l_course/crazyflie_l_course.c').read_text()
          match = re.search(r'#define GATE_HALF_WIDTH_M\s+([0-9.]+)', controller)
          assert match, 'GATE_HALF_WIDTH_M missing from controller'
          gate_half_width = float(match.group(1))
          post_thickness = 0.035
          post_center = gate_half_width + post_thickness / 2.0
          assert f'translation 0.9 -{post_center:.4f} 1.0' in world
          assert f'translation 0.9 {post_center:.4f} 1.0' in world
          assert f'translation {1.0 - post_center:.4f} 0.9 1.0' in world
          assert f'translation {1.0 + post_center:.4f} 0.9 1.0' in world
          assert 'geometry Box { size 0.025 0.67 0.035 }' in world
          assert 'geometry Box { size 0.67 0.025 0.035 }' in world
          assert 'LANDING_TARGET' not in world, 'visual landing target must not imply a success criterion that does not exist'
          PY

      - name: Prepare same-session challenge harness
        run: |
          python3 tools/ci/prepare_crazyflie_challenge_ux.py
          python3 tools/ci/instrument_runtime_done_ack.py

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged STOP runtime and physical evaluator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-challenge-ux
          for controller in crazyflie_l_course crazyflie_collision_observer; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-challenge-ux/build-${controller}.log"
          done
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-challenge-ux/controller-before.sha256

      - name: Run three student attempts in one Robot Window session
        shell: bash
        run: |
          set -o pipefail
          rm -f ci-artifacts/crazyflie-challenge-ux/events.jsonl
          rm -f ci-artifacts/crazyflie-challenge-ux/complete.sentinel
          rm -f ci-artifacts/crazyflie-done-ack-trace.txt
          rm -f ci-artifacts/crazyflie-obstacle-contact.txt
          rm -f ci-artifacts/crazyflie-l-course-result.txt
          rm -f ci-artifacts/crazyflie-runtime-mission-result.txt
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_wwi_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_wwi_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 /workspace/tools/ci/runtime_wwi_event_server.py \
                --output /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl \
                --completion-sentinel /workspace/ci-artifacts/crazyflie-challenge-ux/complete.sentinel &
              event_server_pid=$!
              xvfb-run -a webots --stdout --stderr --batch --mode=realtime /workspace/worlds/crazyflie_runtime_obstacle.wbt > /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log 2>&1 &
              webots_pid=$!
              cleanup() {
                kill $webots_pid 2>/dev/null || true
                kill $event_server_pid 2>/dev/null || true
                wait $webots_pid 2>/dev/null || true
                wait $event_server_pid 2>/dev/null || true
              }
              trap cleanup EXIT
              complete=0
              for i in $(seq 1 1500); do
                if test -s /workspace/ci-artifacts/crazyflie-challenge-ux/complete.sentinel; then
                  complete=1
                  break
                fi
                if grep -Fq "\"event\":\"ERROR\"" /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl 2>/dev/null; then
                  cat /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl
                  exit 1
                fi
                if ! kill -0 $webots_pid 2>/dev/null; then
                  cat /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log
                  exit 1
                fi
                sleep 0.1
              done
              if test -s /workspace/ci-artifacts/crazyflie-challenge-ux/complete.sentinel; then
                complete=1
              fi
              if [ "$complete" -ne 1 ]; then
                echo "Challenge UX harness did not complete in time"
                cat /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl 2>/dev/null || true
                cat /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log
                exit 1
              fi
            '

      - name: Prove causal states timer results and same-session resubmission
        shell: bash
        run: |
          set -o pipefail
          EVENTS=ci-artifacts/crazyflie-challenge-ux/events.jsonl
          LOG=ci-artifacts/crazyflie-challenge-ux/webots.log
          test -s "$EVENTS"
          test -s "$LOG"
          test -s ci-artifacts/crazyflie-challenge-ux/complete.sentinel
          ! grep -Fq 'ERROR:' "$LOG"
          ! grep -Fq 'DONE_ACK_TIMEOUT' "$LOG"
          test "$(grep -Fc 'WEBEEBLOCKS_MISSION_V1 VALIDATED' "$LOG")" -eq 3
          test "$(grep -Fc 'WEBEEBLOCKS_MISSION_V1 DONE_ACK_RECEIVED' "$LOG")" -eq 3
          grep -Fq 'WEBEEBLOCKS_OBSTACLE_RESULT status=COLLISION' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT COLLISION' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT GATE_MISSED' "$LOG"
          python3 - <<'PY'
          import json
          from pathlib import Path

          events = [json.loads(line) for line in Path('ci-artifacts/crazyflie-challenge-ux/events.jsonl').read_text().splitlines() if line.strip()]
          assert any(e['event'] == 'INVALID_REJECTED_NO_TIMER' for e in events), events
          assert not any(e['event'] == 'ERROR' for e in events), events
          for attempt, expected in [
              ('DIRECT', 'COLLISION'),
              ('DETOUR', 'RÉUSSI'),
              ('GATE_MISS', 'PASSAGE MANQUÉ'),
          ]:
              terminal = [e for e in events if e['event'] == attempt + '_TERMINAL']
              assert terminal, (attempt, events)
              terminal_detail = json.loads(terminal[-1]['detail'])
              panel = terminal_detail['panel']
              assert panel['state'] == 'TERMINÉ', terminal_detail
              assert panel['result'] == expected, terminal_detail
              assert panel['time'].endswith(' s') and panel['time'] != '—', terminal_detail
              assert terminal_detail['runtimeStateAtTerminal'] == 'RECOVERING', terminal_detail
              assert terminal_detail['runtimeStateAfterFreeze'] in ('RECOVERING', 'WAITING'), terminal_detail
          initial = [e for e in events if e['event'] == 'INITIAL'][-1]
          assert json.loads(initial['detail'])['state'] == 'PRÊT'
          final_ready = [e for e in events if e['event'] == 'FINAL_RUNTIME_READY']
          assert final_ready, events
          assert json.loads(final_ready[-1]['detail'])['runtimeState'] == 'WAITING', final_ready[-1]
          assert any(e['event'] == 'CHALLENGE_TEST_COMPLETE' for e in events), events

          challenge = [json.loads(e['detail']) for e in events if e['event'] == 'CHALLENGE']
          starts = [e for e in challenge if e.get('state') == 'RUNNING' and e.get('elapsed') == 0]
          assert len(starts) == 3, starts
          terminals = [e for e in challenge if e.get('state') == 'FINISHED']
          assert [e.get('result') for e in terminals] == ['COLLISION', 'RÉUSSI', 'PASSAGE MANQUÉ'], terminals
          assert all(float(e['elapsed']) > 0 for e in terminals), terminals
          print('PASS: one Robot Window session completed COLLISION -> edit/resubmit -> SUCCESS -> edit/resubmit -> GATE_MISSED with Webots-derived frozen times.')
          PY
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-challenge-ux/controller-after.sha256
          cmp ci-artifacts/crazyflie-challenge-ux/controller-before.sha256 \
              ci-artifacts/crazyflie-challenge-ux/controller-after.sha256

      - name: Upload challenge UX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-challenge-ux-r2025a
          path: |
            ci-artifacts/crazyflie-challenge-ux/
            ci-artifacts/crazyflie-done-ack-trace.txt
            ci-artifacts/crazyflie-obstacle-contact.txt
            ci-artifacts/crazyflie-l-course-result.txt
            ci-artifacts/crazyflie-runtime-mission-result.txt
          if-no-files-found: warn
  first-collision-obstacle:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build flight controllers and collision observer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-first-obstacle
          for controller in crazyflie_square_position crazyflie_l_course crazyflie_collision_observer; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-first-obstacle/build-${controller}.log"
          done

      - name: Run direct collision witness and STOP L detour
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/run_crazyflie_first_obstacle.py

      - name: Publish obstacle summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-artifacts/crazyflie-first-obstacle/summary.md ]; then
            cat ci-artifacts/crazyflie-first-obstacle/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload obstacle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-first-collision-obstacle-r2025a
          path: |
            ci-artifacts/crazyflie-first-obstacle/
            ci-artifacts/crazyflie-obstacle-contact.txt
            ci-artifacts/crazyflie-l-course-result.txt
          if-no-files-found: warn
  crazyflie-l-course:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build L-course controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-l-course
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_l_course \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-l-course/build.log

      - name: Run measured L course
        shell: bash
        run: |
          set -o pipefail
          rm -f ci-artifacts/crazyflie-l-course-result.txt
          set +e
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 90s xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/crazyflie_l_course.wbt' \
            2>&1 | tee ci-artifacts/crazyflie-l-course/webots.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-artifacts/crazyflie-l-course/exit-code.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::L-course Webots run exited with $code"
            exit 1
          fi

      - name: Validate ordered virtual gates and landing
        shell: bash
        run: |
          set -o pipefail
          RESULT=ci-artifacts/crazyflie-l-course-result.txt
          LOG=ci-artifacts/crazyflie-l-course/webots.log
          test -s "$RESULT"
          cat "$RESULT" | tee ci-artifacts/crazyflie-l-course/result.txt
          grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=success gates=2' "$RESULT"
          ! grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=failure' "$RESULT"
          ! grep -Fq 'ERROR:' "$LOG"
          ! grep -Fq 'WEBEEBLOCKS_CF_POSITION_FAILED' "$LOG"
          python3 - <<'PY'
          import re
          from pathlib import Path
          line = Path('ci-artifacts/crazyflie-l-course-result.txt').read_text().strip()
          pairs = dict(re.findall(r'([A-Za-z0-9_]+)=([^\s]+)', line))
          assert pairs.get('status') == 'success'
          assert pairs.get('gates') == '2'
          g1 = float(pairs['g1_time'])
          g2 = float(pairs['g2_time'])
          total = float(pairs['total_s'])
          assert 0 < g1 < g2 < total, (g1, g2, total)
          assert abs(float(pairs['g1_lateral'])) <= 0.30
          assert abs(float(pairs['g2_lateral'])) <= 0.30
          assert abs(float(pairs['g1_altitude_error'])) <= 0.20
          assert abs(float(pairs['g2_altitude_error'])) <= 0.20
          print('PASS: G1 then G2 crossed inside openings, then landed.')
          PY

      - name: Publish L-course result
        if: always()
        shell: bash
        run: |
          if [ -f ci-artifacts/crazyflie-l-course-result.txt ]; then
            echo '## Crazyflie L-course virtual-gate result' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat ci-artifacts/crazyflie-l-course-result.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-l-course-r2025a
          path: |
            ci-artifacts/crazyflie-l-course/
            ci-artifacts/crazyflie-l-course-result.txt
          if-no-files-found: error
  parametric-blockly-obstacle:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
