name: EXPERIMENT ONLY - R3 native capability admission/refusal

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-r3-native-authority.yml'
      - 'tools/ci/prepare_r3_authority_probe.py'
      - 'tools/ci/r3_independent_launcher.py'
      - 'controllers/crazyflie_runtime_v2/**'
      - 'plugins/robot_windows/blockly_v2/main.js'
      - 'plugins/robot_windows/blockly/webeeblocks/wwi_backend.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r3-authority-after-fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare official pinned Webots controller and Blockly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/r3-native
          git rev-parse HEAD > ci-artifacts/r3-native/head.txt
          git rev-parse HEAD^{tree} > ci-artifacts/r3-native/tree.txt
          ./tools/prepare_runtime_v2.sh
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 bash -lc 'make clean && make' \
            > ci-artifacts/r3-native/build.log 2>&1
          sha256sum controllers/crazyflie_runtime_v2/crazyflie_runtime_v2 > ci-artifacts/r3-native/controller.sha256
          python3 tools/ci/prepare_runtime_v2_reset.py
          python3 tools/ci/prepare_r3_authority_probe.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ci/webots_runtime_v2_browser.sh')
          s = p.read_text()
          anchor = '  --no-default-browser-check ' + '\\' + '\n'
          assert s.count(anchor) == 1
          Path('tools/ci/webots_r3_browser.sh').write_text(s.replace(anchor, anchor + '  --disable-popup-blocking ' + '\\' + '\n'))
          PY
          chmod +x tools/ci/webots_r3_browser.sh
      - name: Real Webots reconstruction and late second tab, no flight
        shell: bash
        run: |
          set -euo pipefail
          code=0
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -e WEBEEBLOCKS_CI_ARTIFACT_DIR=/workspace/ci-artifacts/r3-native \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb >/dev/null
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_r3_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 tools/ci/runtime_wwi_event_server.py --output /workspace/ci-artifacts/r3-native/events.jsonl &
              server=$!
              python3 tools/ci/r3_independent_launcher.py --events /workspace/ci-artifacts/r3-native/events.jsonl --evidence /workspace/ci-artifacts/r3-native/b2-launch.json > /workspace/ci-artifacts/r3-native/b2-launcher.log 2>&1 &
              launcher=$!
              trap "kill $server $launcher 2>/dev/null || true" EXIT
              sleep 0.5
              timeout -k 5s 420s xvfb-run -a webots --stdout --stderr --batch --mode=realtime /workspace/worlds/crazyflie_runtime_v2.wbt
            ' > ci-artifacts/r3-native/webots.log 2>&1 || code=$?
          echo "$code" > ci-artifacts/r3-native/exit.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            tail -80 ci-artifacts/r3-native/webots.log
            exit "$code"
          fi
      - name: Verify two correlated native LED effects on same controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ci-artifacts/r3-native')
          events = [json.loads(s) for s in (p/'events.jsonl').read_text().splitlines() if s.strip()]
          def only(name):
              arr = [x['detail'] for x in events if x.get('event') == name]
              assert len(arr) == 1, (name, arr)
              return arr[0]
          assert not [x for x in events if x.get('event') in ('ERROR','WINDOW_ERROR','UNHANDLED_REJECTION')], 'browser error'
          before, after = only('WORLD_RELOAD_REQUEST'), only('WORLD_RECOVERY_READY')
          assert before['workspace'] == after['workspace'] and before['ast'] == after['ast']
          opened, boot = only('R3_A_OPENED_B_AFTER_CLEAR'), only('R3_B_BOOT')
          b, a = only('R3_B_NATIVE_REFUSED'), only('R3_A_NATIVE_EFFECT')
          replay = only('R3_A_NATIVE_REPLAY_DENIED')
          assert replay['requestId'] == a['aRequestId'], 'native duplicate oracle used a different id'
          b2boot, b2 = only('R3_B2_BOOT'), only('R3_B2_NATIVE_REFUSED')
          assert b2boot['checkpointPresent'] is False
          assert b2boot['href'].endswith('#webeeblocks-r3-profile-b2')
          assert b2['nativeStatus'] == 'NONE' and b2['status'] != 'PRÊT' and b2['denial'] == 'AUTH_DENIED'
          assert b2['runDisabled'] is True and b2['socketOpen'] is True
          launch = json.loads((p/'b2-launch.json').read_text())
          assert b2boot['href'] == launch['url']
          assert opened['href'] == boot['href'] and boot['checkpointPresent'] is False
          assert b['nativeStatus'] == 'NONE' and b['status'] != 'PRÊT' and b['denial'] == 'AUTH_DENIED'
          assert b['runDisabled'] is True and b['socketOpen'] is True
          assert a['aStatus'] == 'PRÊT' and a['aRunDisabled'] is False and a['aSocketOpen'] is True
          assert a['bNonce'] == b['nonceB'] and a['bRequestId'] == b['requestId']
          assert a['aRequestId'] != b['requestId']
          log = (p/'webots.log').read_text(errors='replace')
          assert log.count('RECOVERY_CLEARED') == 1
          assert log.count(' RESET_OK ') >= 2 and log.count(' SCENE_OK ') >= 2
          blue = log.find('TRACE LIGHT color=blue rgb=0000ff')
          green = log.find('TRACE LIGHT color=green rgb=00ff00')
          red = log.find('TRACE LIGHT color=red rgb=ff0000')
          assert blue == -1 and green == -1 and red >= 0, 'native owner boundary bypassed or owner blocked'
          assert log.count('TRACE LIGHT color=red rgb=ff0000') == 1, 'replayed owner effect reached C twice'
          import re
          assert not re.search(r'(?:AUTH_CLAIM|AUTH_RECOVER) [0-9a-f]{64}', log), 'authority capability leaked to native logs'
          assert not re.search(r'REQUEST \\d+ AUTH [0-9a-f]{64}', log), 'effect capability leaked to native logs'
          assert log.count('WORLD_RELOAD_REQUESTED') == 1
          print('NATIVE_R3_AUTHORITY_REJECTED',json.dumps({'A':a,'B':b,'B2':b2,'effect_order':['B refused','B2 refused','A red']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-r3-auth-native-r2025a
          path: ci-artifacts/r3-native/
          if-no-files-found: warn
