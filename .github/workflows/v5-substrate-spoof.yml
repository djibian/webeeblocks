name: V5 Substrate Skipped Check Experiment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write

jobs:
  driver:
    name: Skipped-check driver
    runs-on: ubuntu-22.04
    steps:
      - name: Create skipped CI Gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg sha "$HEAD_SHA"             '{name:"CI Gate", head_sha:$sha, status:"completed", conclusion:"skipped", output:{title:"V5 skipped required check", summary:"Substrate experiment."}}')
          curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/check-runs"             -d "$payload"
