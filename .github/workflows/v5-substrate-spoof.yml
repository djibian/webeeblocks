name: V5 Substrate Check Update Experiment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write

jobs:
  driver:
    name: Check-update driver
    runs-on: ubuntu-22.04
    steps:
      - name: Create success then update same check to failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          create_api="https://api.github.com/repos/$REPO/check-runs"
          create_payload=$(jq -nc --arg sha "$HEAD_SHA"             '{name:"CI Gate", head_sha:$sha, status:"completed", conclusion:"success", output:{title:"V5 same-run initial success", summary:"Immediately updated to failure."}}')
          response=$(curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$create_api"             -d "$create_payload")
          check_id=$(printf '%s' "$response" | jq -r '.id')
          update_payload=$(jq -nc             '{status:"completed", conclusion:"failure", output:{title:"V5 same-run updated failure", summary:"Same check_run_id updated from success to failure."}}')
          curl --fail-with-body -sS -L             -X PATCH             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/check-runs/$check_id"             -d "$update_payload"
