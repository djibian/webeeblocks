name: V5 Substrate Cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    name: Cleanup V5 experiment refs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Delete experiment refs conditionally
        env:
          CAS_BASE_REF: refs/heads/experiment/v5-cas-base
          CAS_BASE_SHA: 26efae96ba75daa1bc38d8724a6dbc8a3e7f9c3a
          SELF_REF: refs/heads/experiment/v5-trust-substrate
          SELF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git push --force-with-lease="$CAS_BASE_REF:$CAS_BASE_SHA" origin ":$CAS_BASE_REF"
          git push --force-with-lease="$SELF_REF:$SELF_SHA" origin ":$SELF_REF"
