# PRIVATE A7 information-phase falsification. Never a student or CI Gate release.
name: Activity 7 late terminal sensor contrast (non-decision)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-a7-terminal-info-draft.yml'
      - 'controllers/a7_terminal_info_probe/**'
      - 'tools/ci/run_a7_terminal_info_probe.py'
      - 'tools/ci/test_a7_terminal_info_probe.py'
      - 'worlds/scenes/mini-grand-prix-l-v1.wbo'
permissions:
  contents: read
jobs:
  a7-terminal-info:
    name: A7 original R2025a five-ray near/far terminal experiment
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Falsify private scene construction and fail-closed sensor comparator
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_a7_terminal_info_probe
      - name: Compile native Crazyflie five-ray probe on pinned R2025a
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" \
            -w /workspace/controllers/a7_terminal_info_probe \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc 'set -e; make clean; make; test -s a7_terminal_info_probe'
      - name: Measure real five-ray information before and after the turn
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "$PWD:/workspace" -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc '
              set -e
              python3 tools/test_prepare_webots_apt.py
              python3 tools/prepare_webots_apt.py
              python3 tools/ci/run_a7_terminal_info_probe.py
            '
      - name: Preserve raw genuine sensor evidence including a falsification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-private-terminal-information-original-native
          path: ci-artifacts/a7-terminal-information/
          if-no-files-found: error
