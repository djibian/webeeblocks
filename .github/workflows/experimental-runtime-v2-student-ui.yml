name: Experimental Runtime v2 Zelos student UI

on:
  pull_request:
    branches: [webots-ci]
    types: [opened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  student-ui:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare pinned Blockly 13.2.1 product assets
        run: |
          ./tools/prepare_runtime_v2.sh
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"

      - name: Re-prove unchanged Runtime v2 semantic core
        run: python3 tools/ci/run_runtime_v2_core_harness.py

      - name: Validate UI experiment sources and canonical fixture
        run: |
          node --check plugins/robot_windows/blockly_v2/main.js
          node --check plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js
          node --check plugins/robot_windows/blockly/webeeblocks/activities.js
          python3 -m py_compile experiments/runtime-v2-student-ui/probe.py
          bash -n experiments/runtime-v2-student-ui/browser.sh experiments/runtime-v2-student-ui/run.sh
          grep -F "renderer: 'zelos'" plugins/robot_windows/blockly_v2/main.js
          grep -F '<script src="vendor/msg/fr.js"></script>' plugins/robot_windows/blockly_v2/blockly_v2.html
          ! grep -F 'vendor/msg/en.js' plugins/robot_windows/blockly_v2/blockly_v2.html
          test -s plugins/robot_windows/blockly_v2/vendor/msg/fr.js
          grep -F "message0:'distance %1'" plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js
          ! grep -F "distance %1 (m)" plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js
          test "$(grep -o "style:'flight_blocks'" plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js | wc -l)" -eq 6
          test "$(grep -o "style:'control_blocks'" plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js | wc -l)" -eq 1
          test "$(grep -o "style:'sensor_blocks'" plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js | wc -l)" -eq 1
          grep -F "webeeblocks_v2_wait:{category:'control'}" plugins/robot_windows/blockly/webeeblocks/activities.js
          grep -F "logic_compare:{category:'operator'}" plugins/robot_windows/blockly/webeeblocks/activities.js
          grep -F "logic_operation:{category:'operator'}" plugins/robot_windows/blockly/webeeblocks/activities.js
          grep -F "math_number:{category:'operator'}" plugins/robot_windows/blockly/webeeblocks/activities.js
          grep -F "flight_category: {colour: '#2563EB'}" plugins/robot_windows/blockly_v2/main.js
          grep -F "control_category: {colour: '#7C3AED'}" plugins/robot_windows/blockly_v2/main.js
          grep -F "sensor_category: {colour: '#0E7490'}" plugins/robot_windows/blockly_v2/main.js
          grep -F "operator_category: {colour: '#047857'}" plugins/robot_windows/blockly_v2/main.js
          grep -F "overrideBuiltinBlockStyle('logic_compare', 'operator_blocks')" plugins/robot_windows/blockly_v2/main.js
          grep -F "overrideBuiltinBlockStyle('logic_operation', 'operator_blocks')" plugins/robot_windows/blockly_v2/main.js
          grep -F "overrideBuiltinBlockStyle('math_number', 'operator_blocks')" plugins/robot_windows/blockly_v2/main.js
          grep -F "#zoomFit .toolbarText { display: none; }" plugins/robot_windows/blockly_v2/main.css
          ! grep -F "#workspaceToolbar .toolbarText { display: none; }" plugins/robot_windows/blockly_v2/main.css
          test "$(sha256sum controllers/Blockly_Programs/CrazyflieReactiveV2.xml | awk '{print $1}')" = "32b281611dc06f6d488fcad97055d309493a8050b455fd57c8a6079a9b9aaaa1"
          python3 -m json.tool experiments/runtime-v2-student-ui/expected_ast.json >/dev/null

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged Runtime v2 controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/runtime-v2-student-ui
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/runtime-v2-student-ui/build.log

      - name: Run styled Zelos UI in real Runtime v2 Robot Window
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash /workspace/experiments/runtime-v2-student-ui/run.sh

      - name: Validate visual shell, strict AST and keyboard path
        run: |
          test -s ci-artifacts/runtime-v2-student-ui/metrics.json
          test -s ci-artifacts/runtime-v2-student-ui/workspace-1366x768.png
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          def colour(value):
              value=(value or '').strip()
              if re.fullmatch(r'#[0-9a-fA-F]{6}', value):
                  return value.upper()
              match=re.fullmatch(r'rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*[0-9.]+)?\s*\)', value, re.I)
              if match:
                  return '#%02X%02X%02X' % tuple(int(part) for part in match.groups())
              return value.upper()
          r=json.loads(Path('ci-artifacts/runtime-v2-student-ui/metrics.json').read_text())
          expected=json.loads(Path('experiments/runtime-v2-student-ui/expected_ast.json').read_text())
          i=r['initial']; k=r['keyboard']; narrow=r['responsive800']; locale=r['locale']
          assert i['version']=='13.2.1', i
          assert i['rendererMatchesRegistry'] is True, i
          assert r['astMatchesExpected'] is True, r
          assert r['ast']==expected, {'expected':expected,'actual':r['ast']}
          assert locale['messages']['repeat'].lower().startswith('répéter'), locale
          assert locale['messages']['if'].lower()=='si' and locale['messages']['do'].lower()=='faire' and locale['messages']['else'].lower()=='sinon', locale
          assert locale['messages']['and'].lower()=='et' and locale['messages']['or'].lower()=='ou', locale
          assert locale['messages']['trueValue'].lower()=='vrai' and locale['messages']['falseValue'].lower()=='faux', locale
          assert locale['messages']['repeatTooltip'] and 'repeat' not in locale['messages']['repeatTooltip'].lower(), locale
          expected_directions=[{'label':'devant','value':'front'},{'label':'derrière','value':'back'},{'label':'à gauche','value':'left'},{'label':'à droite','value':'right'},{'label':'au-dessus','value':'up'}]
          assert locale['directionOptions']==expected_directions, locale['directionOptions']
          assert locale['sensorText']=='devant = 1 m · derrière = 2 m · à gauche = 3 m · à droite = 4 m · au-dessus = 5 m', locale['sensorText']
          visible=' '.join(locale['blocks'].values()).lower()
          assert not re.search(r'\\b(repeat|if|do|else|and|or|true|false)\\b',visible), locale['blocks']
          assert i['viewport']=={'width':1366,'height':768}, i['viewport']
          assert all(i['controls'].values()), i['controls']
          assert i['geometry']['toolbar'] and i['geometry']['toolbar']['width']>0, i['geometry']
          assert i['geometry']['trash'] and i['geometry']['trash']['width']>0, i['geometry']
          assert narrow['viewport']=={'width':800,'height':768}, narrow
          assert narrow['resetLabel']=='100 %' and narrow['resetLabelVisible'] is True, narrow
          expected_colours={'Vol':'#2563EB','Contrôle':'#7C3AED','Capteurs':'#0E7490','Opérateurs':'#047857'}
          toolbox={item['name']:colour(item.get('colour')) for item in i['toolboxItems']}
          assert list(toolbox)==list(expected_colours), toolbox
          assert toolbox==expected_colours, toolbox
          for group, expected_colour in (
              (('webeeblocks_v2_takeoff','webeeblocks_v2_move','webeeblocks_v2_land'),'#2563EB'),
              (('controls_repeat_ext','controls_if'),'#7C3AED'),
              (('webeeblocks_v2_range',),'#0E7490'),
              (('logic_compare','math_number'),'#047857')):
              colours=[colour(i['blockColours'][name][0]) for name in group]
              assert set(colours)=={expected_colour}, (group,colours)
          for name in ('toolboxEntry','arrowDown','arrowUp','categoryActivation','flyoutBlockReachable','workspaceFocusReturn'):
              assert k[name] is True, (name,k)
          print(json.dumps({'blockly':i['version'],'zelos':i['rendererMatchesRegistry'],'strictAst':r['astMatchesExpected'],'toolbox':toolbox,'responsive800':narrow,'geometry':i['geometry'],'keyboard':{x:k[x] for x in k if x!='steps'}},ensure_ascii=False,indent=2))
          PY

      - name: Upload student UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-runtime-v2-student-ui
          path: ci-artifacts/runtime-v2-student-ui/
          if-no-files-found: error
