name: Controller workflow contract

on:
  push:
    branches: [webots-ci]
    paths:
      - AGENTS.md
      - docs/CONTROLLER_NOTIFICATIONS.md
      - tools/ci/check_controller_workflow_contract.py
      - tools/ci/test_controller_workflow_contract.py
      - .github/workflows/**
  pull_request:
    branches: [webots-ci]
    types: [opened, synchronize, ready_for_review]
    paths:
      - AGENTS.md
      - docs/CONTROLLER_NOTIFICATIONS.md
      - tools/ci/check_controller_workflow_contract.py
      - tools/ci/test_controller_workflow_contract.py
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Checkout pull-request merge ref
        uses: actions/checkout@v4

      - name: Audit native synchronize and authority boundaries
        run: |
          python3 tools/ci/test_controller_workflow_contract.py
          python3 tools/ci/check_controller_workflow_contract.py
