# Non-decision evidence for the Activity 6 Draft's independent C oracle.
# Tests native Webots R2025a sensor/contact and diagnostic n=1/2/3
# motor flights using the authentic PID with test-only isolated scene adapter.
# Does NOT certify Blockly, an A6 product scene profile, same .wbb,
# pupil mission, hardware, V5 Ready approval or integration CI Gate.
name: Activity 6 Draft C mission witness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-progression-a6-draft.yml'
      - 'tools/ci/test_workflow_contract.py'
      - 'tools/ci/test_progression_count_h_*.py'
      - 'tools/ci/test_progression_count_h_public_profile.js'
      - 'plugins/robot_windows/blockly/webeeblocks/activities.js'
      - 'plugins/robot_windows/blockly_v2/project_ui.js'
      - 'plugins/robot_windows/blockly_v2/main.js'
      - 'plugins/robot_windows/blockly/webeeblocks/wwi_backend.js'
      - 'plugins/robot_windows/blockly_count_h/**'
      - 'tools/ci/test_runtime_v2_project_files.js'
      - 'plugins/robot_windows/blockly/webeeblocks/activity_profiles.js'
      - 'controllers/crazyflie_classroom_v2/classroom_scene.cpp'
      - 'controllers/crazyflie_classroom_v2/count_h_scene_gate.h'
      - 'worlds/crazyflie_classroom_count_h_start.wbt'
      - 'worlds/.crazyflie_classroom_count_h_start.wbproj'
      - 'tools/ci/test_progression_count_h_school_start.py'
      - 'tools/ci/test_progression_decision_h_variant_ui.js'
      - 'tools/ci/prepare_classroom_count_h_motor_flight.py'
      - 'tools/ci/run_classroom_count_h_motor_flight.py'
      - 'tools/ci/run_classroom_count_h_product_bootstrap.py'
      - 'tools/ci/run_classroom_count_h_variant_cdp.py'
      - 'tools/ci/a6_pupil_negative_cdp.py'
      - 'tools/ci/count_h_cdp_evidence.py'
      - 'tools/ci/webots_count_h_variant_cdp.sh'
      - 'tools/ci/build_a6_private_blockly_witness.js'
      - 'tools/ci/test_progression_count_h_sensor_only_mock.js'
      - 'tools/ci/run_classroom_count_h_rotation_mutant.py'
      - 'controllers/progression_count_h_school_pilot/**'
      - 'controllers/progression_count_h_flight_observer/**'
      - 'plugins/robot_windows/count_h_flight_probe/**'
      - 'controllers/progression_count_h_v1/**'
      - 'worlds/scenes/count-h-*.wbo'

permissions:
  contents: read

jobs:
  a6-core-draft-only:
    name: A6 compiled C oracle and real WBO source checks (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile and falsify isolated C oracle + three source scenes
        run: |
          set -euo pipefail
          cc --version | head -n 1
          python3 -m unittest -v \
            tools.ci.test_progression_count_h_scene \
            tools.ci.test_progression_count_h_oracle \
            tools.ci.test_progression_count_h_rear_range \
            tools.ci.test_progression_count_h_dual_motor_sensor \
            tools.ci.test_progression_count_h_motor_flight
      - name: Require Draft witness remains outside integration gates
        run: |
          python3 -m unittest -v tools.ci.test_workflow_contract.WorkflowTests.test_activity6_draft_witness_is_scoped_and_non_decision
      - name: Qualify the A6 isolated correct-origin launch and reject wrong initial pose
        run: |
          python3 -m unittest -v tools.ci.test_progression_count_h_school_start
      - name: Compile and falsify the REAL school-only C++ selector with Webots stubs
        run: |
          python3 -m unittest -v tools.ci.test_runtime_v2_classroom_selector
      - name: Confirm A6 profile stays hidden and variant selector preserves the learner project
        run: |
          set -euo pipefail
          # The real ProjectFiles loader below requires the installed Blockly 13.
          # Prepare its dependencies BEFORE both public-profile and private tests.
          bash ./tools/prepare_runtime_v2.sh
          # A previously duplicated shared project-files test parsed as invalid JS
          # while the Draft gate stayed green. Run its real test here, fail closed.
          node --check tools/ci/test_runtime_v2_project_files.js
          node tools/ci/test_runtime_v2_project_files.js
          node tools/ci/test_progression_count_h_public_profile.js
          node tools/ci/test_progression_decision_h_variant_ui.js
      - name: Qualify private A6 Blockly Save/Open witness with identical program in three mock worlds
        run: |
          set -euo pipefail
          node tools/ci/build_a6_private_blockly_witness.js ci-artifacts/progression-count-h-private-blockly/a6-private.wbb ci-artifacts/progression-count-h-private-blockly/a6-real-profile-ci-only.wbb
          # This is only a negative/positive MOCK test of the real sensor-only
          # JS module. True R2025a PID/motor, oracle and same-pupil-WBB
          # qualification remain separate, stronger requirements.
          node tools/ci/test_progression_count_h_sensor_only_mock.js
      - name: Preserve private A6 Blockly artifact for review (never pupil starter)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-private-blockly-roundtrip
          path: ci-artifacts/progression-count-h-private-blockly/
          if-no-files-found: warn
      - name: Build the REAL school selector with R2025a headers (not yet a pupil PASS)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_classroom_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s crazyflie_classroom_v2'
      - name: Compile real Webots R2025a rear-range negative observer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_count_h_range_probe \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make'
      - name: Observe the three physical rear rays at identical landing pose
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_count_h_rear_range.py'
      - name: Preserve negative native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-rear-range-negative-evidence
          path: ci-artifacts/progression-count-h-rear-range/
          if-no-files-found: warn
      # These test-only physical pilot variants use the actual product PID.
      # No pupil A6 profile, same Blockly .wbb or physical hardware is claimed.
      - name: Build authentic motor-runtime flight and independent native observer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; cd controllers/progression_count_h_school_pilot; make clean; make; cd /workspace/controllers/progression_count_h_flight_observer; make clean; make'
      - name: Falsify rotated A6 H in real Webots before native observer READY
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_count_h_rotation_mutant.py'
      - name: Fly 1, 2 and 3 H with real R2025a PID and independent native contact oracle
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              python3 /workspace/tools/test_prepare_webots_apt.py
              python3 /workspace/tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" \
                "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" \
                "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              for n in 1 2 3; do
                python3 /workspace/tools/ci/run_classroom_count_h_motor_flight.py --variant ${n}
              done
              # The SAME variant-blind CI motor/sensor program must genuinely
              # count H and land on the correct pad in ALL three native scenes.
              # This still does not claim a pupil .wbb or Save/Open proof.
              for n in 1 2 3; do
                python3 /workspace/tools/ci/run_classroom_count_h_motor_flight.py --mode sensor --variant ${n}
              done
              # The same saved private Blockly .wbb must be reopened and flown
              # on all three physical H-count worlds, never regenerated per variant.
              python3 /workspace/tools/ci/run_classroom_count_h_motor_flight.py --mode blockly --variant 1
              for n in 2 3; do
                python3 /workspace/tools/ci/run_classroom_count_h_motor_flight.py --mode blockly --variant ${n}
              done
            '
      - name: Prove exact same private WBB bytes across three native Blockly flights
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("ci-artifacts/progression-count-h-private-blockly/a6-private.wbb")
          sha = hashlib.sha256(path.read_bytes()).hexdigest()
          for n in (1, 2, 3):
              record = json.loads((Path("ci-artifacts/progression-count-h-motor") /
                                   f"blockly-n{n}" / "summary.json").read_text())
              assert record["pass"] is True, (n, "physical mission failed")
              assert record["private_blockly_webots_pass"] is True, (n, "Blockly not physically qualified")
              assert record["real_motorized_flight"] is True, (n, "native oracle not achieved")
              assert record["private_wbb_sha256"] == sha, (n, "WBB mutation")
              assert record["sensor_reported_count"] == n, (n, "wrong number of H")
              assert record["events"].count("A6_PRIVATE_WBB_REOPENED") == 1, (n, "not re-opened once")
          print("A6_PRIVATE_SAME_WBB_TRIPLE_NATIVE_PASS sha256=" + sha)
          PY
      - name: Preserve rotated-H native falsification even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-native-rotation-negative
          path: ci-artifacts/progression-count-h-rotation-mutant/
          if-no-files-found: warn
      - name: Preserve A6 motorized physical witness even when it fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-motor-flight-native-evidence
          path: ci-artifacts/progression-count-h-motor/
          if-no-files-found: warn
  # Parallel Draft-only native RESET witness, never the protected CI Gate.
  a6-replay-draft-only:
    name: A6 same-world n=${{ matrix.count }} negative RESET positive RESET positive (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        count: [1, 2, 3]
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify replay's exact native epochs and the original A6 negatives
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_progression_count_h_motor_flight
      - name: Build authentic A6 runtime and persistent native observer
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            -w /workspace cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; cd controllers/progression_count_h_school_pilot; make clean; make; cd /workspace/controllers/progression_count_h_flight_observer; make clean; make'
      - name: Real R2025a single-world negative/RESET/positive/RESET/positive
        timeout-minutes: 14
        run: |
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=true \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              python3 /workspace/tools/test_prepare_webots_apt.py
              python3 /workspace/tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 /workspace/tools/ci/run_classroom_count_h_motor_flight.py --mode replay --variant ${{ matrix.count }}
            '
      - name: Preserve replay evidence even when it fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-same-world-reset-native-evidence-n${{ matrix.count }}
          path: ci-artifacts/progression-count-h-motor/replay-n${{ matrix.count }}/
          if-no-files-found: warn

  # This starts the unmodified A6 classroom WBT and the REAL Blockly Robot
  # Window. Native observer readiness requires a real browser SCENE request;
  # the WBT intentionally contains neither H geometry nor observer at startup.
  # This is not a pupil mission or Windows-release acceptance.
  a6-school-window-draft-only:
    name: A6 real Webots school window and native scene bootstrap (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check dedicated blue-origin WBT contract before opening Webots
        run: |
          python3 -m unittest -v tools.ci.test_progression_count_h_school_start
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Blockly 13.2.1 for A6 school browser
        run: bash ./tools/prepare_runtime_v2.sh
      - name: Start unmodified A6 school WBT in Webots R2025a with actual Blockly Robot Window
        timeout-minutes: 7
        run: |
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              cd /workspace/controllers/crazyflie_classroom_v2
              make clean; make; test -s crazyflie_classroom_v2
              cd /workspace/controllers/progression_count_h_flight_observer
              make clean; make; test -s progression_count_h_flight_observer
              cd /workspace
              python3 tools/test_prepare_webots_apt.py
              python3 tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" \
                "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" \
                "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 tools/ci/run_classroom_count_h_product_bootstrap.py
            '
      - name: Preserve actual browser launch, Webots stdout and native scene admission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-real-product-bootstrap-r2025a
          path: ci-artifacts/progression-count-h-product-bootstrap/
          if-no-files-found: warn

  # Native Webots + actual browser clicks, deliberately independent of
  # existing private .wbb motor witnesses and the CI Gate decision context.
  a6-real-variant-cdp-draft-only:
    name: A6 real UI buttons 1-2-3-1 and native scene ACK (Draft, not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Blockly browser and validate CDP probe
        run: |
          set -euo pipefail
          bash ./tools/prepare_runtime_v2.sh
          python3 -m py_compile tools/ci/run_classroom_count_h_variant_cdp.py
          python3 -m py_compile tools/ci/a6_pupil_negative_cdp.py
          python3 -m unittest -v tools.ci.test_progression_count_h_cdp_evidence
      - name: R2025a actual Chrome clicks with independent native scene admissions
        timeout-minutes: 10
        run: |
          docker run --rm -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              cd /workspace/controllers/crazyflie_classroom_v2
              make clean; make; test -s crazyflie_classroom_v2
              cd /workspace/controllers/progression_count_h_flight_observer
              make clean; make; test -s progression_count_h_flight_observer
              cd /workspace
              python3 tools/test_prepare_webots_apt.py
              python3 tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates python3-websocket >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_count_h_variant_cdp.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" \
                "browser=/workspace/tools/ci/webots_count_h_variant_cdp.sh" \
                "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 tools/ci/run_classroom_count_h_variant_cdp.py
            '
      - name: Preserve original native and browser traces, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-real-variant-button-cdp
          path: ci-artifacts/progression-count-h-real-variant/
          if-no-files-found: warn
