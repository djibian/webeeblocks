# Non-decision evidence for the Activity 6 Draft's independent C oracle.
# Source world contracts and synthetic compiled native C behavior ONLY.
# Neither actual Webots R2025a sensor/flight physics nor pupil Blockly
# nor a V5 Ready/CI Gate approval is certified by this workflow.
name: Activity 6 Draft C mission witness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-progression-a6-draft.yml'
      - 'tools/ci/test_workflow_contract.py'
      - 'tools/ci/test_progression_count_h_*.py'
      - 'controllers/progression_count_h_v1/**'
      - 'worlds/scenes/count-h-*.wbo'

permissions:
  contents: read

jobs:
  a6-core-draft-only:
    name: A6 compiled C oracle and real WBO source checks (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile and falsify isolated C oracle + three source scenes
        run: |
          set -euo pipefail
          cc --version | head -n 1
          python3 -m unittest -v \
            tools.ci.test_progression_count_h_scene \
            tools.ci.test_progression_count_h_oracle \
            tools.ci.test_progression_count_h_rear_range
      - name: Require Draft witness remains outside integration gates
        run: |
          python3 -m unittest -v tools.ci.test_workflow_contract.WorkflowTests.test_activity6_draft_witness_is_scoped_and_non_decision
      - name: Compile real Webots R2025a rear-range negative observer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_count_h_range_probe \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make'
      - name: Observe the three physical rear rays at identical landing pose
        run: |
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_count_h_rear_range.py'
      - name: Preserve negative native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-draft-rear-range-negative-evidence
          path: ci-artifacts/progression-count-h-rear-range/
          if-no-files-found: warn
