name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select suites
    runs-on: ubuntu-22.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      webots: ${{ steps.scope.outputs.webots }}
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify selector and repository contracts
        run: |
          python3 tools/ci/test_select_ci.py
          python3 tools/ci/test_select_s3_build.py
          python3 tools/ci/test_ci_gate.py
          python3 tools/ci/test_workflow_contract.py
          python3 tools/ci/test_localize_webots_world.py
          python3 tools/ci/test_repository_hygiene.py
          python3 tools/ci/test_windows_release_contract.py
          python3 tools/ci/test_controller_contract.py
          python3 tools/ci/test_evidence_publication.py
          python3 tools/ci/test_historical_boost_support.py
      - name: Select required suites
        id: scope
        run: >-
          python3 tools/ci/select_ci.py
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.base_ref }}"
          --draft "${{ github.event.pull_request.draft || false }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Select bounded X3 observer diagnostic
        id: x3-scope
        shell: bash
        run: |
          set -euo pipefail
          run=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r path; do
              case "$path" in
                experiments/crazyflie-ukf-surface-range/X3_PRELPF_TIMING_OBSERVER.md|experiments/crazyflie-ukf-surface-range/apply_x3_prelpf_timing_observer.py|experiments/crazyflie-ukf-surface-range/run_x3_prelpf_build_oracle.sh|experiments/crazyflie-ukf-surface-range/test_x3_prelpf_timing_observer.py|experiments/crazyflie-ukf-surface-range/run_s3_build_oracle.sh|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3.py|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3_veto_discriminator.py|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3_timing_observer.py|.github/workflows/ci.yml)
                  run=true
                  break
                  ;;
              esac
            done < <(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "X3_PRELPF_BUILD=$run"
      - name: Checkout pinned Crazyflie firmware for X3 observer
        if: steps.x3-scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-firmware
          ref: 54f31e243a0b28b67efef5ba20dbb6d9890a5478
          path: .x3-crazyflie-firmware
          submodules: recursive
          fetch-depth: 1
      - name: Build isolated X3 observer diagnostic
        if: steps.x3-scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p ci-artifacts/x3-prelpf-observer
          set -o pipefail
          bash experiments/crazyflie-ukf-surface-range/run_x3_prelpf_build_oracle.sh .x3-crazyflie-firmware \
            2>&1 | tee ci-artifacts/x3-prelpf-observer/build-oracle.log
      - name: Record X3 observer diagnostic evidence
        if: ${{ always() && steps.x3-scope.outputs.run == 'true' }}
        shell: bash
        run: |
          mkdir -p ci-artifacts/x3-prelpf-observer
          git -C .x3-crazyflie-firmware rev-parse HEAD > ci-artifacts/x3-prelpf-observer/upstream-sha.txt
          git -C .x3-crazyflie-firmware diff -- src/modules/src/estimator/estimator_ukf.c > ci-artifacts/x3-prelpf-observer/estimator_ukf.patch || true
          git -C .x3-crazyflie-firmware diff -- src/hal/src/sensors_bmi088_bmp3xx.c > ci-artifacts/x3-prelpf-observer/sensors_bmi088_bmp3xx.patch || true
          if [ -f .x3-crazyflie-firmware/build/cf2.elf ]; then
            sha256sum .x3-crazyflie-firmware/build/cf2.elf > ci-artifacts/x3-prelpf-observer/cf2.elf.sha256
          fi
          if [ -f .x3-crazyflie-firmware/build/cf2.bin ]; then
            sha256sum .x3-crazyflie-firmware/build/cf2.bin > ci-artifacts/x3-prelpf-observer/cf2.bin.sha256
          fi
      - name: Upload X3 observer diagnostic evidence
        if: ${{ always() && steps.x3-scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: x3-prelpf-observer-build-evidence-2026-08
          path: ci-artifacts/x3-prelpf-observer/
          if-no-files-found: error

  runtime:
    name: Runtime suite
    needs: select
    if: ${{ needs.select.outputs.runtime == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ needs.select.outputs.full == 'true' }}

  webots:
    name: Webots suite
    needs: select
    if: ${{ needs.select.outputs.webots == 'true' }}
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'CI Gate (Draft)' || 'CI Gate' }}
    if: ${{ always() }}
    needs: [select, runtime, webots]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected suite results
        env:
          CI_SELECTION: >-
            {"runtime":"${{ needs.select.outputs.runtime }}","webots":"${{ needs.select.outputs.webots }}"}
          CI_NEEDS: >-
            {"select":{"result":"${{ needs.select.result }}"},"runtime":{"result":"${{ needs.runtime.result }}"},"webots":{"result":"${{ needs.webots.result }}"}}
        run: python3 tools/ci/check_ci_gate.py
