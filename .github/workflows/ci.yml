name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select suites
    runs-on: ubuntu-22.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      webots: ${{ steps.scope.outputs.webots }}
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify selector and repository contracts
        run: |
          python3 tools/ci/test_select_ci.py
          python3 tools/ci/test_select_s3_build.py
          python3 tools/ci/test_ci_gate.py
          python3 tools/ci/test_workflow_contract.py
          python3 tools/ci/test_localize_webots_world.py
          python3 tools/ci/test_repository_hygiene.py
          python3 tools/ci/test_windows_release_contract.py
          python3 tools/ci/test_controller_contract.py
          python3 tools/ci/test_evidence_publication.py
      - name: Select required suites
        id: scope
        run: >-
          python3 tools/ci/select_ci.py
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.base_ref }}"
          --draft "${{ github.event.pull_request.draft || false }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Select X3 pre-LPF firmware diagnostic
        id: x3-prelpf-scope
        env:
          X3_EVENT: ${{ github.event_name }}
          X3_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          X3_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/ci/select_s3_build.py
          --event "$X3_EVENT"
          --base "$X3_BASE_SHA"
          --head "${X3_HEAD_SHA:-$GITHUB_SHA}"
          --github-output "$GITHUB_OUTPUT"
      - name: Checkout pinned Crazyflie firmware for X3 pre-LPF diagnostic
        if: steps.x3-prelpf-scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-firmware
          ref: 54f31e243a0b28b67efef5ba20dbb6d9890a5478
          path: .ci-crazyflie-firmware-x3-prelpf
          submodules: recursive
          fetch-depth: 1
      - name: Build X3 pre-LPF snapshot diagnostic
        if: steps.x3-prelpf-scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p ci-artifacts/x3-prelpf-snapshot
          set -o pipefail
          bash experiments/crazyflie-ukf-surface-range/run_x3_prelpf_snapshot_build_oracle.sh \
            .ci-crazyflie-firmware-x3-prelpf \
            2>&1 | tee ci-artifacts/x3-prelpf-snapshot/build-oracle.log
          git -C .ci-crazyflie-firmware-x3-prelpf rev-parse HEAD \
            > ci-artifacts/x3-prelpf-snapshot/upstream-sha.txt
          git -C .ci-crazyflie-firmware-x3-prelpf diff -- \
            src/hal/src/sensors_bmi088_bmp3xx.c \
            > ci-artifacts/x3-prelpf-snapshot/sensors_bmi088_bmp3xx.patch
          sha256sum .ci-crazyflie-firmware-x3-prelpf/build/cf2.bin \
            > ci-artifacts/x3-prelpf-snapshot/cf2.bin.sha256
      - name: Upload X3 pre-LPF build evidence
        if: ${{ always() && steps.x3-prelpf-scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-x3-prelpf-snapshot-2026-08
          path: ci-artifacts/x3-prelpf-snapshot/
          if-no-files-found: error

  runtime:
    name: Runtime suite
    needs: select
    if: ${{ needs.select.outputs.runtime == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ needs.select.outputs.full == 'true' }}

  webots:
    name: Webots suite
    needs: select
    if: ${{ needs.select.outputs.webots == 'true' }}
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'CI Gate (Draft)' || 'CI Gate' }}
    if: ${{ always() }}
    needs: [select, runtime, webots]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected suite results
        env:
          CI_SELECTION: >-
            {"runtime":"${{ needs.select.outputs.runtime }}","webots":"${{ needs.select.outputs.webots }}"}
          CI_NEEDS: >-
            {"select":{"result":"${{ needs.select.result }}"},"runtime":{"result":"${{ needs.runtime.result }}"},"webots":{"result":"${{ needs.webots.result }}"}}
        run: python3 tools/ci/check_ci_gate.py
