name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select suites
    runs-on: ubuntu-22.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      webots: ${{ steps.scope.outputs.webots }}
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Discover exact physical-probe wheel closure
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/physical-probe-lock-discovery' }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/physical-probe-lock-discovery"
          wheels="$root/wheels"
          site="$root/site"
          source="$root/cflib-source"
          rm -rf "$root"
          mkdir -p "$wheels" "$site"

          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest "$wheels" \
            pyusb==1.2.1 \
            libusb-package==1.0.26.3 \
            importlib-resources==6.5.2 \
            numpy==2.2.6

          echo "WEBEEBLOCKS_PHYSICAL_LOCK_FILES_BEGIN"
          (
            cd "$wheels"
            sha256sum *
          )
          echo "WEBEEBLOCKS_PHYSICAL_LOCK_FILES_END"

          python3 -m pip install --disable-pip-version-check --no-index \
            --find-links "$wheels" --no-deps --target "$site" \
            pyusb==1.2.1 libusb-package==1.0.26.3 importlib-resources==6.5.2 numpy==2.2.6

          git init -q "$source"
          git -C "$source" remote add origin https://github.com/bitcraze/crazyflie-lib-python.git
          git -C "$source" fetch --depth=1 origin 45fdb784c9d13074c42835f3b5ac1d12133bf873
          git -C "$source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "45fdb784c9d13074c42835f3b5ac1d12133bf873"
          test "$(git -C "$source" rev-parse HEAD^{tree})" = "a78cf78d2b4aba51a0fa2b03de0260664b523401"

          PYTHONPATH="$source:$site" PYTHONNOUSERSITE=1 python3 -S - <<'PY'
          import pathlib
          import cflib
          import cflib.crtp
          import importlib_resources
          import libusb_package
          import numpy
          import usb
          from cflib.crazyflie import Crazyflie
          from cflib.crazyflie.syncCrazyflie import SyncCrazyflie

          root = pathlib.Path(cflib.__file__).resolve()
          print(f"WEBEEBLOCKS_PHYSICAL_LOCK_CFLIB={root}")
          print(f"WEBEEBLOCKS_PHYSICAL_LOCK_NUMPY={numpy.__version__}")
          print("WEBEEBLOCKS_PHYSICAL_LOCK_IMPORT_PASS")
          PY

      - name: Verify selector and repository contracts
        run: |
          python3 tools/ci/test_select_ci.py
          python3 tools/ci/test_select_s3_build.py
          python3 tools/ci/test_ci_gate.py
          python3 tools/ci/test_workflow_contract.py
          python3 tools/ci/test_localize_webots_world.py
          python3 tools/ci/test_repository_hygiene.py
          python3 tools/ci/test_windows_release_contract.py
          python3 tools/ci/test_controller_contract.py
      - name: Select required suites
        id: scope
        run: >-
          python3 tools/ci/select_ci.py
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.base_ref }}"
          --draft "${{ github.event.pull_request.draft || false }}"
          --github-output "$GITHUB_OUTPUT"

  runtime:
    name: Runtime suite
    needs: select
    if: ${{ needs.select.outputs.runtime == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ needs.select.outputs.full == 'true' }}

  webots:
    name: Webots suite
    needs: select
    if: ${{ needs.select.outputs.webots == 'true' }}
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'CI Gate (Draft)' || 'CI Gate' }}
    if: ${{ always() }}
    needs: [select, runtime, webots]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected suite results
        env:
          CI_SELECTION: >-
            {"runtime":"${{ needs.select.outputs.runtime }}","webots":"${{ needs.select.outputs.webots }}"}
          CI_NEEDS: >-
            {"select":{"result":"${{ needs.select.result }}"},"runtime":{"result":"${{ needs.runtime.result }}"},"webots":{"result":"${{ needs.webots.result }}"}}
        run: python3 tools/ci/check_ci_gate.py
