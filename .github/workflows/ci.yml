name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select suites
    runs-on: ubuntu-22.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      webots: ${{ steps.scope.outputs.webots }}
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # BEGIN PHYSICAL_QUALIFICATION_RUNTIME_SUPPORT
      - name: Select physical qualification runtime support
        id: qualification-runtime-scope
        run: >-
          python3 tools/ci/select_qualification_runtime_support.py
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Restore exact physical qualification runtime support
        if: steps.qualification-runtime-scope.outputs.run == 'true'
        id: qualification-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Checkout pinned cflib for qualification runtime maintenance
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-lib-python
          ref: 45fdb784c9d13074c42835f3b5ac1d12133bf873
          path: .qualification-cflib-source
          fetch-depth: 1
          persist-credentials: false

      - name: Prime exact physical qualification runtime support for maintenance runs
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          support=.ci-support/qualification-runtime
          wheelhouse="$support/wheels"
          source="$support/cflib-source"
          rm -rf "$support"
          mkdir -p "$wheelhouse" "$source"

          test "$(git -C .qualification-cflib-source rev-parse HEAD)" = "45fdb784c9d13074c42835f3b5ac1d12133bf873"
          test "$(git -C .qualification-cflib-source rev-parse 'HEAD^{tree}')" = "a78cf78d2b4aba51a0fa2b03de0260664b523401"
          test "$(git -C .qualification-cflib-source rev-parse 'HEAD:cflib')" = "750e850390753de14019f0e1f55d4fbc44317699"
          cp -a .qualification-cflib-source/. "$source/"

          expected="$RUNNER_TEMP/qualification-runtime-wheel-sha256.txt"
          : > "$expected"
          while IFS='|' read -r spec filename digest; do
            case "$spec" in ''|'#'*) continue ;; esac
            python3 -m pip download --disable-pip-version-check \
              --no-deps --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --implementation cp --python-version 310 --abi cp310 \
              --dest "$wheelhouse" "$spec"
            test -f "$wheelhouse/$filename"
            printf '%s  %s\n' "$digest" "$wheelhouse/$filename" >> "$expected"
          done < tools/physical/qualification_runtime_lock.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          sha256sum -c "$expected"
          python3 tools/physical/verify_qualification_runtime.py "$source" "$wheelhouse"

      - name: Verify exact physical qualification runtime support
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_physical_qualification_runtime_lock.py
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          python3 tools/physical/verify_qualification_runtime.py "$source" "$wheelhouse"

      - name: Save exact physical qualification runtime support for maintenance runs
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Restore exact prepared qualification package inputs
        if: steps.qualification-runtime-scope.outputs.run == 'true'
        id: qualification-package-input-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - uses: actions/setup-node@v4
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Prime exact prepared qualification package inputs for maintenance runs
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          WEBOTS_IMAGE='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          docker pull "$WEBOTS_IMAGE"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            "$WEBOTS_IMAGE" \
            bash -lc 'make clean && make'
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Save exact prepared qualification package inputs for maintenance runs
        if: steps.qualification-runtime-scope.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.qualification-package-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - name: Fail closed unless exact qualification package inputs are restored
        if: steps.qualification-runtime-scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d .ci-support/qualification-runtime/cflib-source/.git
          test "$(find .ci-support/qualification-runtime/wheels -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Build and verify exact offline physical qualification artifact
        id: qualification-package
        if: steps.qualification-runtime-scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          python3 tools/physical/package_physical_qualification.py \
            --source-sha "$target_sha" \
            --cflib-root "$source" \
            --wheelhouse "$wheelhouse" \
            --output-root ci-artifacts/physical-qualification
          bundle=ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification
          python3 tools/physical/verify_physical_qualification_package.py "$bundle"
          python3 tools/ci/test_physical_qualification_package.py "$bundle"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Upload exact offline physical qualification artifact
        if: steps.qualification-runtime-scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-Physical-Qualification-${{ steps.qualification-package.outputs.target_sha }}
          path: ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification/
          include-hidden-files: true
          if-no-files-found: error
      # END PHYSICAL_QUALIFICATION_RUNTIME_SUPPORT

      - name: Restore exact historical Boost cache for maintenance runs
        if: github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)
        id: historical-boost-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/libboost1.74-dev_1.74.0-14ubuntu3_amd64.deb
          key: historical-boost-jammy-amd64-1.74.0-14ubuntu3-4d9c90e43f0d25db6280d1ee326771cbb76462f73b9430f06bac1de8d05b7a78

      - name: Acquire exact historical Boost archive for maintenance runs
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.historical-boost-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/fetch_historical_boost_archive.py

      - name: Verify exact historical Boost archive for maintenance runs
        if: github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/ci')
          from prepare_historical_boost import PACKAGE_NAME, verify_archive
          archive = Path('.ci-support') / PACKAGE_NAME
          verify_archive(archive)
          print(f'PASS exact historical Boost maintenance archive: {archive}')
          PY

      - name: Save exact historical Boost cache for maintenance runs
        if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository)) && steps.historical-boost-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-support/libboost1.74-dev_1.74.0-14ubuntu3_amd64.deb
          key: historical-boost-jammy-amd64-1.74.0-14ubuntu3-4d9c90e43f0d25db6280d1ee326771cbb76462f73b9430f06bac1de8d05b7a78

      - name: Verify selector and repository contracts
        run: |
          python3 tools/ci/test_select_ci.py
          python3 tools/ci/test_select_s3_build.py
          python3 tools/ci/test_ci_gate.py
          python3 -m unittest discover -s tools/ci -p test_ci_optimization_report.py
          python3 tools/ci/test_workflow_contract.py
          python3 tools/ci/test_localize_webots_world.py
          python3 tools/ci/test_pinned_webots_sparse.py
          python3 tools/ci/test_repository_hygiene.py
          python3 tools/ci/test_windows_release_contract.py
          python3 tools/ci/test_controller_contract.py
          # Metrics on real saved Blockly workspaces must have exact-HEAD CI evidence.
          python3 tools/ci/test_measure_wbb.py
          python3 tools/ci/test_evidence_publication.py
          python3 tools/ci/test_historical_boost_support.py
          python3 tools/ci/test_physical_qualification_runtime_lock.py
          python3 tools/ci/test_physical_qualification_package.py ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification
      # Non-decision prototype evidence while the simulation design is mutable.
      # Ready candidates prove this through the required Runtime suite instead.
      - name: Falsify simulation-only Grand Prix Draft prototype
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('tools/ci/run_grand_prix_u_prototype.py') != ''
        shell: bash
        run: |
          python3 tools/ci/test_grand_prix_u_timeout_probe.py
          node tools/ci/test_grand_prix_u_timeout_probe.js
          python3 tools/ci/test_grand_prix_simulation_time.py
          python3 tools/ci/test_grand_prix_u_oracle.py
          node tools/ci/test_grand_prix_u_profile.js
          node tools/ci/test_grand_prix_u_witness.js
          python3 tools/ci/run_grand_prix_u_prototype.py

      - name: Upload Grand Prix Draft observations
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('tools/ci/run_grand_prix_u_prototype.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: grand-prix-u-draft-r2025a
          path: ci-artifacts/grand-prix-u/
          if-no-files-found: error

      - name: Select required suites
        id: scope
        run: >-
          python3 tools/ci/select_ci.py
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --base-ref "${{ github.base_ref }}"
          --draft "${{ github.event.pull_request.draft || false }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Select bounded X3 observer diagnostic
        id: x3-scope
        shell: bash
        run: |
          set -euo pipefail
          run=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r path; do
              case "$path" in
                experiments/crazyflie-ukf-surface-range/X3_PRELPF_TIMING_OBSERVER.md|experiments/crazyflie-ukf-surface-range/apply_x3_prelpf_timing_observer.py|experiments/crazyflie-ukf-surface-range/run_x3_prelpf_build_oracle.sh|experiments/crazyflie-ukf-surface-range/test_x3_prelpf_timing_observer.py|experiments/crazyflie-ukf-surface-range/run_s3_build_oracle.sh|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3.py|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3_veto_discriminator.py|experiments/crazyflie-ukf-surface-range/apply_surface_offset_s3_timing_observer.py|tools/physical/prepare_x3_independent_capture.py|tools/physical/x3_no_commander_link.py|tools/ci/test_x3_characterization_package.py|tools/ci/test_x3_reset_firmware_semantics.py|.github/workflows/ci.yml)
                  run=true
                  break
                  ;;
              esac
            done < <(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "X3_PRELPF_BUILD=$run"
      - name: Checkout pinned Crazyflie firmware for X3 observer
        if: steps.x3-scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-firmware
          ref: 54f31e243a0b28b67efef5ba20dbb6d9890a5478
          path: .x3-crazyflie-firmware
          submodules: recursive
          fetch-depth: 1
      - name: Verify pinned X3 reset firmware semantics
        if: steps.x3-scope.outputs.run == 'true'
        run: python3 tools/ci/test_x3_reset_firmware_semantics.py .x3-crazyflie-firmware
      - name: Build isolated X3 observer diagnostic
        if: steps.x3-scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p ci-artifacts/x3-prelpf-observer
          set -o pipefail
          bash experiments/crazyflie-ukf-surface-range/run_x3_prelpf_build_oracle.sh .x3-crazyflie-firmware \
            2>&1 | tee ci-artifacts/x3-prelpf-observer/build-oracle.log
      - name: Record X3 observer diagnostic evidence
        if: ${{ always() && steps.x3-scope.outputs.run == 'true' }}
        shell: bash
        run: |
          mkdir -p ci-artifacts/x3-prelpf-observer
          git -C .x3-crazyflie-firmware rev-parse HEAD > ci-artifacts/x3-prelpf-observer/upstream-sha.txt
          git -C .x3-crazyflie-firmware diff -- src/modules/src/estimator/estimator_ukf.c > ci-artifacts/x3-prelpf-observer/estimator_ukf.patch || true
          git -C .x3-crazyflie-firmware diff -- src/hal/src/sensors_bmi088_bmp3xx.c > ci-artifacts/x3-prelpf-observer/sensors_bmi088_bmp3xx.patch || true
          if [ -f .x3-crazyflie-firmware/build/cf2.elf ]; then
            sha256sum .x3-crazyflie-firmware/build/cf2.elf > ci-artifacts/x3-prelpf-observer/cf2.elf.sha256
          fi
          if [ -f .x3-crazyflie-firmware/build/cf2.bin ]; then
            sha256sum .x3-crazyflie-firmware/build/cf2.bin > ci-artifacts/x3-prelpf-observer/cf2.bin.sha256
          fi
      - name: Upload X3 observer diagnostic evidence
        if: ${{ always() && steps.x3-scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: x3-prelpf-observer-build-evidence-2026-08
          path: ci-artifacts/x3-prelpf-observer/
          if-no-files-found: error

  runtime:
    name: Runtime suite
    needs: select
    if: ${{ needs.select.outputs.runtime == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ needs.select.outputs.full == 'true' }}

  webots:
    name: Webots suite
    needs: select
    if: ${{ needs.select.outputs.webots == 'true' }}
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  native-engine-windows:
    name: Experimental Grand Prix engine Windows build
    # Run this build experiment only on same-repository Draft assembly branches.
    # It supplies an artifact and has no role in the required CI decision.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/914-native-engine-')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.filemode
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          path: .native-webots
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make wget unzip mingw-w64-x86_64-openal
      - name: Install build dependencies and compile engine
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export WEBOTS_GIT="/c/Program Files/Git/bin/git.exe"
          test "$MSYSTEM" = MINGW64
          command -v bash make
          /usr/bin/bash tools/grand_prix/native_engine/build.sh .native-webots build
          mkdir -p ci-artifacts/native-engine
          pacman -Q > ci-artifacts/native-engine/toolchain.txt
          cygpath -w /mingw64 > ci-artifacts/native-engine/mingw-root.txt
      - name: Install verified R2025a stock distribution for staging
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'webots-R2025a_setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe' -OutFile $installer
          $expected = '9e326a54c104fc5fc88121e26014a409d1e35f0bbf30e23f3a712e7f842b08e7'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Official Webots installer digest mismatch.'
          }
          $reference = Join-Path $env:RUNNER_TEMP 'Webots-R2025a-stock'
          $result = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $reference + '"')
          )
          if ($result.ExitCode -ne 0) { throw "Stock installer exit $($result.ExitCode)" }
          "WEBOTS_NATIVE_REFERENCE=$reference" >> $env:GITHUB_ENV
      - name: Stage and verify runnable engine and Controller DLL
        shell: pwsh
        run: |
          $artifact = 'ci-artifacts/native-engine'
          $mingw = (Get-Content "$artifact/mingw-root.txt" -Raw).Trim()
          $python = (Get-Command python).Source
          $env:PATH = (Join-Path $mingw 'bin') + ';' + $env:PATH
          $target = "$artifact/Webots-R2025a-experimental"
          & $python tools/grand_prix/native_engine/stage_windows.py $env:WEBOTS_NATIVE_REFERENCE .native-webots $mingw $target
          if ($LASTEXITCODE -ne 0) { throw 'Native staging failed.' }
          $launcher = Join-Path $target 'msys64/mingw64/bin/webots.exe'
          $env:WEBOTS_HOME = (Resolve-Path $target).Path
          $version = (& $launcher --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'R2025a') { throw "Native engine startup failed: $version" }
          Copy-Item "$artifact/toolchain.txt" "$target/native-engine-toolchain.txt"
          Get-Content "$target/native-engine.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Webots-R2025a-experimental-Windows-${{ github.event.pull_request.head.sha }}
          path: ci-artifacts/native-engine/Webots-R2025a-experimental/
          if-no-files-found: error
          retention-days: 14
      - name: Compile the existing variable Grand Prix pilot
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v python3 || pacman -S --noconfirm --needed mingw-w64-x86_64-python
          export WEBOTS_HOME=$(cygpath -m "$PWD/.native-webots")
          make -C controllers/grand_prix_route_flight release WEBOTS_HOME="$WEBOTS_HOME"
          test -s controllers/grand_prix_route_flight/grand_prix_route_flight.exe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble variable Grand Prix with Blockly and embedded Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/prepare_runtime_v2.ps1
          $artifact = 'ci-artifacts/native-engine'
          $support = Join-Path $env:RUNNER_TEMP 'route-python-support'
          ./tools/grand_prix/build_windows_evaluator.ps1 -OutputDirectory $support
          $runtime = Join-Path $support 'WebeeBlocks-Grand-Prix-Evaluator-Windows-R2025a/runtime/python'
          $project = "$artifact/WebeeBlocks-Grand-Prix-Windows"
          $engine = "$artifact/Webots-R2025a-experimental"
          python tools/grand_prix/native_engine/package_route_windows.py --engine $engine --python-runtime $runtime --output $project
          if ($LASTEXITCODE -ne 0) { throw 'Variable Grand Prix assembly failed.' }
          $env:WEBOTS_HOME = (Resolve-Path $engine).Path
          $engineBin = Join-Path $env:WEBOTS_HOME 'msys64/mingw64/bin'
          $env:PATH = "$engineBin;$env:SystemRoot/System32;$env:SystemRoot"
          & "$project/runtime/python/webeeblocks-gp-python.exe" -I -B "$project/controllers/grand_prix_route_evaluator/grand_prix_route_evaluator.py" --verify-imports
          if ($LASTEXITCODE -ne 0) { throw 'Embedded evaluator import probe failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-Grand-Prix-Windows-${{ github.event.pull_request.head.sha }}
          path: ci-artifacts/native-engine/WebeeBlocks-Grand-Prix-Windows/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      # The Windows hosted runner has no WGL/OpenGL context by default.
      # --no-rendering still initializes Webots' renderer. Reuse the already
      # pinned Mesa solution from ci-runtime.yml ONLY on the disposable runner,
      # after uploading the exact, unchanged Windows project and engine.
      - name: Restore pinned Mesa for diagnostic-only Windows OpenGL
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesa3d-24.2.1-release-mingw.7z
          key: ci-mesa3d-r2025a-24.2.1-f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214

      - name: Install pinned Mesa on ephemeral native diagnostic runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-24.2.1-release-mingw.7z'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            try {
              Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.2.1/mesa3d-24.2.1-release-mingw.7z' -OutFile $archive -ErrorAction Stop
            }
            catch {
              Write-Warning 'Pinned Mesa release download failed; trying its fixed REST asset.'
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/assets/189177330' `
                -Headers @{ Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' } `
                -OutFile $archive -ErrorAction Stop
            }
          }
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214') {
            throw 'Pinned diagnostic Mesa archive SHA-256 mismatch.'
          }
          $mesa = Join-Path $env:RUNNER_TEMP 'Webots CI Mesa'
          & 7z.exe x $archive "-o$mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed.' }
          Push-Location $mesa
          try {
            & .\systemwidedeploy.cmd 1
            if ($LASTEXITCODE -ne 0) { throw 'Mesa deployment failed.' }
          }
          finally { Pop-Location }
          Write-Host "Diagnostic Mesa verified SHA-256: $digest"

      # Non-authoritative experimental diagnostic. This job is deliberately
      # excluded from the required CI Gate and cannot authorize native flight.
      - name: Diagnose 30 simulated seconds of native evaluator (no rendering)
        continue-on-error: true
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '3.3'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = 'ci-artifacts/native-engine/Webots-R2025a-experimental'
          $project = 'ci-artifacts/native-engine/WebeeBlocks-Grand-Prix-Windows'
          $output = 'ci-artifacts/native-engine/phase-probe-30s'
          python tools/grand_prix/native_engine/ci_30s_phase_windows.py --engine $engine --project $project --destination $output --assembly "${{ github.event.pull_request.head.sha }}" --max-wall-seconds 360
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Native diagnostic UNPROVEN: retain raw logs; no benchmark PASS.'
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-native-phase-diagnostic-${{ github.event.pull_request.head.sha }}
          path: ci-artifacts/native-engine/phase-probe-30s/
          if-no-files-found: warn
          retention-days: 14


  gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'CI Gate (Draft)' || 'CI Gate' }}
    if: ${{ always() }}
    needs: [select, runtime, webots]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected suite results
        env:
          CI_SELECTION: >-
            {"runtime":"${{ needs.select.outputs.runtime }}","webots":"${{ needs.select.outputs.webots }}"}
          CI_NEEDS: >-
            {"select":{"result":"${{ needs.select.result }}"},"runtime":{"result":"${{ needs.runtime.result }}"},"webots":{"result":"${{ needs.webots.result }}"}}
        run: python3 tools/ci/check_ci_gate.py
