name: "NON-GATE 665 rr host feasibility"
on:
  push:
    branches: [experiment/665-rr-first-fault-20261101]
    paths:
      - .github/workflows/experiment-665-rr.yml
permissions:
  contents: read
jobs:
  host-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Obtain hash-pinned upstream rr without a Webots build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rr665"
          curl --fail --location --max-time 60 https://github.com/rr-debugger/rr/releases/download/5.10.0/rr-5.10.0-Linux-x86_64.tar.gz -o "$RUNNER_TEMP/rr665/rr.tar.gz"
          printf '%s  %s\n' 55d9175d88139f775aca36981c55c2f3bca227434217750fc3ee2619501e269b "$RUNNER_TEMP/rr665/rr.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rr665/rr.tar.gz" -C "$RUNNER_TEMP/rr665"
          rrbin=$(find "$RUNNER_TEMP/rr665" -type f -path '*/bin/rr' -print)
          test -n "$rrbin"
          dirname "$rrbin" >> "$GITHUB_PATH"
      - name: One actual kernel and rr recording/replay gate
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/qt665-rr/preflight.py --out ci-artifacts/qt665-rr-host
          git rev-parse HEAD > ci-artifacts/qt665-rr-host/head.txt
          sha256sum ci-artifacts/qt665-rr-host/host.json > ci-artifacts/qt665-rr-host/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt665-rr-host-feasibility
          path: ci-artifacts/qt665-rr-host
          if-no-files-found: error
          retention-days: 14
