# Evidence only, on isolated experimental branch, not a CI Gate integration check.
name: GP218 pupil sensor ambiguity regression
on:
  push:
    branches:
      - experiment/gp218-ambiguity-regression-20261026
permissions:
  contents: read
jobs:
  sensor:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm immutable 218 candidate and isolated changes
        shell: bash
        run: |
          set -euo pipefail
          base=18751e6804832d1310cf51a585e9774b87a551ee
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse HEAD:experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb)" = 3bca44a6b758b93ca913f867c17458cf17d18f96
          git diff --name-only "$base" HEAD > changed.txt
          if grep -Ev '^(experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js|\.github/workflows/gp218-ambiguity-proof-20261026.yml)$' changed.txt; then
            echo "Unexpected shared-source mutation" >&2
            exit 1
          fi
      - name: Execute real serialized pupil Blockly observation decisions
        run: node experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js
