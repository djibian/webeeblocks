name: Human checkpoint

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character Git SHA to test.
        required: true
        type: string
      test_profile:
        description: Stable test profile identifier.
        required: true
        type: string
      purpose:
        description: checkpoint or release
        required: true
        type: choice
        options: [checkpoint, release]
      instructions:
        description: Actionable human test procedure.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  validate:
    name: Validate checkpoint request
    if: >-
      github.repository == 'djibian/webeeblocks' &&
      github.actor == 'djibian' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, 'CHECKPOINT_REQUEST ')))
    runs-on: ubuntu-22.04
    outputs:
      target_sha: ${{ steps.request.outputs.target_sha }}
      test_profile: ${{ steps.request.outputs.test_profile }}
      purpose: ${{ steps.request.outputs.purpose }}
      instructions_b64: ${{ steps.request.outputs.instructions_b64 }}
      source_url: ${{ steps.request.outputs.source_url }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
    steps:
      - name: Parse and validate request
        id: request
        env:
          DISPATCH_SHA: ${{ inputs.target_sha }}
          DISPATCH_PROFILE: ${{ inputs.test_profile }}
          DISPATCH_PURPOSE: ${{ inputs.purpose }}
          DISPATCH_INSTRUCTIONS: ${{ inputs.instructions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          REPO = 'djibian/webeeblocks'
          PATTERN = re.compile(r'CHECKPOINT_REQUEST ([0-9a-f]{40}) ([a-z0-9][a-z0-9._-]{0,63}) (checkpoint|release)')
          PROFILES = {
              'windows-low-end': 'WebeeBlocks-Windows-R2025a',
              's3-props-off': 'experimental-s3-surface-offset-2026-08',
              'physical-capabilities-readonly': 'WebeeBlocks-Physical-Capability-Probe',
              'physical-capabilities-representative': 'WebeeBlocks-Physical-Qualification',
              'x3-independent-props-off': 'WebeeBlocks-X3-Characterization',
          }
          PURPOSES = {
              'windows-low-end': {'checkpoint', 'release'},
              's3-props-off': {'checkpoint'},
              'physical-capabilities-readonly': {'checkpoint'},
              'physical-capabilities-representative': {'checkpoint'},
              'x3-independent-props-off': {'checkpoint'},
          }

          def get_commit(sha):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/commits/{sha}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'User-Agent': 'webeeblocks-human-checkpoint',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          event_name = os.environ['GITHUB_EVENT_NAME']
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
              event = json.load(stream)

          if event_name == 'workflow_dispatch':
              sha = (os.environ.get('DISPATCH_SHA') or '').strip()
              profile = (os.environ.get('DISPATCH_PROFILE') or '').strip()
              purpose = (os.environ.get('DISPATCH_PURPOSE') or '').strip()
              instructions = (os.environ.get('DISPATCH_INSTRUCTIONS') or '').strip()
              source_url = f"https://github.com/{REPO}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          else:
              comment = event.get('comment') or {}
              issue = event.get('issue') or {}
              body = (comment.get('body') or '').replace('\r\n', '\n')
              first, _, remainder = body.partition('\n')
              match = PATTERN.fullmatch(first.strip())
              if not match:
                  raise SystemExit('Malformed checkpoint request')
              sha, profile, purpose = match.groups()
              instructions = remainder.strip()
              source_url = comment.get('html_url') or issue.get('html_url') or ''

          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Exact lowercase 40-character SHA required')
          if not re.fullmatch(r'[a-z0-9][a-z0-9._-]{0,63}', profile):
              raise SystemExit('Invalid test profile')
          if profile not in PROFILES:
              raise SystemExit('Unknown test profile; add deterministic preparation before enabling it')
          if purpose not in {'checkpoint', 'release'} or not instructions:
              raise SystemExit('Invalid checkpoint request')
          if purpose not in PURPOSES[profile]:
              raise SystemExit(f'Purpose {purpose} is not allowed for profile {profile}')
          if get_commit(sha).get('sha') != sha:
              raise SystemExit('Target does not resolve exactly')

          encoded = base64.b64encode(instructions.encode()).decode()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target_sha={sha}\n')
              output.write(f'test_profile={profile}\n')
              output.write(f'purpose={purpose}\n')
              output.write(f'instructions_b64={encoded}\n')
              output.write(f'source_url={source_url}\n')
              output.write(f'artifact_name={PROFILES[profile]}\n')
          PY

  historical-boost-support:
    name: Prime exact historical Boost support
    needs: validate
    if: needs.validate.outputs.target_sha != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore exact historical Boost cache
        id: historical-boost-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/libboost1.74-dev_1.74.0-14ubuntu3_amd64.deb
          key: historical-boost-jammy-amd64-1.74.0-14ubuntu3-4d9c90e43f0d25db6280d1ee326771cbb76462f73b9430f06bac1de8d05b7a78

      - name: Acquire exact historical Boost archive
        if: steps.historical-boost-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/fetch_historical_boost_archive.py

      - name: Verify exact historical Boost archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/ci')
          from prepare_historical_boost import PACKAGE_NAME, verify_archive
          archive = Path('.ci-support') / PACKAGE_NAME
          verify_archive(archive)
          print(f'PASS exact human-checkpoint historical Boost archive: {archive}')
          PY

      - name: Save exact historical Boost cache
        if: steps.historical-boost-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-support/libboost1.74-dev_1.74.0-14ubuntu3_amd64.deb
          key: historical-boost-jammy-amd64-1.74.0-14ubuntu3-4d9c90e43f0d25db6280d1ee326771cbb76462f73b9430f06bac1de8d05b7a78

      - uses: actions/checkout@v4
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Restore exact representative package inputs for checkpoint
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        id: representative-package-support-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - uses: actions/setup-node@v4
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative' && steps.representative-package-support-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Build exact representative package inputs for checkpoint
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative' && steps.representative-package-support-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          WEBOTS_IMAGE='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          docker pull "$WEBOTS_IMAGE"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            "$WEBOTS_IMAGE" \
            bash -lc 'make clean && make'
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Save exact representative package inputs for checkpoint
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative' && steps.representative-package-support-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - name: Verify exact representative package inputs for checkpoint
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_generated_inputs.py

  runtime:
    name: Full Runtime evidence
    needs: validate
    if: needs.validate.outputs.target_sha != ''
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: ${{ needs.validate.outputs.target_sha }}
      full: true

  webots:
    name: Full Webots evidence
    needs: [validate, historical-boost-support]
    if: needs.validate.outputs.target_sha != ''
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: ${{ needs.validate.outputs.target_sha }}

  physical:
    name: Prepare deterministic physical checkpoint artifact
    needs: [validate, historical-boost-support]
    if: >-
      needs.validate.outputs.test_profile == 'physical-capabilities-readonly' ||
      needs.validate.outputs.test_profile == 'physical-capabilities-representative' ||
      needs.validate.outputs.test_profile == 'x3-independent-props-off'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Checkout exact cflib source
        if: needs.validate.outputs.test_profile == 'physical-capabilities-readonly'
        uses: actions/checkout@v4
        with:
          repository: bitcraze/crazyflie-lib-python
          ref: 45fdb784c9d13074c42835f3b5ac1d12133bf873
          path: .ci-cflib
          fetch-depth: 1

      - name: Validate probe and package exact offline support closure
        if: needs.validate.outputs.test_profile == 'physical-capabilities-readonly'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_physical_capability_probe.py
          node tools/ci/test_physical_capability_contract.js

          test "$(git -C .ci-cflib rev-parse HEAD)" = "45fdb784c9d13074c42835f3b5ac1d12133bf873"
          test "$(git -C .ci-cflib rev-parse 'HEAD^{tree}')" = "a78cf78d2b4aba51a0fa2b03de0260664b523401"
          test "$(git -C .ci-cflib rev-parse 'HEAD:cflib')" = "750e850390753de14019f0e1f55d4fbc44317699"

          bundle=ci-artifacts/physical-capability-probe
          wheelhouse="$bundle/wheels"
          mkdir -p "$wheelhouse" "$bundle/cflib-source"
          cp tools/physical/probe_reference_hardware.py "$bundle/"
          cp tools/physical/run_reference_probe.sh "$bundle/"
          cp tools/physical/reference_probe_lock.txt "$bundle/"
          cp -R .ci-cflib/cflib "$bundle/cflib-source/"
          chmod +x "$bundle/run_reference_probe.sh"

          expected="$RUNNER_TEMP/reference-probe-wheel-sha256.txt"
          : > "$expected"
          while IFS='|' read -r spec filename digest; do
            case "$spec" in ''|'#'*) continue ;; esac
            python3 -m pip download --disable-pip-version-check \
              --no-deps --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --implementation cp --python-version 310 --abi cp310 \
              --dest "$wheelhouse" "$spec"
            test -f "$wheelhouse/$filename"
            printf '%s  %s\n' "$digest" "$wheelhouse/$filename" >> "$expected"
          done < tools/physical/reference_probe_lock.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4
          sha256sum -c "$expected"

          printf '%s\n' \
            'cflib_source=https://github.com/bitcraze/crazyflie-lib-python.git' \
            'cflib_commit=45fdb784c9d13074c42835f3b5ac1d12133bf873' \
            'cflib_tree=a78cf78d2b4aba51a0fa2b03de0260664b523401' \
            'cflib_subtree=750e850390753de14019f0e1f55d4fbc44317699' \
            'runtime=ubuntu-22.04-python-3.10-x86_64' \
            'dependency_resolution=exact-wheel-filename-and-sha256-no-deps' \
            > "$bundle/PROVENANCE.txt"

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

          ambient="$RUNNER_TEMP/hostile-ambient"
          for module in cflib usb libusb_package importlib_resources numpy scipy packaging yaml; do
            mkdir -p "$ambient/$module"
            printf '%s\n' 'raise RuntimeError("ambient package must never be imported")' > "$ambient/$module/__init__.py"
          done
          PYTHONPATH="$ambient" "$bundle/run_reference_probe.sh" --verify-environment

      - name: Upload deterministic physical capability probe
        if: needs.validate.outputs.test_profile == 'physical-capabilities-readonly'
        uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-Physical-Capability-Probe
          path: ci-artifacts/physical-capability-probe/
          if-no-files-found: error

      - name: Restore exact X3 characterization runtime support
        if: needs.validate.outputs.test_profile == 'x3-independent-props-off'
        id: x3-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Fail closed unless exact X3 characterization support is restored
        if: needs.validate.outputs.test_profile == 'x3-independent-props-off'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.x3-runtime-cache.outputs.cache-hit }}" = "true"
          source=.ci-support/qualification-runtime/cflib-source
          support_wheels=.ci-support/qualification-runtime/wheels
          firmware=.ci-support/qualification-runtime/x3-firmware/cf2.bin
          test -d "$source/.git"
          test "$(find "$support_wheels" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          python3 tools/physical/verify_qualification_runtime.py "$source" "$support_wheels"
          python3 tools/physical/prepare_x3_firmware_fixture.py
          test -f "$firmware"

          wheelhouse="$RUNNER_TEMP/x3-reference-wheels"
          expected="$RUNNER_TEMP/x3-reference-wheel-sha256.txt"
          mkdir -p "$wheelhouse"
          : > "$expected"
          while IFS='|' read -r spec filename digest; do
            case "$spec" in ''|'#'*) continue ;; esac
            test -f "$support_wheels/$filename"
            cp "$support_wheels/$filename" "$wheelhouse/$filename"
            printf '%s  %s\n' "$digest" "$wheelhouse/$filename" >> "$expected"
          done < tools/physical/reference_probe_lock.txt
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4
          sha256sum -c "$expected"

      - name: Build and verify exact X3 characterization artifact
        if: needs.validate.outputs.test_profile == 'x3-independent-props-off'
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${{ needs.validate.outputs.target_sha }}"
          test "$(git rev-parse HEAD)" = "$target_sha"
          source=.ci-support/qualification-runtime/cflib-source
          firmware=.ci-support/qualification-runtime/x3-firmware/cf2.bin
          wheelhouse="$RUNNER_TEMP/x3-reference-wheels"
          python3 tools/ci/test_x3_characterization_package.py
          python3 tools/physical/package_x3_characterization.py \
            --source-sha "$target_sha" \
            --firmware-bin "$firmware" \
            --cflib-root "$source" \
            --wheelhouse "$wheelhouse" \
            --output-root ci-artifacts/x3-characterization
          bundle=ci-artifacts/x3-characterization/WebeeBlocks-X3-Characterization
          python3 -B tools/physical/verify_x3_characterization_bundle.py "$bundle"
          PYTHONDONTWRITEBYTECODE=1 bash "$bundle/run_x3_independent_capture.sh" --verify-environment
          python3 -B tools/physical/verify_x3_characterization_bundle.py "$bundle"

      - name: Upload exact X3 characterization artifact
        if: needs.validate.outputs.test_profile == 'x3-independent-props-off'
        uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-X3-Characterization
          path: ci-artifacts/x3-characterization/WebeeBlocks-X3-Characterization/
          include-hidden-files: true
          if-no-files-found: error

      - name: Restore exact physical qualification runtime support
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        id: representative-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-support/qualification-runtime
          key: qualification-runtime-ubuntu22-cp310-cflib-45fdb784c9d13074c42835f3b5ac1d12133bf873-${{ hashFiles('tools/physical/qualification_runtime_lock.txt') }}

      - name: Restore exact prepared physical qualification inputs
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        id: representative-package-input-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/robot_windows/blockly_v2/vendor
            controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          key: qualification-package-inputs-r2025a-f0023e30daf38b17-${{ hashFiles('tools/prepare_runtime_v2.sh', 'plugins/robot_windows/blockly_v2/package.json', 'plugins/robot_windows/blockly_v2/package-lock.json', 'plugins/robot_windows/blockly_v2/prepare_blockly_vendor.js', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.svg', 'plugins/robot_windows/blockly/google-blockly-31ee4ea/media/sprites.png') }}-${{ hashFiles('controllers/crazyflie_runtime_v2/Makefile', 'controllers/crazyflie_runtime_v2/*.c', 'controllers/crazyflie_runtime_v2/*.cpp', 'controllers/crazyflie_runtime_v2/*.h', 'controllers/crazyflie_square/pid_controller.c', 'controllers/crazyflie_square/pid_controller.h') }}-${{ hashFiles('tools/physical/qualification_generated_lock.json') }}

      - name: Fail closed unless exact physical qualification support is restored
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.representative-runtime-cache.outputs.cache-hit }}" = "true"
          test "${{ steps.representative-package-input-cache.outputs.cache-hit }}" = "true"
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          test -d "$source/.git"
          test "$(find "$wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 7
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -x controllers/crazyflie_runtime_v2/crazyflie_runtime_v2
          python3 tools/physical/verify_qualification_runtime.py "$source" "$wheelhouse"
          python3 tools/physical/verify_qualification_generated_inputs.py

      - name: Build and verify exact representative physical qualification artifact
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${{ needs.validate.outputs.target_sha }}"
          test "$(git rev-parse HEAD)" = "$target_sha"
          source=.ci-support/qualification-runtime/cflib-source
          wheelhouse=.ci-support/qualification-runtime/wheels
          python3 tools/physical/package_physical_qualification.py \
            --source-sha "$target_sha" \
            --cflib-root "$source" \
            --wheelhouse "$wheelhouse" \
            --output-root ci-artifacts/physical-qualification
          bundle=ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification
          python3 tools/physical/verify_physical_qualification_package.py "$bundle"
          python3 tools/ci/test_physical_qualification_package.py "$bundle"

      - name: Upload exact representative physical qualification artifact
        if: needs.validate.outputs.test_profile == 'physical-capabilities-representative'
        uses: actions/upload-artifact@v4
        with:
          name: WebeeBlocks-Physical-Qualification
          path: ci-artifacts/physical-qualification/WebeeBlocks-Physical-Qualification/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish one TEST_REQUIRED
    needs: [validate, runtime, webots, physical]
    if: >-
      always() &&
      needs.validate.outputs.target_sha != '' &&
      needs.runtime.result == 'success' &&
      needs.webots.result == 'success' &&
      ((needs.validate.outputs.test_profile != 'physical-capabilities-readonly' &&
        needs.validate.outputs.test_profile != 'physical-capabilities-representative' &&
        needs.validate.outputs.test_profile != 'x3-independent-props-off') ||
       needs.physical.result == 'success')
    runs-on: ubuntu-22.04
    concurrency:
      group: webeeblocks-human-test-open
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
      TEST_PROFILE: ${{ needs.validate.outputs.test_profile }}
      PURPOSE: ${{ needs.validate.outputs.purpose }}
      INSTRUCTIONS_B64: ${{ needs.validate.outputs.instructions_b64 }}
      SOURCE_URL: ${{ needs.validate.outputs.source_url }}
      REQUIRED_ARTIFACT: ${{ needs.validate.outputs.artifact_name }}
    steps:
      - name: Deduplicate, persist and notify
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          REPO = 'djibian/webeeblocks'
          API = f'https://api.github.com/repos/{REPO}'
          sha = os.environ['TARGET_SHA']
          profile = os.environ['TEST_PROFILE']
          purpose = os.environ['PURPOSE']
          required_artifact = os.environ['REQUIRED_ARTIFACT']
          instructions = base64.b64decode(os.environ['INSTRUCTIONS_B64']).decode()
          fingerprint = hashlib.sha256(f'{sha}|{profile}|{purpose}'.encode()).hexdigest()
          marker = f'WEBEEBLOCKS_TEST_FINGERPRINT={fingerprint}'
          open_marker = 'WEBEEBLOCKS_HUMAN_TEST_OPEN=1'

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'User-Agent': 'webeeblocks-human-checkpoint',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def issues(state):
              found = []
              for page in range(1, 21):
                  batch = api('GET', f'{API}/issues?state={state}&per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise RuntimeError('Unexpected issues API response')
                  found.extend(batch)
                  if len(batch) < 100:
                      return found
              raise RuntimeError('Issue pagination exceeded safety bound')

          def canonical_test_issue(item):
              body = item.get('body') or ''
              user = item.get('user') or {}
              return (
                  'pull_request' not in item
                  and (item.get('title') or '').startswith('[TEST_REQUIRED] ')
                  and user.get('login') == 'github-actions[bot]'
                  and open_marker in body
                  and re.search(r'(?m)^WEBEEBLOCKS_TEST_FINGERPRINT=[0-9a-f]{64}$', body)
              )

          history = [item for item in issues('all') if canonical_test_issue(item)]
          if any(marker in (item.get('body') or '') for item in history):
              print('Fingerprint already recorded; no-op.')
              raise SystemExit(0)
          if any(item.get('state') == 'open' for item in history):
              print('Human test already open; silent no-op.')
              raise SystemExit(0)

          artifacts = api(
              'GET',
              f"{API}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100",
          ).get('artifacts', [])
          matching = [a for a in artifacts if a.get('name') == required_artifact]
          if len(matching) != 1:
              raise SystemExit(f'Profile {profile} requires exactly one {required_artifact} artifact')
          artifact = matching[0]
          if artifact.get('expired'):
              raise SystemExit('Required artifact is already expired')
          digest = artifact.get('digest') or ''
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Required artifact is missing a valid sha256 digest')
          artifact_text = (
              f"Artifact: {artifact['name']}\n"
              f"Artifact id: {artifact['id']}\n"
              f"Artifact digest: {digest}"
          )

          run_url = f"https://github.com/{REPO}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = '\n'.join([
              open_marker,
              marker,
              '',
              'TEST_REQUIRED',
              '',
              f'Target SHA: {sha}',
              f'Profile: {profile}',
              f'Purpose: {purpose}',
              f'Evidence run: {run_url}',
              artifact_text,
              f"Request source: {os.environ.get('SOURCE_URL', '')}",
              '',
              'Procedure:',
              instructions,
              '',
              'Resolution:',
              'Comment PASS, FAIL with the observed phenomenon, or NOT_NEEDED only if this',
              'result can no longer affect any relevant future decision. A Controller records',
              'the result durably and closes this issue.',
              '',
          ])
          created = api(
              'POST',
              f'{API}/issues',
              {'title': f'[TEST_REQUIRED] {profile} {sha[:12]}', 'body': body},
          )
          issue_url = created['html_url']

          topic = os.environ.get('NTFY_TOPIC', '').strip()
          if not topic:
              print(f'NTFY_TOPIC missing; authoritative request: {issue_url}')
              raise SystemExit(0)
          if any(character in topic for character in '/?#') or len(topic) > 256:
              raise SystemExit('Invalid NTFY_TOPIC')

          payload = {
              'topic': topic,
              'title': 'WebeeBlocks — TEST À EFFECTUER',
              'message': (
                  f'TEST_REQUIRED\nSHA: {sha}\nProfil: {profile}\nBut: {purpose}\n\n'
                  f'{instructions[:1200]}'
              ),
              'priority': 5,
              'tags': ['test_tube', 'robot'],
              'click': issue_url,
              'actions': [
                  {'action': 'view', 'label': 'Ouvrir le test', 'url': issue_url, 'clear': True}
              ],
          }
          req = urllib.request.Request(
              'https://ntfy.sh/',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status >= 300:
                  raise RuntimeError(f'ntfy returned HTTP {response.status}')
              print(f'TEST_REQUIRED published: {issue_url}')
          PY
