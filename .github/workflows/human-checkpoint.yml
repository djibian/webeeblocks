name: Human checkpoint

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character Git SHA to test.
        required: true
        type: string
      test_profile:
        description: Stable test profile identifier.
        required: true
        type: string
      purpose:
        description: checkpoint or release
        required: true
        type: choice
        options: [checkpoint, release]
      instructions:
        description: Actionable human test procedure.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate checkpoint request
    if: >-
      github.repository == 'djibian/webeeblocks' &&
      github.actor == 'djibian' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, 'CHECKPOINT_REQUEST ')))
    runs-on: ubuntu-22.04
    steps:
      - run: echo "schema probe"

  runtime:
    name: Full Runtime evidence
    needs: validate
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/ci-runtime.yml
    with:
      target_sha: adc8f56d64d2222bfab06547992a75b95a69b25d
      full: true

  webots:
    name: Full Webots evidence
    needs: validate
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/ci-webots.yml
    with:
      target_sha: adc8f56d64d2222bfab06547992a75b95a69b25d

  publish:
    name: Publish one TEST_REQUIRED
    needs: [validate, runtime, webots]
    if: needs.runtime.result == 'success' && needs.webots.result == 'success'
    runs-on: ubuntu-22.04
    concurrency:
      group: webeeblocks-human-test-open
      cancel-in-progress: false
    steps:
      - run: echo "publish schema probe"
