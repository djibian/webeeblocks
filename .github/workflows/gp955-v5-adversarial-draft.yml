name: PR955 V5 native envelope and attempt replay (Draft evidence)
on:
  pull_request:
    branches: [experiment/954-vertical-safety-product-minimal]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/grand_prix/v5_native_adversarial_stimulus.js'
      - 'tools/grand_prix/run_955_v5_adversarial.py'
      - '.github/workflows/gp955-v5-adversarial-draft.yml'
permissions:
  contents: read
jobs:
  qualification:
    name: Exact #955 binary — ${{ matrix.cohort }} (not CI Gate)
    if: ${{ github.event.pull_request.draft && github.head_ref == 'experiment/955-v5-envelope-attempt-replay' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        cohort: [positive-vz]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact diagnostic source, never modify product controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m py_compile tools/grand_prix/run_955_v5_adversarial.py
          node --check tools/grand_prix/v5_native_adversarial_stimulus.js
      - name: Native Webots R2025a unchanged product binary, ceiling and oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/v5-native
          bash tools/prepare_runtime_v2.sh
          assets="$GITHUB_WORKSPACE/.ci-grand-prix-u-webots"
          git clone --depth=1 --filter=blob:none --sparse --branch R2025a https://github.com/cyberbotics/webots.git "$assets"
          git -C "$assets" sparse-checkout set projects/robots/bitcraze/crazyflie projects/objects/backgrounds projects/objects/floors projects/appearances projects/default
          test "$(git -C "$assets" rev-parse HEAD)" = "c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b"
          IMAGE='ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca'
          docker pull "$IMAGE"
          nodebin="$(command -v node)"
          gitbin="$(command -v git)"
          case "${{ matrix.cohort }}" in
            amplitude-middle) scenarios='env_02_allow env_03_edge env_04_edge' ;;
            amplitude-near-boundary) scenarios='env_05_edge env_05_refuse env_04_refuse' ;;
            positive-vz) scenarios='env_vplus_small_rebound env_vplus_large_rebound' ;;
            attempt-replay) scenarios='outcome_replay_h1' ;;
            *) exit 2 ;;
          esac
          set +e
          docker run --rm --init --entrypoint /bin/bash \
            -e WEBOTS_HOME=/usr/local/webots -e GP_V5_SCENARIOS="$scenarios" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$assets/projects:/usr/local/webots/projects:ro" \
            -v "$nodebin:/usr/local/bin/node:ro" \
            -v "$gitbin:/usr/local/bin/git:ro" \
            -w /workspace "$IMAGE" -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              timeout -k 10s 2000s python3 -u tools/grand_prix/run_955_v5_adversarial.py \
                --expected-head "$(git rev-parse HEAD)" \
                --webots-home /usr/local/webots \
                --output ci-artifacts/v5-native/native \
                --scenarios $GP_V5_SCENARIOS
            ' 2>&1 | tee ci-artifacts/v5-native/run.log
          code="${PIPESTATUS[0]}"
          set -e
          echo "$code" > ci-artifacts/v5-native/exit-code.txt
          exit "$code"
      - name: Preserve genuine failures and successful native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp955-v5-${{ matrix.cohort }}-${{ github.event.pull_request.head.sha }}
          path: ci-artifacts/v5-native/
          if-no-files-found: warn
