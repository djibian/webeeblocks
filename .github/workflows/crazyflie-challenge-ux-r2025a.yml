name: Crazyflie timed challenge UX R2025a

on:
  pull_request:
    branches: [webots-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timed-challenge-ux:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate challenge UX sources
        run: |
          node --check plugins/robot_windows/blockly/main.js
          python3 -m py_compile tools/ci/prepare_crazyflie_challenge_ux.py
          python3 -m py_compile tools/ci/runtime_wwi_event_server.py
          python3 -m py_compile tools/ci/instrument_runtime_done_ack.py

      - name: Prepare same-session challenge harness
        run: |
          python3 tools/ci/prepare_crazyflie_challenge_ux.py
          python3 tools/ci/instrument_runtime_done_ack.py

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged STOP runtime and physical evaluator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-challenge-ux
          for controller in crazyflie_l_course crazyflie_collision_observer; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-challenge-ux/build-${controller}.log"
          done
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-challenge-ux/controller-before.sha256

      - name: Run three student attempts in one Robot Window session
        shell: bash
        run: |
          set -o pipefail
          rm -f ci-artifacts/crazyflie-challenge-ux/events.jsonl
          rm -f ci-artifacts/crazyflie-done-ack-trace.txt
          rm -f ci-artifacts/crazyflie-obstacle-contact.txt
          rm -f ci-artifacts/crazyflie-l-course-result.txt
          rm -f ci-artifacts/crazyflie-runtime-mission-result.txt
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_wwi_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_wwi_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 /workspace/tools/ci/runtime_wwi_event_server.py --output /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl &
              event_server_pid=$!
              xvfb-run -a webots --stdout --stderr --batch --mode=realtime /workspace/worlds/crazyflie_runtime_obstacle.wbt > /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log 2>&1 &
              webots_pid=$!
              cleanup() {
                kill $webots_pid 2>/dev/null || true
                kill $event_server_pid 2>/dev/null || true
                wait $webots_pid 2>/dev/null || true
                wait $event_server_pid 2>/dev/null || true
              }
              trap cleanup EXIT
              complete=0
              for i in $(seq 1 1100); do
                if grep -Fq '"event": "CHALLENGE_TEST_COMPLETE"' /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl 2>/dev/null; then
                  complete=1
                  break
                fi
                if grep -Fq '"event": "ERROR"' /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl 2>/dev/null; then
                  cat /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl
                  exit 1
                fi
                if ! kill -0 $webots_pid 2>/dev/null; then
                  cat /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log
                  exit 1
                fi
                sleep 0.1
              done
              if [ "$complete" -ne 1 ]; then
                echo "Challenge UX harness did not complete in time"
                cat /workspace/ci-artifacts/crazyflie-challenge-ux/events.jsonl 2>/dev/null || true
                cat /workspace/ci-artifacts/crazyflie-challenge-ux/webots.log
                exit 1
              fi
            '

      - name: Prove causal states timer results and same-session resubmission
        shell: bash
        run: |
          set -o pipefail
          EVENTS=ci-artifacts/crazyflie-challenge-ux/events.jsonl
          LOG=ci-artifacts/crazyflie-challenge-ux/webots.log
          test -s "$EVENTS"
          test -s "$LOG"
          ! grep -Fq 'ERROR:' "$LOG"
          ! grep -Fq 'DONE_ACK_TIMEOUT' "$LOG"
          test "$(grep -Fc 'WEBEEBLOCKS_MISSION_V1 VALIDATED' "$LOG")" -eq 3
          test "$(grep -Fc 'WEBEEBLOCKS_MISSION_V1 DONE_ACK_RECEIVED' "$LOG")" -eq 3
          grep -Fq 'WEBEEBLOCKS_OBSTACLE_RESULT status=COLLISION' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT COLLISION' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS' "$LOG"
          grep -Fq 'WEBEEBLOCKS_CHALLENGE_V1 RESULT GATE_MISSED' "$LOG"
          python3 - <<'PY'
          import json
          from pathlib import Path

          events = [json.loads(line) for line in Path('ci-artifacts/crazyflie-challenge-ux/events.jsonl').read_text().splitlines() if line.strip()]
          assert any(e['event'] == 'INVALID_REJECTED_NO_TIMER' for e in events), events
          assert not any(e['event'] == 'ERROR' for e in events), events
          for attempt, expected in [
              ('DIRECT', 'COLLISION'),
              ('DETOUR', 'RÉUSSI'),
              ('GATE_MISS', 'PASSAGE MANQUÉ'),
          ]:
              terminal = [e for e in events if e['event'] == attempt + '_TERMINAL']
              assert terminal, (attempt, events)
              payload = json.loads(terminal[-1]['detail'])
              assert payload['state'] == 'TERMINÉ', payload
              assert payload['result'] == expected, payload
              assert payload['time'].endswith(' s') and payload['time'] != '—', payload
          initial = [e for e in events if e['event'] == 'INITIAL'][-1]
          assert json.loads(initial['detail'])['state'] == 'PRÊT'
          assert any(e['event'] == 'CHALLENGE_TEST_COMPLETE' for e in events), events

          challenge = [json.loads(e['detail']) for e in events if e['event'] == 'CHALLENGE']
          starts = [e for e in challenge if e.get('state') == 'RUNNING' and e.get('elapsed') == 0]
          assert len(starts) == 3, starts
          terminals = [e for e in challenge if e.get('state') == 'FINISHED']
          assert [e.get('result') for e in terminals] == ['COLLISION', 'RÉUSSI', 'PASSAGE MANQUÉ'], terminals
          assert all(float(e['elapsed']) > 0 for e in terminals), terminals
          print('PASS: one Robot Window session completed COLLISION -> edit/resubmit -> SUCCESS -> edit/resubmit -> GATE_MISSED with Webots-derived frozen times.')
          PY
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-challenge-ux/controller-after.sha256
          cmp ci-artifacts/crazyflie-challenge-ux/controller-before.sha256 \
              ci-artifacts/crazyflie-challenge-ux/controller-after.sha256

      - name: Upload challenge UX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-challenge-ux-r2025a
          path: |
            ci-artifacts/crazyflie-challenge-ux/
            ci-artifacts/crazyflie-done-ack-trace.txt
            ci-artifacts/crazyflie-obstacle-contact.txt
            ci-artifacts/crazyflie-l-course-result.txt
            ci-artifacts/crazyflie-runtime-mission-result.txt
          if-no-files-found: warn
