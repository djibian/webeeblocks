# BOUND NON-GATE: prove default Linux student U route selects B, not only an explicitly injected image.
name: M2 Linux default R2025a B selection (NON-GATE)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
jobs:
  default-product:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify default product image and exact Webots ELF
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.ci.run_grand_prix_u_geometry import IMAGE
          expected='ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca'
          assert IMAGE==expected, (IMAGE, expected)
          from tools.ci.run_grand_prix_u_prototype import IMAGE as PRODUCT_IMAGE
          assert PRODUCT_IMAGE==expected
          from tools.ci.run_grand_prix_u_core_capture import IMAGE as CAPTURE_IMAGE
          assert CAPTURE_IMAGE==expected
          print('M2_DEFAULT_LINUX_PRODUCT_IMAGE=PASS',IMAGE)
          PY
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image='ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca'
          docker pull "$image"
          docker run --rm --entrypoint /bin/bash "$image" -lc '
            set -euo pipefail
            test "$(cat /usr/local/webots/resources/version.txt)" = R2025a
            echo "e45a90b580a00f50dc08746e6f43d1a86a83fcf1b23f55538737309154150545  /usr/local/webots/bin/webots-bin" | sha256sum -c -
            echo M2_LINUX_B_ELF_ACTUAL=PASS
          '
      - name: Execute ordinary unmodified Linux U entry point, no runtime selection argument
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite short
          test -s ci-artifacts/grand-prix-u/docker.log
          grep -F 'GP_U_CONTAINER_START ghcr.io/djibian/webeeblocks-qt665-r2025a@sha256:7a9272dfef96e7668f8f31eaac9099b0417a9028e3181df6f8376eea59fe1aca' ci-artifacts/grand-prix-u/docker.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('ci-artifacts/grand-prix-u/campaign.json')
          cases=json.loads(p.read_text())
          assert len(cases)==1 and cases[0]['mode']=='short',cases
          assert cases[0]['reason']=='wrong-landing' and cases[0]['status']=='not-achieved',cases
          print('M2_DEFAULT_LINUX_NATIVE_PRODUCT_AND_UNCHANGED_NEGATIVE_ORACLE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-linux-default-b-product-short-native
          path: ci-artifacts/grand-prix-u/
          retention-days: 90
          if-no-files-found: warn
