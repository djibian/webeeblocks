name: H6 R-G factorial independent counter-expertise
on:
  push:
    branches:
      - experiment/h6-rg-factorial-independent-20261030
permissions:
  contents: read
concurrency:
  group: h6-rg-factorial-independent-20261030
  cancel-in-progress: true
jobs:
  h6:
    name: Native H6 2x2 factorial R/G isolated
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      WEBOTS_PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack and authenticate exact H6 kit sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h6-evidence/logs experiments/h6/payload
          printf '%s  %s\n' 124fe0149d1bcebf0175a4fd45642476ca8b06ba10c16a28d5a27d2b62896ec5 experiments/h6/h6_payload.tar.xz | sha256sum -c -
          tar -xJf experiments/h6/h6_payload.tar.xz -C experiments/h6/payload
          (cd experiments/h6/payload && find . -type f -print0 | sort -z | xargs -0 sha256sum) > h6-evidence/kit_sources.sha256
          printf 'experiment_commit=%s\n' "$(git rev-parse HEAD)" > h6-evidence/identity.txt
          printf 'webots_pin=%s\n' "$WEBOTS_PIN" >> h6-evidence/identity.txt
          python3 -m py_compile experiments/h6/payload/source/*.py experiments/h6/payload/controllers/h6_supervisor/*.py
          bash -n experiments/h6/payload/source/run_ab.sh
          # Apply an authenticated, purely observational I/O fix to extracted probe scripts.
          # Original kit and source digests are retained unchanged for audit.
          python3 experiments/h6/h6_termination_observability.py experiments/h6/payload > h6-evidence/logs/observability-patch.log
          python3 experiments/h6/h6_atomic_native.py experiments/h6/payload > h6-evidence/logs/atomic-native-patch.log
          python3 experiments/h6/h6_p4_controls_patch.py experiments/h6/payload > h6-evidence/logs/p4-controls-patch.log
          python3 experiments/h6/h6_attachment_cleanup_patch.py experiments/h6/payload > h6-evidence/logs/r-attachment-patch.log
          python3 experiments/h6/h6_rg_factorial_patch.py experiments/h6/payload > h6-evidence/logs/rg-independent-factors.log
          python3 -m py_compile experiments/h6/h6_rg_factorial_patch.py experiments/h6/h6_rg_factorial_oracle.py
          cp -a experiments/h6/payload/source/. h6-evidence/kit-source/
          cp -a experiments/h6/payload/controllers h6-evidence/kit-source/controllers
          cp -a experiments/h6/payload/worlds h6-evidence/kit-source/worlds
          python3 -m py_compile experiments/h6/payload/source/*.py experiments/h6/payload/controllers/h6_supervisor/*.py
          bash -n experiments/h6/payload/source/run_ab.sh
      - name: Acquire exact Webots R2025a source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots 2>&1 | tee h6-evidence/logs/clone.log
          git -C native-webots checkout --detach "$WEBOTS_PIN" 2>&1 | tee h6-evidence/logs/checkout.log
          test "$(git -C native-webots rev-parse HEAD)" = "$WEBOTS_PIN"
          git -C native-webots submodule update --init --recursive --jobs 4 2>&1 | tee h6-evidence/logs/submodules.log
          printf '%s\n' "$(git -C native-webots rev-parse HEAD)" > h6-evidence/webots_source_sha.txt
          git -C native-webots status --porcelain=v1 > h6-evidence/webots_prepatch_status.txt
          test ! -s h6-evidence/webots_prepatch_status.txt
      - name: Install pinned-source Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee h6-evidence/logs/apt-update.log
          sudo apt-get install -y xvfb xauth python3 python-is-python3 2>&1 | tee h6-evidence/logs/apt-xvfb.log
          (cd native-webots && sudo bash scripts/install/linux_compilation_dependencies.sh) 2>&1 | tee h6-evidence/logs/compile-dependencies.log
      - name: Apply H6 instrumentation to source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/h6/payload/source/patch_webots_h6.py "$PWD/native-webots" 2>&1 | tee h6-evidence/logs/patch.log
          git -C native-webots diff --check
          git -C native-webots diff --binary HEAD > h6-evidence/instrumentation.patch
          sha256sum h6-evidence/instrumentation.patch > h6-evidence/instrumentation.patch.sha256
          find native-webots/src -path '*h6_probe.h' -print -exec sha256sum '{}' ';' > h6-evidence/probe_header_sha.txt
      - name: Compile authentic patched Webots and bundled ODE
        shell: bash
        run: |
          set -euo pipefail
          (cd native-webots && make -j2) > h6-evidence/logs/webots-build.log 2>&1 || {
            tail -n 180 h6-evidence/logs/webots-build.log
            exit 1
          }
          test -x native-webots/bin/webots-bin
          test -x native-webots/webots
          sha256sum native-webots/bin/webots-bin native-webots/webots > h6-evidence/compiled-executables.sha256
          find native-webots/lib -type f \( -iname '*ode*.so*' -o -iname '*physics*.so*' \) -exec sha256sum '{}' ';' > h6-evidence/compiled-physics-candidates.sha256
          grep -aF 'H6 event=armed body=' native-webots/bin/webots-bin || grep -RalF 'H6 event=armed body=' native-webots/lib
      - name: Execute strict native 2x2 H6 factorial A00 G01 R10 RG11
        shell: bash
        env:
          WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE: '1'
          QT_QPA_PLATFORM: xcb
        run: |
          set -euo pipefail
          export WEBOTS_HOME="$PWD/native-webots"
          export WEBOTS_EXECUTABLE="$WEBOTS_HOME/webots"
          mkdir -p h6-evidence/factorial
          for spec in A00 G01 R10 RG11; do
            case "$spec" in
              A00) export WEBEE_H6_R=0 WEBEE_H6_G=0 ;;
              G01) export WEBEE_H6_R=0 WEBEE_H6_G=1 ;;
              R10) export WEBEE_H6_R=1 WEBEE_H6_G=0 ;;
              RG11) export WEBEE_H6_R=1 WEBEE_H6_G=1 ;;
              *) exit 90 ;;
            esac
            echo "H6 FACTORIAL $spec R=$WEBEE_H6_R G=$WEBEE_H6_G"
            printf 'R=%s G=%s commit=%s webots=%s\n' "$WEBEE_H6_R" "$WEBEE_H6_G" "$(git rev-parse HEAD)" "$WEBOTS_PIN" > "h6-evidence/factorial/$spec.flags.txt"
            set +e
            xvfb-run -a -s '-screen 0 1280x800x24' bash experiments/h6/payload/source/run_ab.sh "$PWD/h6-evidence/factorial/$spec" > "h6-evidence/logs/$spec-run.stdout.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "h6-evidence/logs/$spec-run.exit"
            test -s "h6-evidence/factorial/$spec/F/native.log" || { echo "H6 REFUSED no native F for $spec"; exit 91; }
            test -s "h6-evidence/factorial/$spec/F/process_exit_code.txt" || { echo "H6 REFUSED no F process exit for $spec"; exit 92; }
          done
          # Historical P4 is NOT weakened: preserve it unmodified and run it
          # only against R10, where its original intervention chronology applies.
          python3 experiments/h6/h6_qualify_p4.py "$PWD/h6-evidence/factorial/R10" "$PWD/experiments/h6/payload/source/analyze_ab.py" > h6-evidence/logs/UNMODIFIED-P4-R10.log
          # Other arms have different intended chronology, not compatible with
          # the old F=2-removals oracle. This NEW oracle is independent.
          python3 experiments/h6/h6_rg_factorial_oracle.py "$PWD/h6-evidence/factorial" > h6-evidence/logs/factorial-oracle.log
          test -s h6-evidence/factorial/factorial_verdict.json
      - name: Authenticate retained results on every termination
        if: always()
        shell: bash
        run: |
          mkdir -p h6-evidence/logs
          df -h . > h6-evidence/logs/disk.txt
          git rev-parse HEAD > h6-evidence/experiment_commit.txt
          if test -d native-webots/.git; then
            git -C native-webots rev-parse HEAD > h6-evidence/webots_source_actual.txt
            git -C native-webots diff --stat HEAD > h6-evidence/webots_source_diff_stat.txt
            find native-webots/lib -type f \( -iname '*ode*.so*' -o -iname '*physics*.so*' \) -exec sha256sum '{}' ';' > h6-evidence/native_physics_libs.sha256 || true
          fi
          find h6-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > h6-evidence/SHA256SUMS.txt
      - name: Publish raw proof or precise failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H6-independent-RG-factorial-native-evidence
          path: h6-evidence/
          if-no-files-found: error
          retention-days: 30
