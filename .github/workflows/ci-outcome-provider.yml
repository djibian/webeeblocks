name: Outcome Provider Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-outcome-provider.yml'
      - 'controllers/crazyflie_runtime_v2/**'
      - 'controllers/runtime_v2_outcome_probe/**'
      - 'plugins/robot_windows/blockly/webeeblocks/wwi_backend.js'
      - 'plugins/robot_windows/blockly_v2/webots/**'
      - 'plugins/robot_windows/outcome_probe/**'
      - 'tools/ci/runtime_wwi_event_server.py'
      - 'tools/ci/webots_runtime_v2_browser.sh'
      - 'worlds/runtime_v2_outcome_probe.wbt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-webots-outcome-freshness:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Runtime v2 browser assets
        run: ./tools/prepare_runtime_v2.sh

      - name: Validate probe sources
        run: |
          set -euo pipefail
          node --check plugins/robot_windows/outcome_probe/outcome_probe.js
          python3 -m py_compile controllers/runtime_v2_outcome_probe/runtime_v2_outcome_probe.py
          grep -q 'DEF OUTCOME_CRAZYFLIE Crazyflie' worlds/runtime_v2_outcome_probe.wbt
          grep -q 'window "outcome_probe"' worlds/runtime_v2_outcome_probe.wbt
          grep -q 'controller "runtime_v2_outcome_probe"' worlds/runtime_v2_outcome_probe.wbt

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged Runtime v2 controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/runtime-v2-outcome-provider
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/runtime-v2-outcome-provider/build.log

      - name: Prove real Webots attempt freshness
        shell: bash
        run: |
          set -o pipefail
          set +e
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /workspace/ci-artifacts/runtime-v2-outcome-provider /root/.config/Cyberbotics
              printf "%s\n" \
                "[RobotWindow]" \
                "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" \
                "newBrowserWindow=false" \
                > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 /workspace/tools/ci/runtime_wwi_event_server.py \
                --output /workspace/ci-artifacts/runtime-v2-outcome-provider/browser-events.jsonl &
              server=$!
              trap "kill $server 2>/dev/null || true" EXIT
              sleep 0.5
              timeout -k 5s 35s xvfb-run -a webots --stdout --stderr --batch --mode=realtime /workspace/worlds/runtime_v2_outcome_probe.wbt
            ' \
            2>&1 | tee ci-artifacts/runtime-v2-outcome-provider/webots.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-artifacts/runtime-v2-outcome-provider/exit-code.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Validate causal outcome evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('ci-artifacts/runtime-v2-outcome-provider')
          event_path = root / 'browser-events.jsonl'
          assert event_path.exists() and event_path.stat().st_size > 0, 'missing browser outcome evidence'
          events = [json.loads(line) for line in event_path.read_text().splitlines() if line.strip()]
          errors = [event for event in events if event.get('event') in ('ERROR', 'WINDOW_ERROR', 'UNHANDLED_REJECTION')]
          assert not errors, errors[:1]
          names = [event.get('event') for event in events]
          required = ('PROBE_READY', 'ATTEMPT_A', 'RESET_OK', 'NO_STALE_AFTER_RESET', 'ATTEMPT_B', 'OUTCOME_PROVIDER_TEST_COMPLETE')
          for name in required:
              assert name in names, (name, names)
          a = next(event['detail'] for event in events if event.get('event') == 'ATTEMPT_A')
          stale = next(event['detail'] for event in events if event.get('event') == 'NO_STALE_AFTER_RESET')
          b = next(event['detail'] for event in events if event.get('event') == 'ATTEMPT_B')
          assert a == {'status': 'achieved'}, a
          assert stale == {'code': 'OUTCOME_UNAVAILABLE'}, stale
          assert b == {'status': 'not-achieved'}, b
          log = (root / 'webots.log').read_text(errors='replace')
          assert 'WEBEEBLOCKS_OUTCOME_PROBE publish attempt=1 status=achieved' in log, log[-4000:]
          assert 'WEBEEBLOCKS_OUTCOME_PROBE publish attempt=2 status=not-achieved' in log, log[-4000:]
          assert 'ERROR:' not in log, log[-4000:]
          print('PASS: real R2025a outcome provider proves attempt A terminal -> reset -> no stale terminal -> attempt B terminal')
          PY

      - name: Upload outcome-provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v2-outcome-provider-r2025a
          path: ci-artifacts/runtime-v2-outcome-provider/
          if-no-files-found: error
