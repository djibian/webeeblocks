name: Experimental modern Blockly Runtime v2

on:
  pull_request:
    paths:
      - 'experiments/modern-blockly/**'
      - 'plugins/robot_windows/blockly/webeeblocks/**'
      - 'plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js'
      - 'controllers/Blockly_Programs/CrazyflieReactiveV2.xml'
      - 'controllers/crazyflie_runtime_v2/**'
      - 'worlds/crazyflie_runtime_v2.wbt'
      - 'tools/ci/runtime_wwi_event_server.py'
      - '.github/workflows/modern-blockly-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Blockly experiment dependency
        working-directory: experiments/modern-blockly
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Prove profile, XML migration, JSON round-trip and AST equivalence
        working-directory: experiments/modern-blockly
        run: npm test

      - name: Build offline modern Blockly Robot Window bundle
        working-directory: experiments/modern-blockly
        run: |
          node prepare_robot_window.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/blockly_compressed.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/blocks_compressed.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/msg/en.js
          test -d ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/media
          grep -Fq 'window "modern_blockly_v2_experiment"' ../../worlds/modern_blockly_v2_experiment.wbt

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged Runtime v2 controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/modern-blockly
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/modern-blockly/build.log

      - name: Open offline modern Blockly as real Webots Robot Window
        shell: bash
        run: |
          set -o pipefail
          set +e
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              artifact_dir=/workspace/ci-artifacts/modern-blockly
              events="$artifact_dir/browser-events.jsonl"
              chrome_pid_file="$artifact_dir/chrome.pid"
              netlog="$artifact_dir/chrome-netlog.json"
              mkdir -p "$artifact_dir"

              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/experiments/modern-blockly/webots_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" \
                "[RobotWindow]" \
                "browser=/workspace/experiments/modern-blockly/webots_browser.sh" \
                "newBrowserWindow=false" \
                > /root/.config/Cyberbotics/Webots-R2025a.conf

              python3 /workspace/tools/ci/runtime_wwi_event_server.py --output "$events" &
              event_server_pid=$!
              webots_pid='"'"''"'"'
              cleanup() {
                if [[ -n "$webots_pid" ]] && kill -0 "$webots_pid" 2>/dev/null; then
                  kill -TERM "$webots_pid" 2>/dev/null || true
                  wait "$webots_pid" 2>/dev/null || true
                fi
                kill "$event_server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              sleep 0.5

              xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/modern_blockly_v2_experiment.wbt &
              webots_pid=$!
              deadline=$((SECONDS + 40))
              ast_seen=0
              while kill -0 "$webots_pid" 2>/dev/null; do
                if [[ -s "$events" ]] && grep -Fq '"'"'"event":"AST_EQUIVALENT"'"'"' "$events"; then
                  ast_seen=1
                  break
                fi
                if (( SECONDS >= deadline )); then
                  break
                fi
                sleep 0.25
              done

              if (( ast_seen == 0 )); then
                echo "::error::AST_EQUIVALENT was not observed before the Webots deadline"
                exit 124
              fi

              # The causal contract is already observed. Stop Chrome gracefully so
              # --log-net-log writes a complete JSON document before we inspect it.
              if [[ ! -s "$chrome_pid_file" ]]; then
                echo "::error::Chrome PID was not recorded"
                exit 1
              fi
              chrome_pid=$(cat "$chrome_pid_file")
              kill -TERM "$chrome_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                kill -0 "$chrome_pid" 2>/dev/null || break
                sleep 0.1
              done
              if kill -0 "$chrome_pid" 2>/dev/null; then
                echo "::error::Chrome did not stop gracefully after AST_EQUIVALENT"
                exit 1
              fi

              # Fail here rather than accepting a truncated network oracle.
              python3 - <<PY
import json
from pathlib import Path
path = Path("$netlog")
with path.open("r", encoding="utf-8") as handle:
    json.load(handle)
print("CHROME_NETLOG_COMPLETE=PASS")
PY

              kill -TERM "$webots_pid" 2>/dev/null || true
              wait "$webots_pid" 2>/dev/null || true
              webots_pid='"'"''"'"'
            ' \
            2>&1 | tee ci-artifacts/modern-blockly/webots.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" | tee ci-artifacts/modern-blockly/exit-code.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::Modern Blockly Robot Window run exited unexpectedly with $code"
            exit 1
          fi

      - name: Prove offline Robot Window initialization and AST equivalence
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-artifacts/modern-blockly/browser-launch.log
          test -s ci-artifacts/modern-blockly/browser-events.jsonl
          test -s ci-artifacts/modern-blockly/chrome-netlog.json
          grep -Fq 'modern_blockly_v2_experiment' ci-artifacts/modern-blockly/browser-launch.log
          grep -Fq 'CHROME_NETLOG_COMPLETE=PASS' ci-artifacts/modern-blockly/webots.log
          ! grep -Fq 'ERROR:' ci-artifacts/modern-blockly/webots.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          events = [json.loads(line) for line in Path('ci-artifacts/modern-blockly/browser-events.jsonl').read_text().splitlines() if line.strip()]
          assert events, 'no browser events'
          assert not any(event.get('event') == 'ERROR' for event in events), events
          names = [event.get('event') for event in events]
          required = ['PAGE_LOADED', 'BLOCKLY_INITIALIZED', 'PROFILE_APPLIED', 'AST_EQUIVALENT']
          positions = [names.index(name) for name in required]
          assert positions == sorted(positions), (names, positions)

          initialized = next(event for event in events if event.get('event') == 'BLOCKLY_INITIALIZED')
          assert initialized['detail']['version'] == '13.2.1', initialized
          profile = next(event for event in events if event.get('event') == 'PROFILE_APPLIED')
          assert profile['detail']['profile'] == 'reactive-obstacle-v2', profile

          equivalent = next(event for event in events if event.get('event') == 'AST_EQUIVALENT')
          expected = json.loads(Path('experiments/modern-blockly/expected_ast.json').read_text())
          assert equivalent['detail']['ast'] == expected, (equivalent['detail']['ast'], expected)

          # Independent runtime network oracle: inspect Chrome NetLog rather than
          # trusting the page's own resource list. Provisioning happens before
          # Chrome starts, so any URL here belongs to browser runtime.
          netlog = json.loads(Path('ci-artifacts/modern-blockly/chrome-netlog.json').read_text())
          external = set()
          url_pattern = re.compile(r'https?://[^\s"<>]+')

          def scan(value):
              if isinstance(value, dict):
                  for child in value.values():
                      scan(child)
              elif isinstance(value, list):
                  for child in value:
                      scan(child)
              elif isinstance(value, str):
                  for raw in url_pattern.findall(value):
                      parsed = urlparse(raw.rstrip('),.;'))
                      if parsed.hostname not in {'127.0.0.1', 'localhost'}:
                          external.add(raw)

          scan(netlog.get('events', []))
          assert not external, f'external runtime network attempts in Chrome NetLog: {sorted(external)}'
          print('PASS: real R2025a Robot Window initialized pinned modern Blockly offline and preserved Runtime v2 AST.')
          PY

      - name: Upload modern Blockly diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-blockly-r2025a-experiment
          path: ci-artifacts/modern-blockly/
          if-no-files-found: error
