name: Experimental modern Blockly Runtime v2

on:
  pull_request:
    paths:
      - 'experiments/modern-blockly/**'
      - 'plugins/robot_windows/blockly/webeeblocks/**'
      - 'plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/crazyflie_v2.js'
      - 'controllers/Blockly_Programs/CrazyflieReactiveV2.xml'
      - 'controllers/crazyflie_runtime_v2/**'
      - 'worlds/crazyflie_runtime_v2.wbt'
      - 'tools/ci/runtime_wwi_event_server.py'
      - '.github/workflows/modern-blockly-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Blockly experiment dependency
        working-directory: experiments/modern-blockly
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Prove profile, XML migration, JSON round-trip and AST equivalence
        working-directory: experiments/modern-blockly
        run: npm test

      - name: Build offline modern Blockly Robot Window bundle
        working-directory: experiments/modern-blockly
        run: |
          node prepare_robot_window.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/blockly_compressed.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/blocks_compressed.js
          test -s ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/msg/en.js
          test -d ../../plugins/robot_windows/modern_blockly_v2_experiment/vendor/media
          grep -Fq 'window "modern_blockly_v2_experiment"' ../../worlds/modern_blockly_v2_experiment.wbt

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged Runtime v2 controller
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/modern-blockly
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_runtime_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/modern-blockly/build.log

      - name: Prove offline real Robot Window and falsify an external required asset
        shell: bash
        run: bash experiments/modern-blockly/run_robot_window_gate.sh

      - name: Upload modern Blockly diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-blockly-r2025a-experiment
          path: ci-artifacts/modern-blockly/
          if-no-files-found: error
