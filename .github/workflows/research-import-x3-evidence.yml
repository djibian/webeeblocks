name: Research import X3 raw evidence

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  import-raw-evidence:
    if: github.head_ref == 'work/x3-raw-evidence-access'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download, verify, safely extract and stage machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          root='experiments/crazyflie-ukf-surface-range/evidence'
          rm -rf "$root/checkpoint-180" "$root/checkpoint-236" "$root/checkpoint-251"
          mkdir -p "$root"

          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/user-attachments/files/31959735/S3-173b7c5-results.tar.gz' \
            --output /tmp/S3-173b7c5-results.tar.gz
          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/user-attachments/files/31977115/S3-8561ec3-checkpoint-236-evidence.tar.gz' \
            --output /tmp/S3-8561ec3-checkpoint-236-evidence.tar.gz
          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/user-attachments/files/32015675/X3-6562ad827bf0-checkpoint-251-evidence.zip' \
            --output /tmp/X3-6562ad827bf0-checkpoint-251-evidence.zip

          echo 'd47dd2b4e83e87c3fd8fa5576f720355a858879ac0d0c27550831dbcaaf1fccb  /tmp/S3-8561ec3-checkpoint-236-evidence.tar.gz' | sha256sum -c -
          echo '996a79be8783de18ad26e8687322cc9ef7ff2bda1fa8331f4320f3389dd00ba7  /tmp/X3-6562ad827bf0-checkpoint-251-evidence.zip' | sha256sum -c -

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, shutil, tarfile, tempfile, zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          root = repo / 'experiments/crazyflie-ukf-surface-range/evidence'
          sources = [
              {
                  'checkpoint': 180,
                  'archive': Path('/tmp/S3-173b7c5-results.tar.gz'),
                  'url': 'https://github.com/user-attachments/files/31959735/S3-173b7c5-results.tar.gz',
                  'issue_comment': 'https://github.com/djibian/webeeblocks/issues/180#issuecomment-5586166222',
                  'expected_sha256': None,
                  'kind': 'tar.gz',
              },
              {
                  'checkpoint': 236,
                  'archive': Path('/tmp/S3-8561ec3-checkpoint-236-evidence.tar.gz'),
                  'url': 'https://github.com/user-attachments/files/31977115/S3-8561ec3-checkpoint-236-evidence.tar.gz',
                  'issue_comment': 'https://github.com/djibian/webeeblocks/issues/236#issuecomment-5591721995',
                  'expected_sha256': 'd47dd2b4e83e87c3fd8fa5576f720355a858879ac0d0c27550831dbcaaf1fccb',
                  'kind': 'tar.gz',
              },
              {
                  'checkpoint': 251,
                  'archive': Path('/tmp/X3-6562ad827bf0-checkpoint-251-evidence.zip'),
                  'url': 'https://github.com/user-attachments/files/32015675/X3-6562ad827bf0-checkpoint-251-evidence.zip',
                  'issue_comment': 'https://github.com/djibian/webeeblocks/issues/251#issuecomment-5604542710',
                  'expected_sha256': '996a79be8783de18ad26e8687322cc9ef7ff2bda1fa8331f4320f3389dd00ba7',
                  'kind': 'zip',
              },
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def safe_rel(name: str) -> Path:
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                  raise RuntimeError(f'unsafe archive member: {name!r}')
              return Path(*p.parts)

          for src in sources:
              arc = src['archive']
              size = arc.stat().st_size
              if size <= 0 or size > 50 * 1024 * 1024:
                  raise RuntimeError(f'unexpected archive size for {arc}: {size}')
              digest = sha256(arc)
              if src['expected_sha256'] and digest != src['expected_sha256']:
                  raise RuntimeError(f'archive digest mismatch for checkpoint {src["checkpoint"]}')

              out = root / f'checkpoint-{src["checkpoint"]}'
              raw = out / 'raw'
              raw.mkdir(parents=True, exist_ok=True)
              skipped = []
              committed = []
              with tempfile.TemporaryDirectory() as td:
                  tmp = Path(td)
                  if src['kind'] == 'zip':
                      with zipfile.ZipFile(arc) as zf:
                          for info in zf.infolist():
                              if info.is_dir():
                                  continue
                              rel = safe_rel(info.filename)
                              dest = tmp / rel
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              with zf.open(info) as r, dest.open('wb') as w:
                                  shutil.copyfileobj(r, w)
                  else:
                      with tarfile.open(arc, 'r:gz') as tf:
                          for member in tf.getmembers():
                              if not member.isfile():
                                  continue
                              rel = safe_rel(member.name)
                              stream = tf.extractfile(member)
                              if stream is None:
                                  continue
                              dest = tmp / rel
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              with stream, dest.open('wb') as w:
                                  shutil.copyfileobj(stream, w)

                  total_text = 0
                  csv_count = 0
                  for path in sorted(p for p in tmp.rglob('*') if p.is_file()):
                      rel = path.relative_to(tmp)
                      data = path.read_bytes()
                      file_digest = hashlib.sha256(data).hexdigest()
                      try:
                          data.decode('utf-8')
                      except UnicodeDecodeError:
                          skipped.append({'path': rel.as_posix(), 'sha256': file_digest, 'bytes': len(data), 'reason': 'non-UTF-8/binary'})
                          continue
                      if len(data) > 10 * 1024 * 1024:
                          skipped.append({'path': rel.as_posix(), 'sha256': file_digest, 'bytes': len(data), 'reason': 'text file exceeds 10 MiB bound'})
                          continue
                      total_text += len(data)
                      if total_text > 40 * 1024 * 1024:
                          raise RuntimeError(f'text evidence exceeds 40 MiB for checkpoint {src["checkpoint"]}')
                      dest = raw / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      committed.append({'path': f'raw/{rel.as_posix()}', 'sha256': file_digest, 'bytes': len(data)})
                      if path.suffix.lower() == '.csv':
                          csv_count += 1

              if csv_count == 0:
                  raise RuntimeError(f'no CSV evidence found in checkpoint {src["checkpoint"]}')
              provenance = {
                  'checkpoint': src['checkpoint'],
                  'source_archive_filename': arc.name,
                  'source_url': src['url'],
                  'source_issue_comment': src['issue_comment'],
                  'source_archive_sha256': digest,
                  'expected_archive_sha256': src['expected_sha256'],
                  'source_archive_bytes': size,
                  'machine_readable_files': committed,
                  'skipped_files': skipped,
              }
              (out / 'SOURCE.json').write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              with (out / 'MANIFEST.sha256').open('w', encoding='utf-8') as f:
                  for item in committed:
                      f.write(f"{item['sha256']}  {item['path']}\n")
              print(f"checkpoint {src['checkpoint']}: archive={digest} csv={csv_count} text_files={len(committed)} skipped={len(skipped)}")
          PY

          cat > "$root/README.md" <<'EOF'
          # Raw physical evidence for #70

          Machine-readable copies of the human checkpoint traces from #180, #236 and #251.

          These files exist so stateless Controllers can reanalyse the already-acquired physical data without depending on `github.com/user-attachments` binary materialization. `SOURCE.json` in each checkpoint directory binds the copied files to the original issue attachment URL and archive SHA-256; `MANIFEST.sha256` binds each committed text file.

          The copied evidence does not change any prior PASS/FAIL verdict and does not authorize motorized testing, retuning or a firmware product claim. Invalid/excluded runs remain preserved as evidence and must remain excluded exactly as documented by their checkpoint record.
          EOF

          git diff --check

      - name: Commit evidence and remove this one-shot importer
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/research-import-x3-evidence.yml
          git add experiments/crazyflie-ukf-surface-range/evidence
          git status --short
          git diff --cached --check
          git commit -m 'Import raw #70 checkpoint traces for machine replay'
          git push origin "HEAD:${HEAD_BRANCH}"
