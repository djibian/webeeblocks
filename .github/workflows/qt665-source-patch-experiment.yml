name: QT665 source patch experiment (NON-GATE)

on:
  push:
    branches:
      - fix/665-qt-guarded-retirement-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt665-source-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-patch-only:
    name: Upstream source patch (NOT native/CI Gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact WebeeBlocks experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned upstream R2025a source paths
        uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          fetch-depth: 1
          persist-credentials: false
          path: upstream-webots
          sparse-checkout: |
            src/webots/gui/WbMainWindow.hpp
            src/webots/gui/WbMainWindow.cpp
            src/webots/app/WbApplication.cpp
          sparse-checkout-cone-mode: false

      - name: Fail-closed source-only attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/webots-qt-665/qualify_source_patch.py \
            --webots-tree upstream-webots | tee qt665-source-only.json
          python3 -m json.tool qt665-source-only.json >/dev/null
          grep -q '"status": "SOURCE_PATCH_APPLIES_ONLY"' qt665-source-only.json

      - name: Preserve source-only manifest (not a corrected binary)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qt665-source-only-${{ github.sha }}
          path: qt665-source-only.json
          retention-days: 14
