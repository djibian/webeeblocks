name: Historical Light Sensor R2025a gate

on:
  pull_request:
    branches:
      - webots-ci
    types: [opened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-sensor-historical:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        run: mkdir -p ci-artifacts

      - name: Export exact historical BoxWithLightSensor controller
        shell: bash
        run: |
          cp controllers/my_controller/my_controller.py controllers/my_controller/.ci-light-sensor-backup.py
          python3 tools/ci/export_historical_blockly_program.py \
            BoxWithLightSensor.xml \
            controllers/my_controller/my_controller.py

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Rebuild sidecar and supervisor for R2025a
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libboost-dev
              cd /workspace/controllers/supervisor/blocklyServer
              rm -f blocklyServer
              make
              cd /workspace/controllers/supervisor
              make clean
              make
            ' 2>&1 | tee ci-artifacts/light-sensor-build.log

      - name: Prepare offline historical world
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('worlds/lightSensorBoxChallenge.wbt')
          target = Path('worlds/.ci-lightSensorBoxChallenge-local.wbt')
          remote_prefix = 'https://raw.githubusercontent.com/cyberbotics/webots/R2025a/'
          local_prefix = 'webots://'

          original = source.read_text(encoding='utf-8')
          if 'webots://' in original:
              raise SystemExit('Unexpected pre-existing webots:// reference in historical source world.')

          replacements = original.count(remote_prefix)
          if replacements != 7:
              raise SystemExit(f'Expected exactly 7 Cyberbotics R2025a remote EXTERNPROTO references, found {replacements}.')

          localized = original.replace(remote_prefix, local_prefix)
          if 'raw.githubusercontent.com/cyberbotics/webots/' in localized:
              raise SystemExit('A Cyberbotics raw.githubusercontent.com dependency remains after localization.')

          if localized.replace(local_prefix, remote_prefix) != original:
              raise SystemExit('Offline world differs from the historical world by more than the allowed URL-prefix localization.')

          target.write_text(localized, encoding='utf-8')
          print(f'PASS: localized exactly {replacements} Webots R2025a EXTERNPROTO references without changing world semantics.')
          PY

      - name: Execute historical light sensor program offline
        shell: bash
        run: |
          set +e
          set -o pipefail

          docker run --rm \
            --network none \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 30s xvfb-run -a webots \
              --stdout \
              --stderr \
              --batch \
              --mode=fast \
              /workspace/worlds/.ci-lightSensorBoxChallenge-local.wbt' \
            2>&1 | tee ci-artifacts/webots-light-sensor.log

          code=${PIPESTATUS[0]}
          set -e
          echo "$code" | tee ci-artifacts/webots-light-sensor-exit-code.txt

          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            exit 0
          fi
          exit "$code"

      - name: Restore historical controller
        if: always()
        shell: bash
        run: |
          if [ -f controllers/my_controller/.ci-light-sensor-backup.py ]; then
            mv controllers/my_controller/.ci-light-sensor-backup.py controllers/my_controller/my_controller.py
          fi
          rm -f worlds/.ci-lightSensorBoxChallenge-local.wbt

      - name: Validate historical light sensor behavior
        shell: bash
        run: |
          LOG=ci-artifacts/webots-light-sensor.log

          if grep -Fq 'ERROR:' "$LOG"; then
            echo '::error::Webots emitted an error while running BoxWithLightSensor.'
            grep -F 'ERROR:' "$LOG"
            exit 1
          fi

          if grep -Fq 'Traceback (most recent call last)' "$LOG"; then
            echo '::error::Historical light-sensor Python raised an exception.'
            grep -A30 -F 'Traceback (most recent call last)' "$LOG"
            exit 1
          fi

          if ! grep -Fq 'INFO: my_controller: Starting controller:' "$LOG"; then
            echo '::error::Generated BoxWithLightSensor controller did not start.'
            exit 1
          fi

          if ! grep -Fq 'WEBEEBLOCKS_CI_BOX_LIGHT_SENSOR_BEHAVIOR_EXECUTED' "$LOG"; then
            echo '::error::Generated BoxWithLightSensor controller never reached its Blockly text_print behavior.'
            exit 1
          fi

          echo 'PASS: exact historical BoxWithLightSensor Blockly Python reached observable behavior under Webots R2025a with runtime networking disabled.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-light-sensor-r2025a
          path: ci-artifacts/
          if-no-files-found: error
