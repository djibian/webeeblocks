name: GP contrast candidate: native R2025a and Blockly non-Gate experiment
on:
  push:
    branches: [experiment/gp-contrast-pupil-main17671-20261026]
permissions:
  contents: read
jobs:
  blockly:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve unmodified original safety and educational algorithm
        shell: bash
        run: |
          set -euo pipefail
          base=7204975ad0d05b0fb2bcfe56e2690e225dfd9266
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- AGENTS.md docs/PRODUCT_VISION.md docs/ROADMAP.md tools/grand_prix/layout_u.py tools/grand_prix/oracle_u.py tools/ci/run_grand_prix_u_prototype.py
          sha256sum experiments/grand-prix-pupil-algorithm/Grand-Prix-sans-murs-algorithme-candidat.wbb
      - name: Real pupil Blockly and complete guard regressions
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node experiments/grand-prix-pupil-algorithm/verify_modular_stages.js
          node experiments/grand-prix-pupil-algorithm/verify_sensor_ambiguity.js
          node experiments/grand-prix-pupil-algorithm/verify_repeated_echo.js
          node experiments/grand-prix-pupil-algorithm/verify.js
          node tools/grand_prix/pupil_workspace_u.js
  native:
    needs: blockly
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare exact pupil WBB using production Blockly
        run: |
          npm ci --prefix plugins/robot_windows/blockly_v2
          node tools/grand_prix/pupil_workspace_u.js
      - name: Original Webots R2025a 16-case campaign
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/ci/run_grand_prix_u_prototype.py --suite all --seed 4 --side 2.0 2>&1 | tee gp-contrast-native.log
      - name: Archive native evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-contrast-pupil-native
          path: |
            gp-contrast-native.log
            ci-artifacts/grand-prix-u/
          if-no-files-found: warn
