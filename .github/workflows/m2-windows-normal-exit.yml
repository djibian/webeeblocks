# NON-GATE natural WM_CLOSE of genuine native Webots Windows and owned child controllers.
name: M2 Windows native normal exit (NON-GATE)
on:
  push:
    branches: [fix/665-m2-parent-safe-private-runtime-20261102]
    paths:
      - 'tools/ci/m2_windows_native_normal_exit.py'
      - '.github/workflows/m2-windows-normal-exit.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-normal-close:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install psutil==6.1.1
      - uses: actions/download-artifact@v4
        with:
          repository: djibian/webeeblocks
          run-id: 41450732733
          name: m2-windows-private-product-candidate
          path: frozen
          github-token: ${{ github.token }}
      - name: Verify exact ZIP and extract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='frozen/M2-private-product.zip'
          if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dc614c04ca10115a85d76ce6e5150bd9e7551f0fe8cd3937f7b24563ec9b72c8'){throw 'M2_WRONG_RELEASE'}
          $target=Join-Path $env:RUNNER_TEMP 'm2-real-close'
          Expand-Archive -LiteralPath $zip -DestinationPath $target
          "M2_PACKAGE=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare authenticated Mesa for native Windows Qt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'mesa3d-24.2.1-release-mingw.7z'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.2.1/mesa3d-24.2.1-release-mingw.7z' -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214'){throw 'M2_MESA_HASH'}
          $mesa=Join-Path $env:RUNNER_TEMP 'M2 CI Mesa'
          & 7z.exe x $archive "-o$mesa" -y
          if($LASTEXITCODE -ne 0){throw 'M2_MESA_EXTRACT'}
          Push-Location $mesa
          try{& .\systemwidedeploy.cmd 1;if($LASTEXITCODE -ne 0){throw 'M2_MESA_DEPLOY'}}finally{Pop-Location}
      - name: Native real GUI WM_CLOSE with full owned process identities
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '3.3'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $env:pythonLocation 'python.exe') tools/ci/m2_windows_native_normal_exit.py --package $env:M2_PACKAGE --output ci-artifacts/m2-win-native-close
          if($LASTEXITCODE -ne 0){throw 'M2_WINDOWS_NATURAL_NATIVE_EXIT_UNPROVEN'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-windows-normal-native-close-exact-release
          path: ci-artifacts/m2-win-native-close/
          retention-days: 90
          if-no-files-found: warn
