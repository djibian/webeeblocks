name: H6 G real native current buffer factorial pinned R2025a
on:
  push:
    branches: [experiment/h6-g-sufficiency-window-20261030]
    paths:
      - experiments/h6/g_window/core_g_patch.py
      - experiments/h6/g_window/core_qualify.py
      - .github/workflows/h6-g-sufficiency-core.yml
permissions:
  contents: read
concurrency:
  group: h6-g-sufficiency-core
  cancel-in-progress: true
jobs:
  factorial:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact pinned source and source-only G intervention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core-evidence/logs
          git rev-parse HEAD > core-evidence/experiment_sha.txt
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots 2>&1 | tee core-evidence/logs/clone.log
          git -C native-webots checkout --detach "$PIN"
          test "$(git -C native-webots rev-parse HEAD)" = "$PIN"
          git -C native-webots submodule update --init --recursive --jobs 4 2>&1 | tee core-evidence/logs/submodules.log
          git -C native-webots status --porcelain=v1 > core-evidence/prepatch-status.txt
          test ! -s core-evidence/prepatch-status.txt
          python3 experiments/h6/g_window/core_g_patch.py native-webots > core-evidence/logs/g-patch.log
          git -C native-webots diff --check
          git -C native-webots diff --binary HEAD > core-evidence/core-g-only.patch
          sha256sum core-evidence/core-g-only.patch > core-evidence/patch.sha256
          printf '%s\n' "$PIN" > core-evidence/webots_pin.txt
      - name: Install exact-source compilation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee core-evidence/logs/apt-update.log
          sudo apt-get install -y xvfb xauth python3 python-is-python3 2>&1 | tee core-evidence/logs/apt-xvfb.log
          (cd native-webots && sudo bash scripts/install/linux_compilation_dependencies.sh) 2>&1 | tee core-evidence/logs/compile-dependencies.log
      - name: Compile exact Webots pin with G env switch once
        shell: bash
        run: |
          set -euo pipefail
          (cd native-webots && make -j2) > core-evidence/logs/webots-build.log 2>&1 || {
            tail -n 150 core-evidence/logs/webots-build.log
            exit 1
          }
          test -x native-webots/bin/webots-bin
          sha256sum native-webots/bin/webots-bin > core-evidence/webots-bin.sha256
          find native-webots/lib -type f -name '*ode*.so*' -exec sha256sum '{}' ';' > core-evidence/physics-sha256.txt
          export WEBOTS_HOME="$PWD/native-webots"
          make -C experiments/h6/g_window/plugins/physics/h6_g_window > core-evidence/logs/plugin-build.log 2>&1 || {
            tail -n 120 core-evidence/logs/plugin-build.log
            exit 1
          }
          test -s experiments/h6/g_window/plugins/physics/h6_g_window/libh6_g_window.so
          sha256sum experiments/h6/g_window/plugins/physics/h6_g_window/libh6_g_window.so > core-evidence/plugin-sha256.txt
      - name: Run eight identical real Supervisor experiments A G R RG (global and node)
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE: '1'
        run: |
          set -euo pipefail
          export WEBOTS_HOME="$PWD/native-webots"
          for path in global node; do
            for arm in A G R RG; do
              g=0
              r=0
              if [ "$arm" = "G" ] || [ "$arm" = "RG" ]; then g=1; fi
              if [ "$arm" = "R" ] || [ "$arm" = "RG" ]; then r=1; fi
              spec="$path-$arm"
              mkdir -p "core-evidence/$spec"
              printf 'g=%s r=%s path=%s experiment=%s\n' "$g" "$r" "$path" "$(git rev-parse HEAD)" > "core-evidence/$spec/flags.txt"
              set +e
              H6_G_WINDOW_PATH="$path" H6_G_WINDOW_R="$r" H6_G_CORE="$g" H6_G_CORE_TRACE=1                 H6_G_WINDOW_NATIVE_LOG="$PWD/core-evidence/$spec/native.log"                 timeout -k 5s 90s xvfb-run -a -s '-screen 0 1280x800x24'                 "$WEBOTS_HOME/webots" --stdout --stderr --batch --mode=fast "$PWD/experiments/h6/g_window/worlds/h6_g_window.wbt"                 > "core-evidence/$spec/webots.log" 2>&1
              exit_code=$?
              set -e
              printf '%s\n' "$exit_code" > "core-evidence/$spec/exit_code.txt"
              echo "H6_CORE arm $spec exit=$exit_code"
              test "$exit_code" = 0 || exit 92
              test -s "core-evidence/$spec/native.log" || exit 93
            done
          done
          python3 experiments/h6/g_window/core_qualify.py core-evidence | tee core-evidence/logs/factorial-qualify.log
      - name: Retain complete evidence even on negative outcomes
        if: always()
        shell: bash
        run: |
          mkdir -p core-evidence
          if [ -d native-webots/.git ]; then
            git -C native-webots rev-parse HEAD > core-evidence/source-commit-observed.txt
            git -C native-webots diff --stat HEAD > core-evidence/native-diff-stat.txt
          fi
          find core-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > core-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-g-exact-pin-core-factorial-native
          path: core-evidence/
          if-no-files-found: error
