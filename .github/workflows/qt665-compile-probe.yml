name: QT665 pinned native object compilation probe (NON-GATE)
on:
  push:
    branches: [evidence/665-qt-compile-probe-20261026]
permissions:
  contents: read
jobs:
  object-compilation:
    name: Original versus patched R2025a C++ objects (no link)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          fetch-depth: 1
          persist-credentials: false
          path: upstream-webots
          sparse-checkout: |
            src/webots
            include
            resources/Makefile.os.include
          sparse-checkout-cone-mode: false
      - name: Source provenance (not compilation)
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/webots-qt-665/qualify_source_patch.py --webots-tree upstream-webots > qt665-source.json
      - name: Probe original and patched object compilation in exact official image
        shell: bash
        run: |
          set -Eeuo pipefail
          image='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          docker pull "$image"
          # Development-only overlay: add missing Ubuntu GL headers, retain original Qt ELF.
          docker build --pull=false -t qt665-devheaders - <<EOF
          FROM cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libassimp-dev libfreetype6-dev && rm -rf /var/lib/apt/lists/*
          EOF
          echo "ORIGINAL_IMAGE=$image;BUILD_IMAGE=qt665-devheaders;NOT_A_RUNTIME_RELEASE" > qt665-compiler.log
          image=qt665-devheaders
          docker run --rm -v "$PWD/upstream-webots:/source" -w /source "$image" bash -lc '
            set -Eeuo pipefail
            root=/usr/local/webots
            echo "compiler=$(command -v g++ || true)"
            g++ --version | head -n 1
            echo "qt_library_sha256:"
            sha256sum "$root/lib/webots/libQt6Widgets.so.6.5.3" "$root/lib/webots/libQt6Core.so.6.5.3"
            for part in QtCore QtGui QtWidgets QtNetwork QtWebSockets QtOpenGL QtOpenGLWidgets QtPrintSupport QtQml QtXml; do
              if test ! -d "$root/include/qt/$part"; then echo "MISSING_NATIVE_QT_HEADER:$part"; fi
            done
            dir=/source/src/webots
            include=(-I"$dir" -I/source/include -I"$root/include" -I"$root/include/qt")
            for p in app control core widgets editor engine gui maths nodes nodes/utils ode plugins scene_tree sound user_commands vrml util wren; do include+=(-I"$dir/$p"); done
            for part in QtCore QtGui QtWidgets QtNetwork QtWebSockets QtOpenGL QtOpenGLWidgets QtPrintSupport QtQml QtXml; do include+=(-I"$root/include/qt/$part"); done
            for p in wren ode controller/c; do include+=(-I"/source/include/$p"); done
            include+=(-I"$dir/external/siphash" -I/usr/include/freetype2)
            for spec in gui/WbMainWindow.cpp app/WbApplication.cpp; do
              echo "COMPILING:$spec"
              g++ -std=c++17 -DQT_NO_DEBUG -fPIC -c "${include[@]}" "$dir/$spec" -o "/source/$(basename "$spec" .cpp).o"
            done
            sha256sum /source/WbMainWindow.o /source/WbApplication.o
          ' >> qt665-compiler.log 2>&1
          cp qt665-compiler.log qt665-original.log
          git -C upstream-webots apply "$GITHUB_WORKSPACE/experiments/webots-qt-665/webots-r2025a-guarded-progress-retirement.patch"
          docker run --rm -v "$PWD/upstream-webots:/source" -w /source "$image" bash -lc '
            set -Eeuo pipefail
            root=/usr/local/webots
            dir=/source/src/webots
            include=(-I"$dir" -I/source/include -I"$root/include" -I"$root/include/qt")
            for p in app control core widgets editor engine gui maths nodes nodes/utils ode plugins scene_tree sound user_commands vrml util wren; do include+=(-I"$dir/$p"); done
            for part in QtCore QtGui QtWidgets QtNetwork QtWebSockets QtOpenGL QtOpenGLWidgets QtPrintSupport QtQml QtXml; do include+=(-I"$root/include/qt/$part"); done
            for p in wren ode controller/c; do include+=(-I"/source/include/$p"); done
            include+=(-I"$dir/external/siphash" -I/usr/include/freetype2)
            for spec in gui/WbMainWindow.cpp app/WbApplication.cpp; do
              echo "COMPILING_PATCHED:$spec"
              g++ -std=c++17 -DQT_NO_DEBUG -fPIC -c "${include[@]}" "$dir/$spec" -o "/source/$(basename "$spec" .cpp).o"
            done
            sha256sum /source/WbMainWindow.o /source/WbApplication.o
          ' >> qt665-compiler.log 2>&1
          tail -n 80 qt665-compiler.log
      - name: Execute pinned Qt 6.5.3 reentrant method-level tests (NOT full Webots)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 experiments/webots-qt-665/qt_guarded_method_harness.py \
            --patched-cpp upstream-webots/src/webots/gui/WbMainWindow.cpp \
            --output qt665-guarded-methods.cpp
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e QT_QPA_PLATFORM=offscreen qt665-devheaders bash -lc '
            set -Eeuo pipefail
            qt=/usr/local/webots
            echo "QTDIR=$qt"
            ls "$qt/lib/webots" | grep "Qt6Widgets" | head -n 3
            find "$qt" -name libqoffscreen.so -print
            export QT_QPA_PLATFORM_PLUGIN_PATH="$(dirname "$(find "$qt" -name libqoffscreen.so -print -quit)")"
            test -n "$QT_QPA_PLATFORM_PLUGIN_PATH"
            g++ -std=c++17 -fPIC -DQT_NO_DEBUG \
              -I"$qt/include/qt" -I"$qt/include/qt/QtCore" \
              -I"$qt/include/qt/QtGui" -I"$qt/include/qt/QtWidgets" \
              ./qt665-guarded-methods.cpp -L"$qt/lib/webots" \
              -Wl,-rpath,"$qt/lib/webots" \
              -lQt6Widgets -lQt6Gui -lQt6Core \
              -o ./qt665-guarded-methods
            ./qt665-guarded-methods
          ' 2>&1 | tee qt665-method-harness.log

      - name: Publish bounded compile evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt665-compile-probe-${{ github.sha }}
          path: |
            qt665-source.json
            qt665-compiler.log
            qt665-original.log
            qt665-method-harness.log
          if-no-files-found: warn
          retention-days: 14
