name: Crazyflie A/B perturbation matrix R2025a

on:
  push:
    branches: [webots-ci]
  pull_request:
    branches: [webots-ci]
    types: [opened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crazyflie-ab-matrix:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build backend A and backend B controllers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-ab-matrix
          for controller in crazyflie_square crazyflie_square_position; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-ab-matrix/build-${controller}.log"
          done

      - name: Run five common deterministic scenarios for A and B
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/run_crazyflie_ab_matrix.py

      - name: Publish matrix summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-artifacts/crazyflie-ab-matrix/matrix.md ]; then
            cat ci-artifacts/crazyflie-ab-matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload A/B diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-ab-perturbation-r2025a
          path: ci-artifacts/crazyflie-ab-matrix/
          if-no-files-found: error
