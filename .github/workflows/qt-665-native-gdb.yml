# Isolated scientific probe #665: one real Webots R2025a process, NOT CI Gate.
name: Qt 665 native GDB discriminator
on:
  push:
    branches: [evidence/665-native-gdb-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: qt-665-native-gdb-evidence
  cancel-in-progress: true
jobs:
  native-qt-lifetime:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unchanged Webots world support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/qt665-native-gdb
          python3 -m py_compile experiments/qt-progress-lifetime-665/native-gdb/run_qualification.py
          ./tools/prepare_runtime_v2.sh
          git clone --depth=1 --filter=blob:none --sparse --branch R2025a https://github.com/cyberbotics/webots.git .ci-qt665-webots-src
          git -C .ci-qt665-webots-src sparse-checkout set projects/robots/bitcraze/crazyflie projects/objects/backgrounds projects/objects/floors projects/appearances projects/default
          test "$(git -C .ci-qt665-webots-src rev-parse HEAD)" = c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          echo "subject_head=$GITHUB_SHA" > ci-artifacts/qt665-native-gdb/github-provenance.txt
          echo "runner=$RUNNER_OS $RUNNER_ARCH" >> ci-artifacts/qt665-native-gdb/github-provenance.txt
      - name: Acquire native Qt lifetime on exactly one world
        shell: bash
        run: |
          set -euo pipefail
          image='cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099'
          docker pull "$image"
          docker run --rm --init \
            --entrypoint /bin/bash \
            -e WEBOTS_HOME=/usr/local/webots \
            -e QT665_EXPECTED_IMAGE="$image" \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-qt665-webots-src/projects:/usr/local/webots/projects:ro" \
            -w /workspace "$image" -c '
              set -euo pipefail
              mkdir -p ci-artifacts/qt665-native-gdb
              dpkg-query -W > ci-artifacts/qt665-native-gdb/packages-before.txt
              export DEBIAN_FRONTEND=noninteractive
              (timeout 90s apt-get update && timeout 90s apt-get install -y --no-install-recommends --no-remove gdb) \
                > ci-artifacts/qt665-native-gdb/debugger-install.log 2>&1 || {
                  echo "GDB_PREPARATION_FAILED (see debugger-install.log)"
                  exit 31
                }
              dpkg-query -W > ci-artifacts/qt665-native-gdb/packages-after.txt
              python3 -u experiments/qt-progress-lifetime-665/native-gdb/run_qualification.py
            '
      - name: Upload bounded text and ELF provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-665-native-gdb
          path: ci-artifacts/qt665-native-gdb/
          if-no-files-found: error
          retention-days: 30
