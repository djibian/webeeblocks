name: Webots R2025a smoke test

on:
  push:
    branches:
      - webots-ci
  pull_request:
    branches:
      - webots-ci
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: webots-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webots-smoke:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate historical Blockly programs
        run: python3 tools/ci/check_historical_blockly_programs.py

      - name: Execute historical Blockly browser oracle
        run: python3 tools/ci/run_historical_blockly_oracle.py

      - name: Prepare diagnostics directory
        run: mkdir -p ci-artifacts

      - name: Validate Robot Window JavaScript
        shell: bash
        run: |
          node --check plugins/robot_windows/blockly/main.js
          if grep -Fq 'webots.window(' plugins/robot_windows/blockly/main.js; then
            echo "::error::Legacy Robot Window API is still present."
            exit 1
          fi

      - name: Validate camera generator API
        shell: bash
        run: |
          CAMERA=plugins/robot_windows/blockly/google-blockly-31ee4ea/generators/python/camera.js
          node --check "$CAMERA"
          if grep -Eq '\.get_(position|colors)\(' "$CAMERA"; then
            echo "::error::Legacy CameraRecognitionObject snake_case API is still present."
            exit 1
          fi

      - name: Validate restart smoke helpers
        run: python3 -m py_compile controllers/ci_restart_supervisor/*.py

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Rebuild and exercise Blockly sidecar protocol
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/supervisor/blocklyServer \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libboost-dev python3-pip && python3 -m pip install --no-cache-dir websockets==10.4 && rm -f blocklyServer && make && python3 protocol_smoke.py && python3 execution_smoke.py prepare' \
            2>&1 | tee ci-artifacts/blockly-server-protocol.log

      - name: Rebuild supervisor for Webots R2025a
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/supervisor \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/supervisor-build.log

      - name: Run historical empty world in Webots R2025a
        shell: bash
        run: |
          set +e
          set -o pipefail

          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 30s xvfb-run -a webots \
              --stdout \
              --stderr \
              --batch \
              --mode=fast \
              /workspace/worlds/empty.wbt' \
            2>&1 | tee ci-artifacts/webots-empty.log

          code=${PIPESTATUS[0]}
          set -e

          echo "$code" | tee ci-artifacts/webots-exit-code.txt
          echo "Webots exit code: $code"

          # 124 = timeout normal.
          # 137 = Webots had to be killed after the diagnostic window.
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "Webots remained alive for the diagnostic window."
            exit 0
          fi

          exit "$code"

      - name: Restore historical robot controller
        if: always()
        run: python3 controllers/supervisor/blocklyServer/execution_smoke.py restore

      - name: Validate Webots runtime diagnostics
        shell: bash
        run: |
          LOG=ci-artifacts/webots-empty.log

          if grep -Fq 'has different size in shared object' "$LOG"; then
            echo "::error::Supervisor ABI mismatch detected."
            grep -F 'has different size in shared object' "$LOG"
            exit 1
          fi

          if grep -Fq 'ERROR: Missing declaration for' "$LOG"; then
            echo "::error::World still has unresolved EXTERNPROTO declarations."
            grep -F 'ERROR: Missing declaration for' "$LOG"
            exit 1
          fi

          if ! grep -Fq 'INFO: supervisor: Starting controller:' "$LOG"; then
            echo "::error::Supervisor controller did not start."
            exit 1
          fi

          if ! grep -Fq 'INFO: my_controller: Starting controller:' "$LOG"; then
            echo "::error::Historical robot controller did not start."
            exit 1
          fi

          if ! grep -Fq 'WEBEEBLOCKS_CI_SUBMITTED_CONTROLLER_EXECUTED' "$LOG"; then
            echo "::error::Controller installed through historical SEND_CODE was not executed by Webots."
            exit 1
          fi

          echo 'PASS: R2025a started both controllers and executed code installed through SEND_CODE.'

      - name: Export historical BoxWithDistSensor controller
        shell: bash
        run: |
          cp controllers/my_controller/my_controller.py controllers/my_controller/.ci-controller-backup.py
          python3 tools/ci/export_historical_blockly_program.py \
            BoxWithDistSensor.xml \
            controllers/my_controller/my_controller.py

      - name: Execute generated historical controller in box challenge
        shell: bash
        run: |
          set +e
          set -o pipefail

          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 30s xvfb-run -a webots \
              --stdout \
              --stderr \
              --batch \
              --mode=fast \
              /workspace/worlds/boxChallenge.wbt' \
            2>&1 | tee ci-artifacts/webots-box-challenge.log

          code=${PIPESTATUS[0]}
          set -e
          echo "$code" | tee ci-artifacts/webots-box-challenge-exit-code.txt

          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo 'Generated historical controller remained active for the diagnostic window.'
            exit 0
          fi
          exit "$code"

      - name: Restore controller after box challenge
        if: always()
        shell: bash
        run: |
          if [ -f controllers/my_controller/.ci-controller-backup.py ]; then
            mv controllers/my_controller/.ci-controller-backup.py controllers/my_controller/my_controller.py
          fi

      - name: Validate generated historical controller diagnostics
        shell: bash
        run: |
          LOG=ci-artifacts/webots-box-challenge.log

          if grep -Fq 'ERROR:' "$LOG"; then
            echo '::error::Webots emitted an error in boxChallenge.wbt.'
            grep -F 'ERROR:' "$LOG"
            exit 1
          fi

          if grep -Fq 'Traceback (most recent call last)' "$LOG"; then
            echo '::error::Generated historical Blockly Python raised an exception.'
            grep -A20 -F 'Traceback (most recent call last)' "$LOG"
            exit 1
          fi

          if ! grep -Fq 'INFO: supervisor: Starting controller:' "$LOG"; then
            echo '::error::Supervisor did not start in boxChallenge.wbt.'
            exit 1
          fi

          if ! grep -Fq 'INFO: my_controller: Starting controller:' "$LOG"; then
            echo '::error::Generated historical controller did not start in boxChallenge.wbt.'
            exit 1
          fi

          echo 'PASS: Blockly-generated BoxWithDistSensor Python started in boxChallenge.wbt under R2025a without Webots or Python runtime errors.'

      - name: Prepare controller restart smoke fixture
        run: python3 controllers/ci_restart_supervisor/restart_smoke.py prepare

      - name: Exercise simulation reset and controller restart
        shell: bash
        run: |
          set +e
          set -o pipefail

          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 30s xvfb-run -a webots \
              --stdout \
              --stderr \
              --batch \
              --mode=fast \
              /workspace/worlds/ci_restart_smoke.wbt' \
            2>&1 | tee ci-artifacts/webots-restart.log

          code=${PIPESTATUS[0]}
          set -e
          echo "$code" | tee ci-artifacts/webots-restart-exit-code.txt

          if [ "$code" -ne 0 ]; then
            echo "::error::Restart smoke Webots run exited with code $code."
            exit "$code"
          fi

      - name: Restore restart smoke fixtures
        if: always()
        run: python3 controllers/ci_restart_supervisor/restart_smoke.py restore

      - name: Validate controller restart diagnostics
        shell: bash
        run: |
          LOG=ci-artifacts/webots-restart.log

          for marker in \
            WEBEEBLOCKS_CI_RESTART_SUPERVISOR_STARTED \
            WEBEEBLOCKS_CI_RESTART_INITIAL \
            WEBEEBLOCKS_CI_RESTARTED_CONTROLLER; do
            if ! grep -Fq "$marker" "$LOG"; then
              echo "::error::Restart smoke marker missing: $marker"
              exit 1
            fi
          done

          if grep -Fq 'ERROR:' "$LOG"; then
            echo "::error::Webots emitted an error during restart smoke."
            grep -F 'ERROR:' "$LOG"
            exit 1
          fi

          echo 'PASS: simulationReset + restartController reloaded the updated Python controller in R2025a.'

      - name: Upload Webots diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webots-r2025a-smoke-logs
          path: ci-artifacts/
          if-no-files-found: error
