name: V5 Review Rollback H1

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate-and-block:
    name: CI Gate
    runs-on: ubuntu-22.04
    steps:
      - name: Publish one blocking review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg sha "$HEAD_SHA"             '{commit_id:$sha, body:"V5 rollback experiment R: REQUEST_CHANGES on H1.", event:"REQUEST_CHANGES"}')
          curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/pulls/$PR/reviews"             -d "$payload"
