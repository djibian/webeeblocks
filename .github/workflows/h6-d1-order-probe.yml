name: H6 D1 source-pinned ODE broadphase orientation probe
on:
  push:
    branches: [experiment/h6-d1-broadphase-order-20261031]
    paths:
      - 'experiments/h6_d1_order/**'
      - '.github/workflows/h6-d1-order-probe.yml'
permissions:
  contents: read
jobs:
  ode-order:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clone exact ODE pin and record provenance
        run: |
          set -euo pipefail
          mkdir -p evidence/d1-order/logs
          git rev-parse HEAD > evidence/d1-order/reviewer-commit.txt
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots \
            > evidence/d1-order/logs/clone.log 2>&1
          git -C native-webots checkout --detach "$PIN" > evidence/d1-order/logs/checkout.log 2>&1
          git -C native-webots submodule update --init --recursive --jobs 4 > evidence/d1-order/logs/submodules.log 2>&1
          test "$(git -C native-webots rev-parse HEAD)" = "$PIN"
          sha256sum experiments/h6_d1_order/ode_order_probe.cpp > evidence/d1-order/source.sha256
      - name: Compile pinned libode and test AABB ordering only
        run: |
          set -euo pipefail
          export WEBOTS_HOME="$PWD/native-webots"
          make -C native-webots/src/ode -j2 release > evidence/d1-order/logs/ode-build.log 2>&1 || {
            tail -n 100 evidence/d1-order/logs/ode-build.log; exit 1;
          }
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -pthread \
            -I native-webots/include/ode experiments/h6_d1_order/ode_order_probe.cpp \
            -L "$PWD/native-webots/lib/webots" -Wl,-rpath,"$PWD/native-webots/lib/webots" \
            -lode -o evidence/d1-order/ode-order-probe
          sha256sum native-webots/lib/webots/libode.so evidence/d1-order/ode-order-probe \
            > evidence/d1-order/binaries.sha256
          LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 40s \
            evidence/d1-order/ode-order-probe > evidence/d1-order/ode-output.txt \
            2> evidence/d1-order/logs/ode-stderr.log
          grep -Fxq H6_ODE_ORDER_HYPOTHESIS_PASS evidence/d1-order/ode-output.txt
          cat evidence/d1-order/ode-output.txt
      - name: Preserve original data on PASS or RED
        if: always()
        run: |
          mkdir -p evidence/d1-order/logs
          find evidence/d1-order -type f ! -name SHA256SUMS.txt -print0 | sort -z \
            | xargs -0 -r sha256sum > evidence/d1-order/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-d1-ode-broadphase-order-source-pinned
          path: evidence/d1-order/
          retention-days: 90
          if-no-files-found: error
