name: Governance state contract G1

on:
  pull_request:
    branches: [webots-ci]
    paths:
      - 'governance/**'
      - 'tools/governance/**'
      - '.github/workflows/governance-state-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-state-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate G1 machine-readable contract and causal incidents
        run: |
          set -euo pipefail
          cd tools/governance
          python3 -m unittest -v test_state_contract.py

      - name: Fetch canonical #22 state read-only
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              "https://api.github.com/repos/djibian/webeeblocks/issues/22",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "webeeblocks-governance-g1",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          body = payload.get("body")
          if not isinstance(body, str) or not body.strip():
              raise SystemExit("CANONICAL_ISSUE_22_BODY_MISSING")
          Path("/tmp/issue22.md").write_text(body, encoding="utf-8")
          PY

      - name: Render canonical exact PR/head state and validate live observation
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST: '#${{ github.event.pull_request.number }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_STATUS: "${{ github.event.pull_request.draft && 'draft' || 'ready' }}"
          LAST_PROGRESS_AT: '${{ github.event.pull_request.updated_at }}'
        run: |
          set -euo pipefail
          python3 tools/governance/render_state.py \
            --template governance/state.template.json \
            --canonical-body /tmp/issue22.md \
            --output /tmp/governance-state.json \
            --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" \
            --pr-status "$PR_STATUS" \
            --last-progress-at "$LAST_PROGRESS_AT"
          PYTHONPATH=tools/governance python3 - "$PULL_REQUEST" "$HEAD_SHA" "$PR_STATUS" <<'PY'
          import sys
          from state_contract import Observation, assert_coherent, load

          pr, head, status = sys.argv[1:]
          state = load('/tmp/governance-state.json')
          ci_green = state["ci_state"]["status"] == "GREEN"
          assert_coherent(state, Observation(
              pr_number=pr,
              pr_head_sha=head,
              pr_status=status,
              ci_green=ci_green,
              engineering_executed=False,
              progress_made=False,
              mutation_possible=True,
          ))
          handoff = state["engineering_handoff"]["status"]
          verdict = state["verification_verdict"]["status"]
          print(
              "GOVERNANCE_STATE_OK "
              f"pr={pr} head={head} status={status} "
              f"stage={state['stage']} role={state['expected_role']} "
              f"handoff={handoff} verdict={verdict} ci={state['ci_state']['status']}"
          )
          PY
