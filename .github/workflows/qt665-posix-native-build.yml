# One native compilation of an exact Webots R2025a upstream source patch.
# Evidence branch only; not product adoption, no CI Gate, no hardware.
name: Qt665 POSIX self-pipe native full link NON-GATE
on:
  push:
    branches:
      - evidence/665-posix-signal-compiled-native-20261029
permissions:
  contents: read
jobs:
  exact-source-native-full-link:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          path: upstream-webots
          persist-credentials: false
          sparse-checkout: |
            src
            include
            lib
            bin
            resources
          submodules: recursive
      - name: Verify exact POSIX patch and inherited #701 build mechanism
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C upstream-webots rev-parse HEAD)" = c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          test "$(git -C upstream-webots hash-object src/webots/gui/main.cpp)" = d578afa7cbd27ea13fd9ca0583f5e12170c6fba3
          echo 'e9a6d9365011e55fe853fea1026d9b83be097feb4ba9a4759639fe75796f54b8  experiments/qt665-posix-signal-safe/webots-r2025a-posix-quit-selfpipe.patch' | sha256sum -c -
          git -C upstream-webots apply --check "$GITHUB_WORKSPACE/experiments/qt665-posix-signal-safe/webots-r2025a-posix-quit-selfpipe.patch"
          python3 experiments/qt665-posix-signal-safe/qualify_signal_safe_source.py --upstream-tree upstream-webots
          mkdir -p ci-artifacts/qt665-posix-native-build
          git rev-parse HEAD > ci-artifacts/qt665-posix-native-build/evidence-head.txt
          git -C upstream-webots rev-parse HEAD > ci-artifacts/qt665-posix-native-build/upstream-head.txt
      - name: Compile and link actual patched Webots C++ with pinned Qt6.5.3
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull=false -t qt665-posix-dev - <<'DOCKER'
          FROM cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgl-dev libglu1-mesa-dev libassimp-dev libfreetype6-dev libopenal-dev git python3-pip curl xauth xvfb libxcb-cursor0 gdb bzip2 && rm -rf /var/lib/apt/lists/*
          RUN pip3 install aqtinstall==3.1.18 && aqt install-qt --outputdir /opt/Qt linux desktop 6.5.3 gcc_64 -m qtwebsockets
          DOCKER
          docker image inspect qt665-posix-dev > ci-artifacts/qt665-posix-native-build/build-image.json
          docker run --rm -v "$PWD:/workspace" -w /workspace qt665-posix-dev \
            bash experiments/webots-qt-665/build_full_application.sh \
            upstream-webots ci-artifacts/qt665-posix-native-build \
            2>&1 | tee ci-artifacts/qt665-posix-native-build/build.log
          test -s ci-artifacts/qt665-posix-native-build/webots-bin
          test -s ci-artifacts/qt665-posix-native-build/launcher-version.txt
          test -s ci-artifacts/qt665-posix-native-build/applied-posix-main.patch
          echo 'QT665_POSIX_NATIVE_COMPILE_LINK=PASS' > ci-artifacts/qt665-posix-native-build/RESULT.txt
          echo 'SIGNAL_CALLBACK_LIVE=NOT_TESTED' >> ci-artifacts/qt665-posix-native-build/RESULT.txt
          echo 'ROOT_CAUSE_QT665=UNPROVEN' >> ci-artifacts/qt665-posix-native-build/RESULT.txt
      - name: Preserve native binary and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt665-posix-native-${{ github.sha }}
          path: ci-artifacts/qt665-posix-native-build/
          if-no-files-found: warn
          retention-days: 14
