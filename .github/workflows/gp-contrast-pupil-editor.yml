name: 'GP contrast: real Chromium WBB edit/Save/Open non-Gate'
on:
  push:
    branches: [experiment/gp-contrast-pupil-main17671-20261026]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check unchanged exact pupil source and limited proof files
        shell: bash
        run: |
          set -euo pipefail
          base=7204975ad0d05b0fb2bcfe56e2690e225dfd9266
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- tools/grand_prix/oracle_u.py tools/grand_prix/layout_u.py tools/ci/run_grand_prix_u_prototype.py AGENTS.md docs/PRODUCT_VISION.md docs/ROADMAP.md
      - name: Install production Blockly and Chromium driver
        run: |
          bash tools/prepare_runtime_v2.sh
          npm install --prefix .ci-gp-ui --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          command -v google-chrome || command -v chromium
      - name: Inspect UNTOUCHED WBB for overlap, mouse edit, Save/Open and debugging
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/gp-contrast-original-wbb-ui
          WEBEEBLOCKS_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/.ci-gp-ui/node_modules/playwright/index.mjs" \
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" \
          WEBEEBLOCKS_UI_OUTPUT="$GITHUB_WORKSPACE/ci-artifacts/gp-contrast-original-wbb-ui" \
          node experiments/grand-prix-pupil-algorithm/probe_browser_ui_contrast.mjs 2>&1 | tee ci-artifacts/gp-contrast-original-wbb-ui/ui.log
      - name: Preserve screenshot, metrics and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-contrast-wbb-visual-debug-evidence
          path: ci-artifacts/gp-contrast-original-wbb-ui/
          if-no-files-found: warn
