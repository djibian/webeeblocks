name: Crazyflie Blockly strategy timing R2025a

on:
  pull_request:
    branches: [webots-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-timing:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate student-grid fixtures and harness
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/robot_windows/blockly/main.js
          python3 -m py_compile tools/ci/prepare_crazyflie_parametric_obstacle.py
          python3 -m py_compile tools/ci/runtime_wwi_event_server.py
          python3 - <<'PY'
          from pathlib import Path
          reference = Path('controllers/Blockly_Programs/CrazyflieL.xml').read_text()
          shortcut = Path('controllers/Blockly_Programs/CrazyflieShortcut85.xml').read_text()
          assert reference != shortcut
          assert '<field name="DISTANCE">1</field>' in shortcut
          assert '<field name="ANGLE">85</field>' in shortcut
          assert '0.91' not in shortcut and '84.857' not in shortcut and '1.004' not in shortcut
          print('PASS: both strategies are representable on the current student grid (0.1 m, 1 degree).')
          PY

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build unchanged runtime and collision observer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-strategy-timing
          for controller in crazyflie_l_course crazyflie_collision_observer; do
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w "/workspace/controllers/${controller}" \
              cyberbotics/webots:R2025a-ubuntu22.04 \
              bash -lc 'make clean && make' \
              2>&1 | tee "ci-artifacts/crazyflie-strategy-timing/build-${controller}.log"
          done
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-strategy-timing/controller-before.sha256

      - name: Run both Blockly strategies in fresh Webots processes
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_wwi_browser.sh
              mkdir -p /root/.config/Cyberbotics
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_wwi_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              cp /workspace/plugins/robot_windows/blockly/blockly.html /tmp/blockly.original.html
              restore_html() { cp /tmp/blockly.original.html /workspace/plugins/robot_windows/blockly/blockly.html; }
              trap restore_html EXIT

              run_strategy() {
                label="$1"
                fixture="$2"
                out="/workspace/ci-artifacts/crazyflie-strategy-timing/${label}"
                mkdir -p "$out"
                restore_html
                python3 /workspace/tools/ci/prepare_crazyflie_parametric_obstacle.py "$fixture" --expect-done
                rm -f /workspace/ci-artifacts/crazyflie-l-course-result.txt
                rm -f /workspace/ci-artifacts/crazyflie-runtime-mission-result.txt
                rm -f /workspace/ci-artifacts/crazyflie-obstacle-contact.txt
                rm -f "$out/events.jsonl"

                python3 /workspace/tools/ci/runtime_wwi_event_server.py --output "$out/events.jsonl" &
                event_pid=$!
                xvfb-run -a webots --stdout --stderr --batch --mode=realtime \
                  /workspace/worlds/crazyflie_runtime_obstacle.wbt > "$out/webots.log" 2>&1 &
                webots_pid=$!
                complete=0
                for i in $(seq 1 1000); do
                  if grep -Fq "STATE_AFTER_RUNTIME_READY" "$out/events.jsonl" 2>/dev/null; then
                    complete=1
                    break
                  fi
                  if grep -Fq "\"event\":\"ERROR\"" "$out/events.jsonl" 2>/dev/null; then
                    cat "$out/events.jsonl"
                    kill "$webots_pid" "$event_pid" 2>/dev/null || true
                    exit 1
                  fi
                  if ! kill -0 "$webots_pid" 2>/dev/null; then
                    cat "$out/webots.log"
                    kill "$event_pid" 2>/dev/null || true
                    exit 1
                  fi
                  sleep 0.1
                done
                kill "$webots_pid" "$event_pid" 2>/dev/null || true
                wait "$webots_pid" 2>/dev/null || true
                wait "$event_pid" 2>/dev/null || true
                pkill -f google-chrome 2>/dev/null || true

                if [ "$complete" -ne 1 ]; then
                  echo "Strategy $label did not reach RUNTIME_READY"
                  cat "$out/events.jsonl" 2>/dev/null || true
                  cat "$out/webots.log"
                  exit 1
                fi
                grep -Fq "WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS" "$out/webots.log"
                ! grep -Fq "WEBEEBLOCKS_OBSTACLE_RESULT status=COLLISION" "$out/webots.log"
                test -s /workspace/ci-artifacts/crazyflie-l-course-result.txt
                grep -Fq "status=success gates=2" /workspace/ci-artifacts/crazyflie-l-course-result.txt
                cp /workspace/ci-artifacts/crazyflie-l-course-result.txt "$out/course-result.txt"
                if test -s /workspace/ci-artifacts/crazyflie-obstacle-contact.txt; then
                  cp /workspace/ci-artifacts/crazyflie-obstacle-contact.txt "$out/obstacle-contact.txt"
                fi
              }

              run_strategy S0 controllers/Blockly_Programs/CrazyflieL.xml
              run_strategy S1 controllers/Blockly_Programs/CrazyflieShortcut85.xml
            '

      - name: Compare physical success and Webots times
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('ci-artifacts/crazyflie-strategy-timing')
          expected_blocks = {
              'S0': ['webeeblocks_forward:1', 'webeeblocks_turn:90', 'webeeblocks_forward:1'],
              'S1': ['webeeblocks_forward:1', 'webeeblocks_turn:85', 'webeeblocks_forward:1'],
          }
          elapsed = {}
          summary = {}
          for label in ('S0', 'S1'):
              out = root / label
              log = (out / 'webots.log').read_text()
              events = [json.loads(line) for line in (out / 'events.jsonl').read_text().splitlines() if line.strip()]
              assert not any(e['event'] == 'ERROR' for e in events), (label, events)
              blocks = [e['detail'] for e in events if e['event'] == 'BLOCKS'][-1]
              for token in expected_blocks[label]:
                  assert token in blocks, (label, token, blocks)
              assert any(e['event'] == 'STATE_AFTER_RUNTIME_READY' for e in events), (label, events)
              matches = re.findall(r'WEBEEBLOCKS_CHALLENGE_V1 RESULT SUCCESS elapsed=([0-9.]+)', log)
              assert matches, (label, log[-4000:])
              elapsed[label] = float(matches[-1])
              result = (out / 'course-result.txt').read_text().strip()
              assert 'status=success' in result and 'gates=2' in result, (label, result)
              summary[label] = {'elapsed_s': elapsed[label], 'course_result': result, 'blocks': blocks}

          delta = elapsed['S0'] - elapsed['S1']
          assert delta > 0.0, f'grid-valid shortcut was not faster: S0={elapsed["S0"]:.3f}s S1={elapsed["S1"]:.3f}s'
          summary['comparison'] = {'S0_minus_S1_s': delta, 'faster': 'S1'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n')
          print(f'PASS: both Blockly strategies physically succeeded; S0={elapsed["S0"]:.3f}s, S1={elapsed["S1"]:.3f}s, gain={delta:.3f}s.')
          PY
          sha256sum controllers/crazyflie_l_course/crazyflie_l_course \
            | tee ci-artifacts/crazyflie-strategy-timing/controller-after.sha256
          cmp ci-artifacts/crazyflie-strategy-timing/controller-before.sha256 \
              ci-artifacts/crazyflie-strategy-timing/controller-after.sha256

      - name: Upload strategy timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-strategy-timing-r2025a
          path: ci-artifacts/crazyflie-strategy-timing/
          if-no-files-found: error
