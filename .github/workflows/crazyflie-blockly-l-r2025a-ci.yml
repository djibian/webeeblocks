name: Crazyflie Blockly L-course R2025a

on:
  pull_request:
    branches: [webots-ci]
    types: [ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crazyflie-blockly-l:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact semantic mission from real Blockly 2020
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/crazyflie-blockly-l
          python3 tools/ci/run_crazyflie_blockly_l_mission.py \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/blockly-mission.log
          cat ci-artifacts/crazyflie-blockly-l/mission.json

      - name: Pull official Webots R2025a image
        run: docker pull cyberbotics/webots:R2025a-ubuntu22.04

      - name: Build existing shared STOP L-course executor with Blockly mission
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/crazyflie_l_course \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'make clean && make' \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/build.log

      - name: Execute Blockly-derived L mission in Webots R2025a
        shell: bash
        run: |
          set -o pipefail
          rm -f ci-artifacts/crazyflie-l-course-result.txt
          set +e
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'timeout -k 5s 90s xvfb-run -a webots --stdout --stderr --batch --mode=fast /workspace/worlds/crazyflie_l_course.wbt' \
            2>&1 | tee ci-artifacts/crazyflie-blockly-l/webots.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-artifacts/crazyflie-blockly-l/exit-code.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::Blockly-derived L-course Webots run exited with $code"
            exit 1
          fi

      - name: Validate semantic equality and STOP reference behavior
        shell: bash
        run: |
          set -o pipefail
          RESULT=ci-artifacts/crazyflie-l-course-result.txt
          LOG=ci-artifacts/crazyflie-blockly-l/webots.log
          test -s "$RESULT"
          cat "$RESULT" | tee ci-artifacts/crazyflie-blockly-l/result.txt
          grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=success gates=2' "$RESULT"
          ! grep -Fq 'WEBEEBLOCKS_CF_L_RESULT status=failure' "$RESULT"
          ! grep -Fq 'ERROR:' "$LOG"
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path

          mission = json.loads(Path('ci-artifacts/crazyflie-blockly-l/mission.json').read_text())
          expected = [
              ('TAKEOFF', 1.0),
              ('FORWARD', 1.0),
              ('TURN', math.pi / 2.0),
              ('FORWARD', 1.0),
              ('LAND', 0.0),
          ]
          assert len(mission) == len(expected)
          for got, (kind, value) in zip(mission, expected):
              assert got['type'] == kind, (got, kind)
              assert math.isclose(float(got['value']), value, rel_tol=0.0, abs_tol=1e-12), (got, value)

          line = Path('ci-artifacts/crazyflie-l-course-result.txt').read_text().strip()
          pairs = dict(re.findall(r'([A-Za-z0-9_]+)=([^\s]+)', line))
          assert pairs.get('status') == 'success'
          assert pairs.get('gates') == '2'
          g1 = float(pairs['g1_time'])
          g2 = float(pairs['g2_time'])
          endpoint = float(pairs['endpoint_error_xy'])
          yaw = float(pairs['yaw_error_deg'])
          total = float(pairs['total_s'])
          # R2025a's 32 ms timestep makes a ±20 ms time oracle artificially tighter
          # than one simulation step. Geometry/order/STOP remain the strong oracle.
          assert abs(g1 - 12.287) <= 0.10, g1
          assert abs(g2 - 21.315) <= 0.10, g2
          assert endpoint <= 0.02, endpoint
          assert yaw <= 2.0, yaw
          assert abs(total - 26.144) <= 0.10, total
          print('PASS: real Blockly semantic L mission reached G1, G2 and landing through shared STOP executor.')
          PY

      - name: Publish Blockly L result
        if: always()
        shell: bash
        run: |
          echo '## Blockly → semantic mission → shared STOP executor' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-artifacts/crazyflie-blockly-l/mission.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ci-artifacts/crazyflie-blockly-l/mission.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ci-artifacts/crazyflie-l-course-result.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat ci-artifacts/crazyflie-l-course-result.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazyflie-blockly-l-r2025a
          path: |
            ci-artifacts/crazyflie-blockly-l/
            ci-artifacts/crazyflie-l-course-result.txt
          if-no-files-found: error
