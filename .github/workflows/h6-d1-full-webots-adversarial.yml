name: H6 independent D1 full Webots foreign body deletion
on:
  push:
    branches: [experiment/h6-d1-foreign-asleep-discriminant-20261031]
    paths:
      - experiments/h6_d1_adversarial/**
      - .github/workflows/h6-d1-full-webots-adversarial.yml
permissions:
  contents: read
concurrency:
  group: h6-d1-foreign-asleep-discriminant-20261031
  cancel-in-progress: true
jobs:
  full-webots:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
      CANDIDATE: 8d8d644b2bc6d5821572d87d474e59f533ec3260
      QT_QPA_PLATFORM: xcb
      WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 18
          persist-credentials: false
      - name: Pinned Webots and non-mutating D1 observer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/d1/logs
          git rev-parse HEAD > evidence/d1/reviewer-commit.txt
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          python3 -m py_compile experiments/h6_d1_adversarial/instrument_d1.py \
            experiments/h6_d1_adversarial/instrument_asleep.py \
            experiments/h6_d1_adversarial/qualify_asleep.py \
            experiments/h6_d1_adversarial/controllers/h6_d1_real_remove/h6_d1_real_remove.py
          find experiments/h6_d1_adversarial -type f ! -path '*/__pycache__/*' -print0 \
            | sort -z | xargs -0 sha256sum > evidence/d1/reviewer-sources.sha256
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots \
            > evidence/d1/logs/clone.log 2>&1
          git -C native-webots checkout --detach "$PIN" > evidence/d1/logs/checkout.log 2>&1
          git -C native-webots submodule update --init --recursive --jobs 4 \
            > evidence/d1/logs/submodules.log 2>&1
          test "$(git -C native-webots rev-parse HEAD)" = "$PIN"
          test -z "$(git -C native-webots status --porcelain)"
          git -C native-webots rev-parse HEAD > evidence/d1/native-pin.txt
          python3 experiments/h6_d1_adversarial/instrument_asleep.py native-webots > evidence/d1/logs/patch.log
          git -C native-webots diff --check
          git -C native-webots diff --binary HEAD > evidence/d1/instrumented.patch
          sha256sum evidence/d1/instrumented.patch > evidence/d1/instrumented.patch.sha256
      - name: Build native Webots and read-only A sleep plugin
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update > evidence/d1/logs/apt-update.log 2>&1
          sudo apt-get install -y xvfb xauth python3 python-is-python3 > evidence/d1/logs/apt-core.log 2>&1
          (cd native-webots && sudo bash scripts/install/linux_compilation_dependencies.sh) \
            > evidence/d1/logs/apt-build.log 2>&1 || {
              tail -n 110 evidence/d1/logs/apt-build.log; exit 1;
            }
          (cd native-webots && make -j2) > evidence/d1/logs/webots-build.log 2>&1 || {
            tail -n 110 evidence/d1/logs/webots-build.log; exit 1;
          }
          sha256sum native-webots/bin/webots-bin native-webots/lib/webots/libode.so \
            > evidence/d1/binaries.sha256
          export WEBOTS_HOME="$PWD/native-webots"
          make -C experiments/h6_d1_adversarial/plugins/physics/h6_d1_owner_sleep \
            > evidence/d1/logs/plugin-build.log 2>&1 || {
              tail -n 100 evidence/d1/logs/plugin-build.log; exit 1;
            }
          sha256sum experiments/h6_d1_adversarial/plugins/physics/h6_d1_owner_sleep/libh6_d1_owner_sleep.so \
            > evidence/d1/plugin-binary.sha256
      - name: Two real native arms — observed control and adversarial teardown intervention
        shell: bash
        run: |
          set -euo pipefail
          export WEBOTS_HOME="$PWD/native-webots"
          for arm in control forced; do
            mkdir -p "evidence/d1/$arm"
            force=0; [[ "$arm" != forced ]] || force=1
            set +e
            H6_D1_FIXTURE_SLEEP_AT_TEARDOWN="$force" \
            H6_STANDALONE_R=1 H6_STANDALONE_TRACE=1 H6_D1_AUDIT=1 \
              timeout -k 5s 100s xvfb-run -a -s '-screen 0 1280x800x24' \
              "$WEBOTS_HOME/webots" --batch --mode=fast --no-rendering --stdout --stderr \
              "$PWD/experiments/h6_d1_adversarial/worlds/real_delete.wbt" \
              > "evidence/d1/$arm/webots.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "evidence/d1/$arm/exit.txt"
            echo "H6_D1_ARM $arm rc=$rc"
          done
      - name: Strict fail-closed owner=A disabled at real B destruction with negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/h6_d1_adversarial/qualify_asleep.py evidence/d1 \
            > evidence/d1/logs/qualification-asleep.log 2>&1 || {
              cat evidence/d1/logs/qualification-asleep.log; exit 92;
            }
          cat evidence/d1/logs/qualification-asleep.log
      - name: Retain traces and binary hashes on success or RED
        if: always()
        run: |
          mkdir -p evidence/d1/logs
          git rev-parse HEAD > evidence/d1/observed-reviewer-head.txt
          find evidence/d1 -type f ! -name SHA256SUMS.txt -print0 | sort -z \
            | xargs -0 -r sha256sum > evidence/d1/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-d1-foreign-asleep-real-Webots-native-discriminant
          path: evidence/d1/
          retention-days: 90
          if-no-files-found: error
