# A5 R2025a original sensors, private H-near/far × G-left/right sensor experiment.
name: Activity 5 independent H-G factors sensor probe (non-decision)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-progression-a5-factor-draft.yml'
      - 'worlds/scenes/reactive-L-factor-h*-g*-proto.wbo'
      - 'controllers/progression_reactive_L_factor_probe/**'
      - 'tools/ci/run_classroom_reactive_L_factor_probe.py'
      - 'tools/ci/test_progression_a5_factor_native.py'
      - 'controllers/progression_reactive_L_factor_motor_pilot/**'
      - 'plugins/robot_windows/a5_factor_motor_probe/**'
      - 'plugins/robot_windows/a5_alias_motor_probe/**'
      - 'tools/ci/prepare_classroom_reactive_L_factor_motor.py'
      - 'tools/ci/run_classroom_reactive_L_factor_motor.py'
      - 'tools/ci/run_classroom_reactive_L_factor_native_feeder.py'
      - 'tools/ci/test_progression_a5_factor_native_feeder.py'
      - 'tools/ci/test_progression_a5_factor_motor.py'
      - 'tools/ci/build_a5_private_blockly_witness.js'
      - 'plugins/robot_windows/a5_alias_motor_probe/a5_private_blockly_probe.js'
      - 'plugins/robot_windows/a5_alias_motor_probe/a5_alias_motor_probe.js'
      - 'plugins/robot_windows/a5_factor_motor_probe/a5_factor_motor_probe.js'
      - 'tools/ci/test_progression_a5_factorized_geometries.py'
      - 'tools/ci/test_workflow_contract.py'
permissions:
  contents: read
jobs:
  a5-factor-g-native-draft-only:
    name: A5 original Multi-ranger G-left G-right native (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Falsify source geometry and native experiment authority
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_progression_a5_factorized_geometries
          python3 -m unittest -v tools.ci.test_progression_a5_factor_native
          python3 -m unittest -v tools.ci.test_workflow_contract.WorkflowTests.test_a5_factor_draft_non_decision
      - name: Compile genuine original Crazyflie sensor probe in R2025a
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_factor_probe \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_factor_probe'
      - name: Measure A and B with original R2025a Multi-ranger without motors
        timeout-minutes: 8
        run: |
          set -euo pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_factor_probe.py'
      - name: Archive both original sensor streams even on physical rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-hfixed-gbinary-real-sensors-draft
          path: ci-artifacts/progression-reactive-L-factor/
          if-no-files-found: warn
  a5-factor-g-motor-draft-only:
    name: A5 genuine PID G-left G-right motor feasibility (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reject malformed seven-Solid worlds and missing native monitor
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_progression_a5_factor_motor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Runtime v2 Robot Window assets for Chrome
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          test -s plugins/robot_windows/blockly_v2/webots/RobotWindow.js
          test -s plugins/robot_windows/blockly/webeeblocks/wwi_backend.js
      - name: Prove one private real Blockly 13 loop-and-memory project in a virtual model
        run: |
          set -euo pipefail
          node tools/ci/build_a5_private_blockly_witness.js
          test -s ci-artifacts/progression-reactive-L-factor-blockly/a5-private-loop-state-ci-only.wbb
          test -s ci-artifacts/progression-reactive-L-factor-blockly/a5-private-fixed-front-ci-only.wbb
          test -s ci-artifacts/progression-reactive-L-factor-blockly/summary.json
      - name: Compile the unmodified R2025a product motor/PID and native monitor
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_factor_motor_pilot \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_factor_motor_pilot'
      - name: Motorized H/G A B C D plus blind G and wrong H landing pad
        timeout-minutes: 18
        run: |
          set -euo pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc '
              set -e
              python3 /workspace/tools/test_prepare_webots_apt.py
              python3 /workspace/tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics /workspace/ci-artifacts/progression-reactive-L-factor-motor
              printf "%s\\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              test -x /usr/bin/google-chrome
              python3 tools/ci/run_classroom_reactive_L_factor_motor.py
              python3 tools/ci/run_classroom_reactive_L_factor_motor.py --blind
              python3 tools/ci/run_classroom_reactive_L_factor_motor.py --blind-h
              python3 tools/ci/run_classroom_reactive_L_factor_motor.py --blockly
              python3 tools/ci/run_classroom_reactive_L_factor_motor.py --blockly-fixed
            '
      - name: Preserve C physical monitor, real steps and browser events even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-hfixed-gbinary-real-motor-draft
          path: |
            ci-artifacts/progression-reactive-L-factor-motor/
            ci-artifacts/progression-reactive-L-factor-blockly/
          if-no-files-found: warn
  a5-factor-g-native-pid-feeder-draft-only:
    name: A5 native WWI feeder product PID through G (no Chrome, not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reject feeder bypass of safety, sensor or mission authority
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_progression_a5_factor_native_feeder
      - name: Compile unchanged product R2025a PID plus opt-in C command feeder
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/controllers/progression_reactive_L_factor_motor_pilot \
            cyberbotics/webots:R2025a-ubuntu22.04 \
            bash -lc 'set -e; make clean; make; test -s progression_reactive_L_factor_motor_pilot'
      - name: Native G-left and G-right motor + Floor, then wrong-gap negative
        timeout-minutes: 18
        run: |
          set -euo pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc 'set -e; python3 tools/ci/run_classroom_reactive_L_factor_native_feeder.py; python3 tools/ci/run_classroom_reactive_L_factor_native_feeder.py --blind'
      - name: Preserve real native commands, contacts, Floor and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-hfixed-gbinary-real-native-feeder-draft
          path: ci-artifacts/progression-reactive-L-factor-native-feeder/
          if-no-files-found: warn

