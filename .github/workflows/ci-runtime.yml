          test -s ci-artifacts/runtime-v2-webots/browser-launch.log
          test -s "$EVENTS"
          grep -Fq 'WEBEEBLOCKS_RUNTIME_V2 CI READY_DELAY_BEGIN' "$LOG"
          grep -Fq 'WEBEEBLOCKS_RUNTIME_V2 CI READY_DELAY_END' "$LOG"
          grep -Fq 'WEBEEBLOCKS_RUNTIME_V2 READY' "$LOG"
          if grep -Fq 'WEBEEBLOCKS_RUNTIME_V2 FATAL' "$LOG"; then
            echo '::error::Runtime v2 emitted FATAL'
            exit 1
          fi
          if grep -Fq 'ERROR:' "$LOG"; then
            echo '::error::Webots log contains ERROR:'
            exit 1
          fi
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          event_path = Path('ci-artifacts/runtime-v2-webots/browser-events.jsonl')
          events = [json.loads(line) for line in event_path.read_text().splitlines() if line.strip()]
          print('BROWSER_EVENTS:')
          for event in events:
              print(json.dumps(event, ensure_ascii=False, sort_keys=True))

          browser_errors = [e for e in events if e.get('event') in ('ERROR', 'WINDOW_ERROR', 'UNHANDLED_REJECTION')]
          if browser_errors:
              first = browser_errors[0]
              raise AssertionError('first browser error: ' + json.dumps(first, ensure_ascii=False, sort_keys=True))

          version_events = [e for e in events if e.get('event') == 'BLOCKLY_VERSION']
          assert version_events, 'missing BLOCKLY_VERSION runtime event'
          assert version_events[0].get('detail') == '13.2.1', version_events[0]

          snapshots = [e.get('detail') for e in events if e.get('event') in ('HARNESS_START', 'DIAG', 'PRE_READY', 'READY', 'FINAL_DIAG') and isinstance(e.get('detail'), dict)]
          runtime_versions = [s.get('blocklyVersion') for s in snapshots if s.get('blocklyVersion')]
          assert '13.2.1' in runtime_versions, runtime_versions

          log = Path('ci-artifacts/runtime-v2-webots/webots.log').read_text(errors='replace')
          trace = []
          ranges = []
          for line in log.splitlines():
              if 'WEBEEBLOCKS_RUNTIME_V2 TRACE TAKEOFF' in line:
                  trace.append('TAKEOFF')
                  assert 'stop=1' in line
              elif 'WEBEEBLOCKS_RUNTIME_V2 TRACE RANGE front' in line:
                  trace.append('RANGE')
                  m = re.search(r'value=([0-9.]+)', line)
                  assert m, line
                  ranges.append(float(m.group(1)))
              elif 'WEBEEBLOCKS_RUNTIME_V2 TRACE MOVE ' in line:
                  m = re.search(r'TRACE MOVE (forward|back|left|right) distance=', line)
                  assert m and 'stop=1' in line, line
                  trace.append('MOVE_' + m.group(1).upper())
              elif 'WEBEEBLOCKS_RUNTIME_V2 TRACE TURN ' in line:
                  m = re.search(r'TRACE TURN angle_deg=([-0-9.]+)', line)
                  assert m and 'stop=1' in line, line
                  trace.append('TURN')
              elif 'WEBEEBLOCKS_RUNTIME_V2 TRACE LIGHT ' in line:
                  m = re.search(r'TRACE LIGHT color=(off|red|green|blue|yellow|white) rgb=([0-9a-f]{6})', line)
                  assert m, line
                  trace.append('LIGHT_' + m.group(1).upper())
              elif 'WEBEEBLOCKS_RUNTIME_V2 TRACE LAND' in line:
                  trace.append('LAND')
                  assert 'stop=1' in line
          expected = ['TAKEOFF','RANGE','MOVE_LEFT','RANGE','MOVE_FORWARD','RANGE','MOVE_LEFT','LAND','TAKEOFF','LIGHT_BLUE','LIGHT_OFF','LAND','TAKEOFF','MOVE_BACK','MOVE_RIGHT','TURN','TURN','LAND']
          assert trace == expected, (trace, expected)
          assert len(ranges) == 3, ranges

          starts = {}
          ends = {}
          for line in log.splitlines():
              m = re.search(r'CI MOVE_(START|END) (back|right) x=([-0-9.]+) y=([-0-9.]+) yaw=([-0-9.]+)', line)
              if not m:
                  continue
              sample = (float(m.group(3)), float(m.group(4)), float(m.group(5)))
              (starts if m.group(1) == 'START' else ends)[m.group(2)] = sample
          assert set(starts) == {'back','right'} and set(ends) == {'back','right'}, (starts, ends)
          import math
          def body_projection(direction):
              sx, sy, yaw = starts[direction]
              ex, ey, _ = ends[direction]
              dx, dy = ex - sx, ey - sy
              forward = dx * math.cos(yaw) + dy * math.sin(yaw)
              left = -dx * math.sin(yaw) + dy * math.cos(yaw)
              return forward, left
          back_forward, back_left = body_projection('back')
          right_forward, right_left = body_projection('right')
          assert back_forward < -0.12 and abs(back_left) < 0.08, (back_forward, back_left)
          assert right_left < -0.12 and abs(right_forward) < 0.08, (right_forward, right_left)

          turn_starts = []
          turn_ends = []
          for line in log.splitlines():
              m = re.search(
                  r'CI TURN_(START|END) angle_deg=([-0-9.]+) x=([-0-9.]+) y=([-0-9.]+) z=([-0-9.]+) yaw=([-0-9.]+) target_yaw=([-0-9.]+)',
                  line)
              if not m:
                  continue
              sample = tuple(map(float, m.groups()[1:]))
              (turn_starts if m.group(1) == 'START' else turn_ends).append(sample)
          assert len(turn_starts) == 2 and len(turn_ends) == 2, (turn_starts, turn_ends)
          def wrap_angle(angle):
              while angle > math.pi:
                  angle -= 2 * math.pi
              while angle <= -math.pi:
                  angle += 2 * math.pi
              return angle
          for start, end, expected_angle in zip(turn_starts, turn_ends, (30.0, -30.0)):
              angle, sx, sy, sz, syaw, target = start
              end_angle, ex, ey, ez, eyaw, end_target = end
              assert abs(angle - expected_angle) < 1e-6 and abs(end_angle - expected_angle) < 1e-6, (start, end)
              assert abs(wrap_angle(target - syaw) - math.radians(expected_angle)) < 0.03, start
              assert abs(wrap_angle(eyaw - end_target)) < math.radians(3.0), end
              assert abs(ex - sx) < 0.08 and abs(ey - sy) < 0.08 and abs(ez - sz) < 0.08, (start, end)
          assert ranges[0] < 0.5 and ranges[1] >= 0.5 and ranges[2] < 0.5, ranges

          def first_index(predicate, label):
              for index, event in enumerate(events):
                  if predicate(event):
                      return index
              raise AssertionError('missing event: ' + label)

          version = first_index(lambda e: e.get('event') == 'BLOCKLY_VERSION' and e.get('detail') == '13.2.1', 'BLOCKLY_VERSION 13.2.1')
          pre = first_index(lambda e: e.get('event') == 'PRE_READY', 'PRE_READY')
          guard = first_index(lambda e: e.get('event') == 'PRE_READY_GUARD_OK', 'PRE_READY_GUARD_OK')
          ready_rx = first_index(lambda e: e.get('event') == 'WWI_RX' and e.get('detail') == 'WEBEEBLOCKS_RUNTIME_V2 READY', 'READY WWI_RX')
          ready = first_index(lambda e: e.get('event') == 'READY', 'READY')
          ast = first_index(lambda e: e.get('event') == 'AST', 'AST')
          submit = first_index(lambda e: e.get('event') == 'SUBMIT', 'SUBMIT')
          color_led = first_index(lambda e: e.get('event') == 'COLOR_LED_OK', 'COLOR_LED_OK')
          horizontal = first_index(lambda e: e.get('event') == 'HORIZONTAL_MOVES_OK', 'HORIZONTAL_MOVES_OK')
          vertical = first_index(lambda e: e.get('event') == 'VERTICAL_MOVES_OK', 'VERTICAL_MOVES_OK')
          yaw_turns = first_index(lambda e: e.get('event') == 'YAW_TURNS_OK', 'YAW_TURNS_OK')
          done = first_index(lambda e: e.get('event') == 'DONE', 'DONE')
          assert version < pre < guard < ready_rx < ready < ast < submit < color_led < horizontal < vertical < yaw_turns < done, [(e.get('event'), e.get('detail')) for e in events]

          pre_detail = events[pre]['detail']
          guard_detail = events[guard]['detail']
          ready_detail = events[ready]['detail']
          assert pre_detail['blocklyVersion'] == '13.2.1', pre_detail
          assert ready_detail['blocklyVersion'] == '13.2.1', ready_detail
          assert pre_detail['backendReady'] is False and pre_detail['submitDisabled'] is True and pre_detail['state'] == 'INITIALISATION', pre_detail
          assert guard_detail['backendReady'] is False and guard_detail['submitDisabled'] is True and guard_detail['state'] == 'INITIALISATION', guard_detail
          assert guard_detail['backendNextId'] == pre_detail['backendNextId'], (pre_detail, guard_detail)
          assert guard_detail['backendPending'] == 0 and guard_detail['astEvents'] == 0 and guard_detail['runtimeRunning'] is False, guard_detail
          assert ready_detail['backendReady'] is True and ready_detail['submitDisabled'] is False and ready_detail['state'] == 'PRÊT', ready_detail

          states = [e.get('detail', {}).get('state') for e in events if e.get('event') == 'STATE' and isinstance(e.get('detail'), dict)]
          assert 'EN VOL' in states and 'TERMINÉ' in states, states
          print('PASS: Blockly.VERSION=13.2.1 -> causal pre-READY guard -> real READY -> Blockly AST -> RobotWindow WWI -> dynamic PID/STOP -> fresh range decisions.')
          PY

      - name: Upload Runtime v2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v2-webots-wwi-r2025a
          path: ci-artifacts/runtime-v2-webots/
          if-no-files-found: error
