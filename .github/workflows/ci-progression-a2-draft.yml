# Diagnostic only: physical Activity 2 pupil landing, not canonical CI Gate.
name: Activity 2 Draft native grounded Blockly witness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ci-progression-a2-draft.yml'
      - 'controllers/progression_altitude_v1/**'
      - 'tools/ci/test_progression_altitude_native.py'
      - 'tools/ci/run_classroom_altitude_pupil.py'
      - 'tools/ci/run_classroom_altitude_canopy.py'
      - 'plugins/robot_windows/altitude_canopy_probe/**'

permissions:
  contents: read

jobs:
  a2-grounded-flight-draft:
    name: A2 actual R2025a Blockly landing with native Floor contact (not CI Gate)
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compiled C11 contacts, obstacle failures and canonical scene
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.ci.test_progression_altitude_scene tools.ci.test_progression_altitude_native tools.ci.test_classroom_altitude_scene_ack
      - name: Prepare actual Blockly 13.2.1
        run: |
          set -euo pipefail
          ./tools/prepare_runtime_v2.sh
          test "$(cat plugins/robot_windows/blockly_v2/vendor/VERSION)" = "13.2.1"
      - name: Build two independent school Webots R2025a controllers
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/controllers/crazyflie_classroom_v2 \
            cyberbotics/webots:R2025a-ubuntu22.04 bash -lc 'set -e; make clean; make; test -s crazyflie_classroom_v2'
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/controllers/progression_altitude_v1 \
            cyberbotics/webots:R2025a-ubuntu22.04 bash -lc 'set -e; make clean; make; test -s progression_altitude_v1'
      - name: Fly real Blockly and falsify the no-ascent shortcut with native oracle
        timeout-minutes: 23
        run: |
          set -euo pipefail
          docker run --rm \
            -e LIBGL_ALWAYS_SOFTWARE=true \
            -e WEBOTS_DISABLE_SAVE_SCREEN_PERSPECTIVE_ON_CLOSE=true \
            -e WEBEEBLOCKS_CI_ARTIFACT_DIR=/workspace/ci-artifacts/progression-a2-floor-native \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            cyberbotics/webots@sha256:f0023e30daf38b172e4e6ad24ed345909bcd9551df34d63d824e121a7cebf099 \
            bash -lc '
              set -e
              python3 tools/test_prepare_webots_apt.py
              python3 tools/prepare_webots_apt.py
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wget ca-certificates >/dev/null
              wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb >/dev/null
              chmod +x /workspace/tools/ci/webots_runtime_v2_browser.sh
              mkdir -p /root/.config/Cyberbotics /workspace/ci-artifacts/progression-a2-floor-native
              printf "%s\n" "[RobotWindow]" "browser=/workspace/tools/ci/webots_runtime_v2_browser.sh" "newBrowserWindow=false" > /root/.config/Cyberbotics/Webots-R2025a.conf
              python3 tools/ci/run_classroom_altitude_pupil.py
              python3 tools/ci/run_classroom_altitude_canopy.py'
      - name: Retain native evidence, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-draft-grounded-and-no-ascent-r2025a
          path: ci-artifacts/progression-a2-floor-native/
          if-no-files-found: warn
