# Isolated non-decision assembly of the already compiled, exact-source support.
# Never merge this workflow-only qualification branch.
name: Experimental Windows Variable Grand Prix (non-decision)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-progression-assembly:
    name: Assemble and stage all 35 Windows routes (non-decision)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a5f186e07f91a3c06b4c475e2a188477af542518'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: grand-prix-variable-windows-experimental-r2025a
          run-id: '45804970133'
          github-token: ${{ github.token }}
          path: ci-artifacts/verified-support
      - name: Verify exact support, assemble and independently extract A1-A8
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne 'a5f186e07f91a3c06b4c475e2a188477af542518') { throw 'Source SHA mismatch' }
          $zip = 'ci-artifacts/verified-support/WebeeBlocks-Grand-Prix-Variable-Windows-R2025a.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '91275a61c3e1dd357e883cd6c6a8f84e2db94d97b2290c4c4ed3c02e7ad11e20') { throw 'Pinned support ZIP mismatch' }
          $support = 'ci-artifacts/EXTRACTED exact A8 support'
          python tools/ci/test_grand_prix_route_windows_package.py --archive $zip --extract-to $support
          if ($LASTEXITCODE -ne 0) { throw 'Support verification failed' }
          $output = 'ci-artifacts/qualification/WebeeBlocks-Progression-A1-A8-Windows-R2025a'
          python tools/grand_prix/package_windows_progression.py --source $support --output $output --include-a8
          if ($LASTEXITCODE -ne 0) { throw 'Unified composition failed' }
          python tools/ci/test_grand_prix_progression_windows_package.py --archive "$output.zip" --extract-to 'ci-artifacts/EXTRACTED unified progression with spaces' --include-a8
          if ($LASTEXITCODE -ne 0) { throw 'Independent unified ZIP verification failed' }
          Write-Host ('SOURCE_SHA=' + $sourceSha + ' SUPPORT_RUN=45804970133 SUPPORT_ARTIFACT=15109580713 SUPPORT_SHA256=' + $hash)
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\webots-R2025a_setup.exe
          key: webots-R2025a-windows-9e326a54c104fc5
      - name: Install exact verified native R2025a (no substitutions)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'webots-R2025a_setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Invoke-WebRequest -Uri 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe' -OutFile $installer
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9e326a54c104fc5fc88121e26014a409d1e35f0bbf30e23f3a712e7f842b08e7') {
            throw "Pinned Webots R2025a installer mismatch: $actual"
          }
          $webotsInstallRoot = Join-Path $env:ProgramFiles 'Webots'
          if (-not (Test-Path -LiteralPath (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe'))) {
            $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Webots install failed: $($p.ExitCode)" }
          }
          $version = (& (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'R2025a') { throw "Wrong native engine: $version" }
          "WEBOTS_HOME=$webotsInstallRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise every lesson and route in real Windows PowerShell 5.1
        shell: pwsh
        run: |
          $root = 'ci-artifacts/EXTRACTED unified progression with spaces'
          $front = Join-Path $root 'Lancer-Progression.ps1'
          $ps = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $counts = @(1,1,1,3,5,5,7,12)
          $journal = 'ci-artifacts/qualification/launcher-staging.log'
          $passed = 0
          for ($a = 1; $a -le 8; $a++) {
            for ($v = 1; $v -le $counts[$a-1]; $v++) {
              $result = (& $ps -NoProfile -ExecutionPolicy Bypass -File $front -Activite $a -Variante $v -WebotsHome $env:WEBOTS_HOME -ValidateOnly 2>&1 | Out-String)
              $code = $LASTEXITCODE
              Add-Content -LiteralPath $journal -Value ("A$a/V${v} exit=$code" + [Environment]::NewLine + $result)
              if ($code -ne 0 -or ([regex]::Matches($result, 'GP_ROUTE_WINDOWS_LAUNCHER_SESSION_STAGED_OK').Count -ne 1)) { throw "Windows staging failed A$a/V$v" }
              $passed++
            }
          }
          if ($passed -ne 35) { throw 'Incomplete staging' }
          Write-Host "PASS $passed/35 launcher sessions (not GUI or native flight)"
          python -c "from pathlib import Path; from tools.ci.test_grand_prix_progression_windows_package import verify; print(verify(Path(r'ci-artifacts/EXTRACTED unified progression with spaces'), True))"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted package changed during staging' }
      - name: Upload assembled and staged qualification-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: grand-prix-progression-a1-a8-windows-qualification
          path: |
            ci-artifacts/qualification/WebeeBlocks-Progression-A1-A8-Windows-R2025a.zip
            ci-artifacts/qualification/WebeeBlocks-Progression-A1-A8-Windows-R2025a.zip.sha256
            ci-artifacts/qualification/launcher-staging.log
          if-no-files-found: error
          retention-days: 14
      - name: Preserve staging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grand-prix-progression-assembly-failure
          path: ci-artifacts/qualification/launcher-staging.log
          if-no-files-found: warn
          retention-days: 14
