name: Experimental Windows Variable Grand Prix (non-decision)

on:
  pull_request:
    paths:
      - 'tools/grand_prix/package_windows_route.py'
      - 'tools/grand_prix/build_windows_route_controller.ps1'
      - 'tools/ci/*grand_prix_route_windows*'
      - 'packaging/windows/Lancer-Grand-Prix.ps1'
      - 'packaging/windows/grand_prix_route_evaluator_bootstrap.py'
      - 'docs/GRAND_PRIX_ROUTE_WINDOWS_EXPERIMENT.md'
      - '.github/workflows/grand-prix-variable-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-variable-route-experimental:
    name: Windows R2025a real product (Draft evidence only)
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: cyberbotics/webots
          ref: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
          path: .ci-webots-r2025a
          sparse-checkout: |
            /projects/robots/bitcraze/crazyflie/protos/
            /projects/default/protos/textures/fast_helix.png
            /projects/appearances/protos/textures/parquetry/chequered_parquetry_*.jpg
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Check sources and canonical 12-course selectors
        shell: pwsh
        run: |
          python -m py_compile tools/grand_prix/package_windows_route.py tools/ci/test_grand_prix_route_windows_package.py tools/ci/run_grand_prix_route_windows_native.py packaging/windows/grand_prix_route_evaluator_bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'Python source check failed' }
          node --check tools/ci/grand_prix_route_windows_node_probe.js
          if ($LASTEXITCODE -ne 0) { throw 'WWI probe JS syntax check failed' }
          python -c "from tools.grand_prix.route_courses_v2 import reference_course; assert len({reference_course(i).identifier for i in range(12)}) == 12"
          if ($LASTEXITCODE -ne 0) { throw 'Route identity check failed' }

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\webots-R2025a_setup.exe
          key: webots-R2025a-windows-9e326a54c104fc5
      - name: Install exact verified native R2025a (no substitutions)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'webots-R2025a_setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Invoke-WebRequest -Uri 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe' -OutFile $installer
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9e326a54c104fc5fc88121e26014a409d1e35f0bbf30e23f3a712e7f842b08e7') {
            throw "Pinned Webots R2025a installer mismatch: $actual"
          }
          $webotsInstallRoot = Join-Path $env:ProgramFiles 'Webots'
          if (-not (Test-Path -LiteralPath (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe'))) {
            $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Webots install failed: $($p.ExitCode)" }
          }
          $version = (& (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'R2025a') { throw "Wrong native engine: $version" }
          "WEBOTS_HOME=$webotsInstallRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reuse official Windows classroom dependency closure
        shell: pwsh
        run: |
          ./tools/build_windows_classroom_release.ps1 -WebotsHome $env:WEBOTS_HOME -WebotsProjectsPath '.ci-webots-r2025a\projects' -OutputDirectory 'ci-artifacts\windows-classroom'
          if ($LASTEXITCODE -ne 0) { throw 'Classroom asset staging failed' }

      - name: Compile REAL variable Grand Prix pilot
        shell: pwsh
        run: |
          ./tools/grand_prix/build_windows_route_controller.ps1 -WebotsHome $env:WEBOTS_HOME -PythonExe (Get-Command python).Source -ClassroomPackagePath 'ci-artifacts/windows-classroom/WebeeBlocks-Windows-R2025a'
          if ($LASTEXITCODE -ne 0) { throw 'Route pilot compilation failed' }

      - name: Reuse pinned isolated CPython support (not U evaluator)
        shell: pwsh
        run: |
          ./tools/grand_prix/build_windows_evaluator.ps1 -OutputDirectory 'ci-artifacts/windows-python'
          if ($LASTEXITCODE -ne 0) { throw 'Python support build failed' }

      - name: Compose 12 real variable worlds x 3 native FPS
        shell: pwsh
        run: |
          python tools/grand_prix/package_windows_route.py --classroom 'ci-artifacts/windows-classroom/WebeeBlocks-Windows-R2025a' --python-support 'ci-artifacts/windows-python/WebeeBlocks-Grand-Prix-Evaluator-Windows-R2025a' --webots-home $env:WEBOTS_HOME --output 'ci-artifacts/windows-route/WebeeBlocks-Grand-Prix-Variable-Windows-R2025a'
          if ($LASTEXITCODE -ne 0) { throw 'Real variable ZIP composition failed' }

      - name: Verify copied ZIP in independently extracted directory
        shell: pwsh
        run: |
          python tools/ci/test_grand_prix_route_windows_package.py --archive 'ci-artifacts/windows-route/WebeeBlocks-Grand-Prix-Variable-Windows-R2025a.zip' --extract-to 'ci-artifacts/EXTRACTED variable route with spaces'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted product inventory failed' }
          $env:WEBEEBLOCKS_GP_INDEX = '5'
          $env:WEBEEBLOCKS_GP_FPS = '30'
          & 'ci-artifacts/EXTRACTED variable route with spaces/Launch-WebeeBlocks.ps1' -WebotsHome $env:WEBOTS_HOME -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Extracted native launcher structural check failed' }

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mesa3d-24.2.1-release-mingw.7z
          key: ci-mesa3d-r2025a-24.2.1-f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214
      - name: Prepare pinned CI-only Windows software OpenGL
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa3d-24.2.1-release-mingw.7z'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            try {
              Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.2.1/mesa3d-24.2.1-release-mingw.7z' -OutFile $archive -ErrorAction Stop
            } catch {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/assets/189177330' -Headers @{Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28'} -OutFile $archive -ErrorAction Stop
            }
          }
          $digest=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214') { throw "Mesa native runner hash mismatch $digest" }
          $mesa=Join-Path $env:RUNNER_TEMP 'Webots Route CI Mesa'
          & 7z.exe x $archive "-o$mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Push-Location $mesa
          try {
            & .\systemwidedeploy.cmd 1
            if ($LASTEXITCODE -ne 0) { throw 'Mesa CI renderer installation failed' }
          } finally { Pop-Location }

      - name: Real Windows Webots extracted route 5 0 11 READY RESET dynamic rejection
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '3.3'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          python tools/ci/run_grand_prix_route_windows_native.py --package 'ci-artifacts/EXTRACTED variable route with spaces' --webots-home $env:WEBOTS_HOME --output 'ci-artifacts/windows-route-native'
          if ($LASTEXITCODE -ne 0) { throw 'Real extracted Webots Windows product did not qualify' }

      - name: Upload exact experimental Windows ZIP, SHA256 and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-prix-variable-windows-experimental-r2025a
          path: |
            ci-artifacts/windows-route/WebeeBlocks-Grand-Prix-Variable-Windows-R2025a.zip
            ci-artifacts/windows-route/WebeeBlocks-Grand-Prix-Variable-Windows-R2025a.zip.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native Windows campaign and rejection details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-prix-variable-windows-native-r2025a
          path: ci-artifacts/windows-route-native/
          if-no-files-found: warn
          retention-days: 14
