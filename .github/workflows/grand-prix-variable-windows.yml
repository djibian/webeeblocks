# Qualification-only: exact assembled ZIP, no rebuild, no product edits.
name: Experimental Windows Variable Grand Prix (non-decision)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  progression-native-smoke:
    name: Real Windows R2025a unified extracted package (non-decision)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a5f186e07f91a3c06b4c475e2a188477af542518'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: grand-prix-progression-a1-a8-windows-qualification
          run-id: '45810953220'
          github-token: ${{ github.token }}
          path: ci-artifacts/verified-unified
      - name: Verify exact assembled ZIP and independently extract
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'a5f186e07f91a3c06b4c475e2a188477af542518') { throw 'Source SHA mismatch' }
          $zip = 'ci-artifacts/verified-unified/WebeeBlocks-Progression-A1-A8-Windows-R2025a.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '113d2b8e716fbe94fcdd4d586b46994f13f7c789cd95af9e65fed2d518bdb918') { throw 'Unified ZIP mismatch' }
          python tools/ci/test_grand_prix_progression_windows_package.py --archive $zip --extract-to 'ci-artifacts/EXTRACTED unified native with spaces' --include-a8
          if ($LASTEXITCODE -ne 0) { throw 'Unified inventory failed' }
          Write-Host ('SOURCE_SHA=a5f186e07f91a3c06b4c475e2a188477af542518 ASSEMBLY_RUN=45810953220 ARTIFACT=15112872231 ZIP_SHA256=' + $hash)
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\webots-R2025a_setup.exe
          key: webots-R2025a-windows-9e326a54c104fc5
      - name: Install exact verified native R2025a (no substitutions)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'webots-R2025a_setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Invoke-WebRequest -Uri 'https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a_setup.exe' -OutFile $installer
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '9e326a54c104fc5fc88121e26014a409d1e35f0bbf30e23f3a712e7f842b08e7') {
            throw "Pinned Webots R2025a installer mismatch: $actual"
          }
          $webotsInstallRoot = Join-Path $env:ProgramFiles 'Webots'
          if (-not (Test-Path -LiteralPath (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe'))) {
            $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Webots install failed: $($p.ExitCode)" }
          }
          $version = (& (Join-Path $webotsInstallRoot 'msys64\mingw64\bin\webots.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'R2025a') { throw "Wrong native engine: $version" }
          "WEBOTS_HOME=$webotsInstallRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mesa3d-24.2.1-release-mingw.7z
          key: ci-mesa3d-r2025a-24.2.1-f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214
      - name: Prepare pinned CI-only Windows software OpenGL
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'mesa3d-24.2.1-release-mingw.7z'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            try {
              Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/24.2.1/mesa3d-24.2.1-release-mingw.7z' -OutFile $archive -ErrorAction Stop
            } catch {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/assets/189177330' -Headers @{Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28'} -OutFile $archive -ErrorAction Stop
            }
          }
          $digest=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'f8355fa7274d8414f88160f0f0af3469bf0f9f192f84d7a7ffb06a4887ceb214') { throw "Mesa native runner hash mismatch $digest" }
          $mesa=Join-Path $env:RUNNER_TEMP 'Webots Route CI Mesa'
          & 7z.exe x $archive "-o$mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Push-Location $mesa
          try {
            & .\systemwidedeploy.cmd 1
            if ($LASTEXITCODE -ne 0) { throw 'Mesa CI renderer installation failed' }
          } finally { Pop-Location }

      - name: Native WWI smoke A1 V1, A6 V5, A7 V7 and A8 V12
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '3.3'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          @'
          import hashlib, json, os, sys
          from pathlib import Path
          from tools.ci.test_grand_prix_progression_windows_package import verify
          from tools.ci.run_grand_prix_route_windows_native import run_one, probe_windows_entropy
          if sys.platform != "win32":
              raise RuntimeError("Native Windows only")
          package = Path("ci-artifacts/EXTRACTED unified native with spaces").resolve()
          home = Path(os.environ["WEBOTS_HOME"]).resolve()
          output = Path("ci-artifacts/unified-native-smoke").resolve()
          if (home / "resources/version.txt").read_text().strip() != "R2025a":
              raise RuntimeError("Wrong engine")
          before = verify(package, True)
          output.mkdir(parents=True, exist_ok=False)
          results = []
          try:
              probe_windows_entropy(home, output)
              for index in (0, 15, 22, 34):
                  results.append(run_one(package, home, output, index))
                  (output / "campaign.json").write_text(json.dumps({"package":before,
                      "results":results,"gui":"UNPROVEN","teacher":"UNPROVEN",
                      "scope":"native WWI smoke only"},indent=2)+"\n")
              if verify(package, True) != before:
                  raise RuntimeError("Extracted package changed during trials")
              print("PASS unified 4/35 native WWI smoke; no GUI, full mission or teacher PASS")
          finally:
              hashes = {p.relative_to(output).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in output.rglob("*") if p.is_file() and p.name!="sha256.json"}
              (output / "sha256.json").write_text(json.dumps(hashes,sort_keys=True,indent=2)+"\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native unified smoke failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-progression-a1-a8-windows-native-smoke
          path: ci-artifacts/unified-native-smoke/
          if-no-files-found: warn
          retention-days: 14
