name: Grand Prix classroom static-scene unit checks
on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/PRODUCT_VISION.md
      - docs/ROADMAP.md
      - docs/GRAND_PRIX_ROUTE_CONTRACT.md
      - tools/grand_prix/evaluator_publisher_v2.py
      - tools/ci/test_grand_prix_evaluator_publisher_v2.py
      - .github/workflows/grand-prix-classroom-static-scene.yml
permissions:
  contents: read
jobs:
  static-scene-host:
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify source syntax and targeted fakes
        run: |
          python3 -m py_compile tools/grand_prix/evaluator_publisher_v2.py tools/ci/test_grand_prix_evaluator_publisher_v2.py
          python3 -m unittest -v tools.ci.test_grand_prix_evaluator_publisher_v2 tools.ci.test_grand_prix_evaluator_scene_identity_v2 tools.ci.test_grand_prix_native_scene_snapshot_v2
