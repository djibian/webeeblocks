name: H6 independent R memory and MT adversarial ODE (NON-GATE)
on:
  push:
    branches:
      - experiment/h6-r-memory-mt-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h6-r-memory-mt-20261030
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      WEBOTS_PIN: c6793d8f7230a311c4bc2a3101d9f1a8bc0aa01b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate exact experiment and upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h6-memory-evidence/logs
          git rev-parse HEAD > h6-memory-evidence/experiment-commit.txt
          sha256sum experiments/h6/ode_r_memory_mt_independent.cpp > h6-memory-evidence/probe-source.sha256
          git clone --filter=blob:none --no-checkout https://github.com/cyberbotics/webots.git native-webots > h6-memory-evidence/logs/clone.log 2>&1
          git -C native-webots checkout --detach "$WEBOTS_PIN" > h6-memory-evidence/logs/checkout.log 2>&1
          test "$(git -C native-webots rev-parse HEAD)" = "$WEBOTS_PIN"
          test -z "$(git -C native-webots status --porcelain)"
          git -C native-webots rev-parse HEAD > h6-memory-evidence/webots-source-commit.txt
      - name: Compile pinned ODE and run syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I native-webots/include/ode experiments/h6/ode_r_memory_mt_independent.cpp > h6-memory-evidence/logs/syntax.log 2>&1 || {
            cat h6-memory-evidence/logs/syntax.log; exit 1;
          }
          export WEBOTS_HOME="$PWD/native-webots"
          make -C native-webots/src/ode -j2 release > h6-memory-evidence/logs/ode-build.log 2>&1 || {
            tail -n 120 h6-memory-evidence/logs/ode-build.log; exit 1;
          }
          test -f native-webots/lib/webots/libode.so
          sha256sum native-webots/lib/webots/libode.so > h6-memory-evidence/libode.sha256
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -pthread -I native-webots/include/ode \
            experiments/h6/ode_r_memory_mt_independent.cpp \
            -L "$PWD/native-webots/lib/webots" -Wl,-rpath,"$PWD/native-webots/lib/webots" \
            -lode -o h6-memory-evidence/probe
          sha256sum h6-memory-evidence/probe > h6-memory-evidence/probe-binary.sha256
      - name: Execute memory-arm factorial with precise group counts
        shell: bash
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 120s h6-memory-evidence/probe \
            > h6-memory-evidence/memory.jsonl 2>h6-memory-evidence/logs/memory-stderr.log
          python3 - <<'PY'
          import json,pathlib
          ls=pathlib.Path('h6-memory-evidence/memory.jsonl').read_text().splitlines()
          assert ls[-1]=='H6_MEMORY_NATIVE_COMPLETED',ls[-1]
          rows=[json.loads(x) for x in ls[:-1]]
          for arm in ('R_only_disabled_owner','R_marked_cleanup_mixed','R_empty_only_mixed','R_empty_only_simple'):
              t={r['cycle']:r for r in rows if r.get('arm')==arm and 'cycle' in r}
              assert set(t)=={1,64,512,2048,8192}, (arm,t)
              for n,r in t.items():
                  assert r['owner_disabled']==1 and r['permanent_survives']==1
                  expected=0 if arm in ('R_marked_cleanup_mixed','R_empty_only_simple') else n+1
                  assert r['group_allocated']==expected,(arm,n,r)
                  if arm=='R_marked_cleanup_mixed': assert r['legitimate_survives']==0
                  if arm in ('R_only_disabled_owner','R_empty_only_mixed'): assert r['legitimate_survives']==1
          physics={r['G']:r for r in rows if r['arm']=='no_RESET'}
          assert set(physics)=={0,1} and physics[0]['speed']>0.5 and physics[1]['speed']==0
          report={
            'qualification':'MODELS ONLY: Webots-pinned native ODE, not Webots scheduler/RESET timing',
            'R_only_allocation_unbounded_under_disabling':'PROVEN for this fixture',
            'R_marked_cleanup_destroys_legitimate_contact':'PROVEN for this fixture',
            'R_empty_only_simple_bounded':'PROVEN for this fixture',
            'R_empty_only_mixed_not_bounded':'PROVEN for this fixture',
            'G_no_reset_changes_solver':'PROVEN for this fixture',
            'webots_real_reachability':'UNPROVEN',
            'memory_rows':rows}
          pathlib.Path('h6-memory-evidence/qualification.json').write_text(json.dumps(report,indent=2)+'\n')
          print('H6_MEMORY_FACTORIAL_AUDITED')
          PY
      - name: Memory oracle includes post-solver active contact negative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(s) for s in pathlib.Path('h6-memory-evidence/memory.jsonl').read_text().splitlines()[:-1]]
          x=[r for r in rows if r.get('arm')=='postsolver_marked_cleanup']
          assert len(x)==1 and x[0]['legitimate_before']==1 and x[0]['legitimate_after']==0 and x[0]['allocated_after']==0
          print('H6_POSTSOLVER_CONTACT_LOSS_PROVEN')
          PY
      - name: Address and undefined-behavior sanitizers on all memory fixtures
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I native-webots/include/ode experiments/h6/ode_r_memory_mt_independent.cpp \
            -L "$PWD/native-webots/lib/webots" -Wl,-rpath,"$PWD/native-webots/lib/webots" \
            -lode -o h6-memory-evidence/probe-asan
          sha256sum h6-memory-evidence/probe-asan > h6-memory-evidence/probe-asan.sha256
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 120s h6-memory-evidence/probe-asan \
            > h6-memory-evidence/asan-memory.jsonl 2>h6-memory-evidence/logs/asan-stderr.log || {
              cat h6-memory-evidence/logs/asan-stderr.log; exit 1;
            }
          grep -Fxq 'H6_MEMORY_NATIVE_COMPLETED' h6-memory-evidence/asan-memory.jsonl
          echo 'H6_SANITIZER_PROBE_PASS (ODE shared library uninstrumented)'
      - name: Execute Webots-equivalent ODE mono-thread step boundary
        shell: bash
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 25s h6-memory-evidence/probe mono \
            > h6-memory-evidence/mono.jsonl 2>h6-memory-evidence/logs/mono-stderr.log || {
              cat h6-memory-evidence/logs/mono-stderr.log; exit 1;
            }
          python3 - <<'PY'
          import json,pathlib
          rows=pathlib.Path('h6-memory-evidence/mono.jsonl').read_text().splitlines()
          assert rows[-1]=='H6_MEMORY_NATIVE_COMPLETED'
          r=json.loads(rows[0])
          assert r['threads']==0 and r['steps']==64 and r['contacts']==r['reset_detached'] and r['end_allocated']==0
          print('H6_MONO_BOUNDARY_PASS')
          PY
      - name: Falsify multithread ODE two-worker step-return boundary
        shell: bash
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 35s h6-memory-evidence/probe multi \
            > h6-memory-evidence/multi.jsonl 2>h6-memory-evidence/logs/multi-stderr.log || {
              cat h6-memory-evidence/logs/multi-stderr.log; exit 1;
            }
          python3 - <<'PY'
          import json,pathlib
          rows=pathlib.Path('h6-memory-evidence/multi.jsonl').read_text().splitlines()
          assert rows[-1]=='H6_MEMORY_NATIVE_COMPLETED'
          r=json.loads(rows[0])
          assert r['threads']==2 and r['steps']==64 and r['contacts']==r['reset_detached'] and r['end_allocated']==0
          print('H6_MULTITHREAD_BOUNDARY_PASS')
          PY
      - name: Probe actual ODE arena allocator retention and reuse
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O0 -Wall -Wextra -Werror \
            -I native-webots/include/ode experiments/h6/ode_arena_lifetime_independent.cpp \
            -L "$PWD/native-webots/lib/webots" -Wl,-rpath,"$PWD/native-webots/lib/webots" \
            -lode -o h6-memory-evidence/arena-probe
          sha256sum experiments/h6/ode_arena_lifetime_independent.cpp > h6-memory-evidence/arena-source.sha256
          sha256sum h6-memory-evidence/arena-probe > h6-memory-evidence/arena-binary.sha256
          LD_LIBRARY_PATH="$PWD/native-webots/lib/webots" timeout 40s h6-memory-evidence/arena-probe \
            > h6-memory-evidence/arena.jsonl 2>h6-memory-evidence/logs/arena-stderr.log || {
              cat h6-memory-evidence/logs/arena-stderr.log; exit 1;
            }
          python3 - <<'PY'
          import json,pathlib
          raw=pathlib.Path('h6-memory-evidence/arena.jsonl').read_text().splitlines()
          assert raw[-1]=='H6_ODE_ARENA_ALLOCATION_PASS'
          rows=[json.loads(x) for x in raw[:-1]]
          assert [x['phase'] for x in rows]==[
            'before_first','after_first_8192','after_group_empty',
            'after_refill_8192','after_second_empty','after_group_destroy']
          a={x['phase']:x for x in rows}
          assert a['after_first_8192']['group_joint_count']==8192
          assert a['after_group_empty']['group_joint_count']==0
          assert a['after_refill_8192']['group_joint_count']==8192
          assert a['after_second_empty']['group_joint_count']==0
          assert a['after_group_empty']['allocated_bytes']+131072>=a['after_first_8192']['allocated_bytes']
          assert a['after_refill_8192']['allocated_bytes']<=a['after_first_8192']['allocated_bytes']+131072
          assert a['after_second_empty']['allocated_bytes']>a['after_group_destroy']['allocated_bytes']+131072
          print('H6_ARENA_RETAIN_REUSE_DEALLOCATE_PASS')
          PY
      - name: Preserve immutable checksums on every outcome
        if: always()
        shell: bash
        run: |
          mkdir -p h6-memory-evidence/logs
          git rev-parse HEAD > h6-memory-evidence/observed-commit.txt
          find h6-memory-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > h6-memory-evidence/SHA256SUMS.txt
      - name: Archive raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H6-R-memory-MT-independent-ODE
          path: h6-memory-evidence/
          retention-days: 30
          if-no-files-found: error
