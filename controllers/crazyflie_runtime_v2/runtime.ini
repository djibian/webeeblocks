; Runtime v2 native broker uses the Qt libraries and plugins shipped with Webots.
; Official Webots controller runtime.ini mechanism prepares the platform-specific
; runtime paths before starting the controller process.

[environment variables for Linux]
WEBOTS_LIBRARY_PATH = $(WEBOTS_HOME)/lib/webots
QT_PLUGIN_PATH = $(WEBOTS_HOME)/lib/webots/qt/plugins

[environment variables for Windows]
WEBOTS_LIBRARY_PATH = "$(WEBOTS_HOME)/lib/controller;$(WEBOTS_HOME)/msys64/mingw64/bin"
QT_PLUGIN_PATH = "$(WEBOTS_HOME)/msys64/mingw64/share/qt6/plugins"
