<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>A2 activity runtime contract</title>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/blockly_uncompressed.js"></script>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/msg/js/en.js"></script>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/logic.js"></script>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/loops.js"></script>
<script src="../../plugins/robot_windows/blockly/google-blockly-31ee4ea/blocks/math.js"></script>
<script src="experimental_blocks.js"></script>
<script src="frozen_extended_blocks.js"></script><script src="frozen_interpreter.js"></script><script src="activity_contract.js"></script>
</head><body><div id="blocklyDiv" style="height:320px;width:100%"></div><pre id="result">RUNNING</pre>
<xml id="program" style="display:none"><block type="webeeblocks_exp_takeoff"><field name="HEIGHT">0.5</field><next><block type="controls_repeat_ext"><value name="TIMES"><block type="math_number"><field name="NUM">3</field></block></value><statement name="DO"><block type="controls_if"><mutation else="1"></mutation><value name="IF0"><block type="logic_compare"><field name="OP">LT</field><value name="A"><block type="webeeblocks_exp_range"><field name="DIRECTION">front</field></block></value><value name="B"><block type="math_number"><field name="NUM">0.5</field></block></value></block></value><statement name="DO0"><block type="webeeblocks_exp_move"><field name="DIRECTION">left</field><field name="DISTANCE">0.3</field></block></statement><statement name="ELSE"><block type="webeeblocks_exp_move"><field name="DIRECTION">forward</field><field name="DISTANCE">0.3</field></block></statement></block></statement><next><block type="webeeblocks_exp_land"></block></next></block></next></block></xml>
<script>(async function(){const out=document.getElementById('result');function assert(x,m){if(!x)throw new Error(m);}function backendWith(rangeDirections){const b=new WebeeBlocksReactiveInterpreter.ScriptedBackend({front:[0.4,0.8,0.3]});b.capabilities={actions:['takeoff','move','land'],rangeDirections:rangeDirections.slice()};return b;}try{const doc=await (await fetch('profiles.json')).json();const by=id=>doc.profiles.find(p=>p.id===id);const good=by('reactive-front-enabled'),noMove=by('reactive-front-no-move'),noRange=by('reactive-no-range');
assert(good.world===noMove.world&&good.world===noRange.world,'profiles must reuse one world');
const goodTool=WebeeBlocksActivityRuntimeContract.toolboxXml(good),restrictedTool=WebeeBlocksActivityRuntimeContract.toolboxXml(noMove);assert(goodTool.includes('webeeblocks_exp_move')&&!restrictedTool.includes('webeeblocks_exp_move'),'profile must change visible toolbox');
const ws=Blockly.inject('blocklyDiv',{toolbox:goodTool});Blockly.Xml.domToWorkspace(document.getElementById('program'),ws);WebeeBlocksActivityRuntimeContract.applyFieldBounds(good,ws);const move=ws.getAllBlocks(false).find(b=>b.type==='webeeblocks_exp_move');assert(move,'move block missing');move.getField('DISTANCE').setValue(0.8);assert(Number(move.getFieldValue('DISTANCE'))===0.5,'profile FieldNumber max not applied');move.getField('DISTANCE').setValue(0.3);
const backend=backendWith(['front']);const ast=WebeeBlocksActivityRuntimeContract.execute(good,ws,WebeeBlocksExtended,WebeeBlocksReactiveInterpreter,backend);const moves=backend.trace.filter(x=>x.op==='move').map(x=>x.direction);assert(JSON.stringify(moves)===JSON.stringify(['left','forward','left']),'reactive execution trace differs');
let rejected=false;const before=backend.trace.length;try{WebeeBlocksActivityRuntimeContract.execute(noMove,ws,WebeeBlocksExtended,WebeeBlocksReactiveInterpreter,backend);}catch(e){rejected=/block forbidden by profile/.test(String(e));}assert(rejected&&backend.trace.length===before,'known-but-forbidden block must fail before action');
const backend2=backendWith(['front']);rejected=false;try{WebeeBlocksActivityRuntimeContract.execute(noRange,ws,WebeeBlocksExtended,WebeeBlocksReactiveInterpreter,backend2);}catch(e){rejected=/range capability unavailable in profile/.test(String(e));}assert(rejected&&backend2.trace.length===0,'missing profile sensor capability must fail before TAKEOFF/action');
const backend3=backendWith([]);rejected=false;try{WebeeBlocksActivityRuntimeContract.execute(good,ws,WebeeBlocksExtended,WebeeBlocksReactiveInterpreter,backend3);}catch(e){rejected=/backend range capability unavailable: front/.test(String(e));}assert(rejected&&backend3.trace.length===0,'backend missing range(front) must fail before TAKEOFF/action');
const wideAst=JSON.parse(JSON.stringify(ast));wideAst.program[1].body[0].then[0].distance_m=0.6;rejected=false;try{WebeeBlocksActivityRuntimeContract.preflightAst(good,wideAst);}catch(e){rejected=/outside profile bounds/.test(String(e));}assert(rejected,'AST bound drift was not rejected');
const leftAst=JSON.parse(JSON.stringify(ast));leftAst.program[1].body[0].condition.left.direction='left';rejected=false;try{WebeeBlocksActivityRuntimeContract.preflightAst(good,leftAst);}catch(e){rejected=/range capability unavailable in profile: left/.test(String(e));}assert(rejected,'categorical range(left) drift was not rejected by profile');
out.textContent='PASS A2 profile -> toolbox -> Blockly -> AST -> profile/backend preflight -> interpreter';out.dataset.status='PASS';}catch(e){out.textContent='FAIL '+e.stack;out.dataset.status='FAIL';}})();</script></body></html>
